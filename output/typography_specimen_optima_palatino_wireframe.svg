<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .grid-line { 
        stroke: #E0E0E0; 
        stroke-width: 0.5px; 
        fill: none; 
        opacity: 0.4; 
      }
      .grid-major { 
        stroke: #BDBDBD; 
        stroke-width: 1.5px; 
        fill: none; 
      }
      .header-block { 
        fill: #1A56A0; 
        fill-opacity: 0.2; 
        stroke: #1A56A0; 
        stroke-width: 1px; 
      }
      .character-grid { 
        fill: #4A90D9; 
        fill-opacity: 0.15; 
        stroke: #4A90D9; 
        stroke-width: 0.5px; 
      }
      .character-highlight { 
        fill: #1A56A0; 
        fill-opacity: 0.6; 
        stroke: #1A56A0; 
        stroke-width: 1px; 
      }
      .specimen-text { 
        fill: #4A90D9; 
        fill-opacity: 0.25; 
        stroke: #4A90D9; 
        stroke-width: 1px; 
      }
      .technical-info { 
        fill: #7BB3E0; 
        fill-opacity: 0.2; 
        stroke: #7BB3E0; 
        stroke-width: 0.5px; 
      }
      .label { 
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; 
        font-size: 8px; 
        fill: #666666; 
      }
      .measurement { 
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; 
        font-size: 7px; 
        fill: #CC3333; 
        font-weight: bold; 
      }
      .specimen-grid {
        stroke: #33AA33;
        stroke-width: 0.5px;
        stroke-dasharray: 2,1;
        fill: none;
        opacity: 0.6;
      }
    </style>
  </defs>
  
  <!-- Page divide -->
  <line x1="400" y1="0" x2="400" y2="500" class="grid-major"/>
  
  <!-- LEFT PAGE: Optima Nova Specimen -->
  
  <!-- Header information area -->
  <rect x="20" y="20" width="360" height="30" class="header-block"/>
  <text x="25" y="35" class="label">OPTIMA NOVA - Header Information</text>
  <text x="25" y="43" class="label">Specimen details, weights, designer info</text>
  
  <!-- Character grid system (15×6 grid) -->
  <!-- Grid structure guidelines -->
  <g class="specimen-grid">
    <line x1="40" y1="60" x2="380" y2="60"/>
    <line x1="40" y1="90" x2="380" y2="90"/>
    <line x1="40" y1="120" x2="380" y2="120"/>
    <line x1="40" y1="150" x2="380" y2="150"/>
    <line x1="40" y1="180" x2="380" y2="180"/>
    <line x1="40" y1="210" x2="380" y2="210"/>
    <!-- Vertical grid lines -->
    <line x1="60" y1="60" x2="60" y2="210"/>
    <line x1="100" y1="60" x2="100" y2="210"/>
    <line x1="140" y1="60" x2="140" y2="210"/>
    <line x1="180" y1="60" x2="180" y2="210"/>
    <line x1="220" y1="60" x2="220" y2="210"/>
    <line x1="260" y1="60" x2="260" y2="210"/>
    <line x1="300" y1="60" x2="300" y2="210"/>
    <line x1="340" y1="60" x2="340" y2="210"/>
  </g>
  
  <!-- Character grid cells -->
  <rect x="40" y="60" width="20" height="25" class="character-grid"/>
  <rect x="70" y="60" width="20" height="25" class="character-grid"/>
  <rect x="100" y="60" width="20" height="25" class="character-grid"/>
  
  <!-- Highlighted characters (black squares) -->
  <rect x="40" y="90" width="20" height="25" class="character-highlight"/>
  <text x="47" y="102" class="label" fill="white">A</text>
  <rect x="180" y="120" width="20" height="25" class="character-highlight"/>
  <text x="187" y="132" class="label" fill="white">R</text>
  <rect x="220" y="150" width="20" height="25" class="character-highlight"/>
  <text x="227" y="162" class="label" fill="white">E</text>
  
  <!-- Additional character cells -->
  <rect x="70" y="90" width="20" height="25" class="character-grid"/>
  <rect x="100" y="90" width="20" height="25" class="character-grid"/>
  <rect x="130" y="90" width="20" height="25" class="character-grid"/>
  <rect x="160" y="90" width="20" height="25" class="character-grid"/>
  <rect x="190" y="90" width="20" height="25" class="character-grid"/>
  <rect x="220" y="90" width="20" height="25" class="character-grid"/>
  
  <!-- Sample text blocks -->
  <rect x="40" y="230" width="150" height="40" class="specimen-text"/>
  <text x="45" y="242" class="label">ABCabc123..?!</text>
  <text x="45" y="252" class="label">Character samples</text>
  <text x="45" y="262" class="label">Different weights</text>
  
  <rect x="200" y="230" width="180" height="60" class="specimen-text"/>
  <text x="205" y="242" class="label">Paragraph specimen text showing</text>
  <text x="205" y="252" class="label">the typeface in use context</text>
  <text x="205" y="262" class="label">Multiple lines of content</text>
  <text x="205" y="272" class="label">demonstrating readability</text>
  
  <!-- Technical information -->
  <rect x="40" y="310" width="340" height="80" class="technical-info"/>
  <text x="45" y="322" class="label">Technical Information & Character Details</text>
  <text x="45" y="332" class="label">Designer, foundry, year</text>
  <text x="45" y="342" class="label">Available weights and styles</text>
  <text x="45" y="352" class="label">Character set information</text>
  
  <!-- LEFT PAGE MEASUREMENTS -->
  <text x="20" y="15" class="measurement">LEFT: OPTIMA NOVA SPECIMEN GRID</text>
  <text x="20" y="10" class="measurement">15×6 character matrix + specimen text</text>
  
  <!-- RIGHT PAGE: Palatino Sans (Mirror Layout) -->
  
  <!-- Header information area -->
  <rect x="420" y="20" width="360" height="30" class="header-block"/>
  <text x="425" y="35" class="label">PALATINO SANS - Header Information</text>
  <text x="425" y="43" class="label">Specimen details, weights, designer info</text>
  
  <!-- Character grid system (identical structure) -->
  <g class="specimen-grid">
    <line x1="440" y1="60" x2="780" y2="60"/>
    <line x1="440" y1="90" x2="780" y2="90"/>
    <line x1="440" y1="120" x2="780" y2="120"/>
    <line x1="440" y1="150" x2="780" y2="150"/>
    <line x1="440" y1="180" x2="780" y2="180"/>
    <line x1="440" y1="210" x2="780" y2="210"/>
    <!-- Vertical grid lines -->
    <line x1="460" y1="60" x2="460" y2="210"/>
    <line x1="500" y1="60" x2="500" y2="210"/>
    <line x1="540" y1="60" x2="540" y2="210"/>
    <line x1="580" y1="60" x2="580" y2="210"/>
    <line x1="620" y1="60" x2="620" y2="210"/>
    <line x1="660" y1="60" x2="660" y2="210"/>
    <line x1="700" y1="60" x2="700" y2="210"/>
    <line x1="740" y1="60" x2="740" y2="210"/>
  </g>
  
  <!-- Character grid cells -->
  <rect x="440" y="60" width="20" height="25" class="character-grid"/>
  <rect x="470" y="60" width="20" height="25" class="character-grid"/>
  <rect x="500" y="60" width="20" height="25" class="character-grid"/>
  
  <!-- Highlighted characters (different selection) -->
  <rect x="440" y="90" width="20" height="25" class="character-highlight"/>
  <text x="447" y="102" class="label" fill="white">A</text>
  <rect x="500" y="120" width="20" height="25" class="character-highlight"/>
  <text x="507" y="132" class="label" fill="white">Q</text>
  <rect x="580" y="150" width="20" height="25" class="character-highlight"/>
  <text x="587" y="162" class="label" fill="white">R</text>
  
  <!-- Additional character cells -->
  <rect x="470" y="90" width="20" height="25" class="character-grid"/>
  <rect x="500" y="90" width="20" height="25" class="character-grid"/>
  <rect x="530" y="90" width="20" height="25" class="character-grid"/>
  <rect x="560" y="90" width="20" height="25" class="character-grid"/>
  <rect x="590" y="90" width="20" height="25" class="character-grid"/>
  <rect x="620" y="90" width="20" height="25" class="character-grid"/>
  
  <!-- Sample text blocks (mirror layout) -->
  <rect x="440" y="230" width="150" height="40" class="specimen-text"/>
  <text x="445" y="242" class="label">ABCabc123..?!</text>
  <text x="445" y="252" class="label">Character samples</text>
  <text x="445" y="262" class="label">Different weights</text>
  
  <rect x="600" y="230" width="180" height="60" class="specimen-text"/>
  <text x="605" y="242" class="label">Paragraph specimen text showing</text>
  <text x="605" y="252" class="label">the typeface in use context</text>
  <text x="605" y="262" class="label">Multiple lines of content</text>
  <text x="605" y="272" class="label">demonstrating readability</text>
  
  <!-- Technical information -->
  <rect x="440" y="310" width="340" height="80" class="technical-info"/>
  <text x="445" y="322" class="label">Technical Information & Character Details</text>
  <text x="445" y="332" class="label">Designer, foundry, year</text>
  <text x="445" y="342" class="label">Available weights and styles</text>
  <text x="445" y="352" class="label">Character set information</text>
  
  <!-- RIGHT PAGE MEASUREMENTS -->
  <text x="420" y="15" class="measurement">RIGHT: PALATINO SANS SPECIMEN GRID</text>
  <text x="420" y="10" class="measurement">Identical structure for comparison</text>
  
  <!-- COMPARATIVE SYSTEM INDICATORS -->
  <line x1="200" y1="400" x2="600" y2="400" class="grid-major" stroke-dasharray="5,5"/>
  <text x="350" y="415" class="measurement" text-anchor="middle">MIRROR COMPARISON SYSTEM</text>
  <text x="350" y="425" class="measurement" text-anchor="middle">Identical grid structure enables direct typeface comparison</text>
  
  <!-- Grid system measurements -->
  <text x="40" y="450" class="measurement">CHARACTER GRID: 15 columns × 6 rows</text>
  <text x="40" y="460" class="measurement">CELL SIZE: ~20px × 25px units</text>
  <text x="40" y="470" class="measurement">HIGHLIGHT SYSTEM: Selected characters in black</text>
  <text x="40" y="480" class="measurement">SPECIMEN BLOCKS: Multiple text sizes and weights</text>
  
  <!-- Comparison arrows -->
  <polygon points="380,150 390,145 390,150 395,150 395,155 390,155 390,160" class="character-highlight"/>
  <polygon points="420,150 410,145 410,150 405,150 405,155 410,155 410,160" class="character-highlight"/>
  <text x="385" y="140" class="measurement" style="font-size: 6px;">Compare</text>
</svg>