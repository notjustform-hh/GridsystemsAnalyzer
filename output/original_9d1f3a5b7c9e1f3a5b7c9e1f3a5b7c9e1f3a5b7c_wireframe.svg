<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1400 1000" 
     role="img" aria-label="Grid analysis: Avenir Next vs Eurostile Next Typography Specimen">

  <!-- LAYER 1: Page Frame & Margins -->
  <g id="layer-page" data-layer="page">
    <!-- Overall spread boundary -->
    <rect x="0" y="0" width="1400" height="900" 
          fill="none" stroke="#FF00FF" stroke-width="2" stroke-dasharray="5,5"/>
    <!-- Spread label -->
    <text x="700" y="15" text-anchor="middle" fill="#FF00FF" 
          font-family="monospace" font-size="12px" font-weight="bold">DOUBLE-PAGE SPREAD: 1400 × 900px</text>
    
    <!-- Left page boundary -->
    <rect x="30" y="30" width="650" height="840" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="35" y="25" fill="#FF00FF" font-family="monospace" font-size="10px">LEFT PAGE: Avenir Next</text>
    
    <!-- Right page boundary -->
    <rect x="720" y="30" width="650" height="840" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="1045" y="25" fill="#FF00FF" font-family="monospace" font-size="10px">RIGHT PAGE: Eurostile Next</text>
    
    <!-- Gutter/Spine -->
    <line x1="700" y1="0" x2="700" y2="900" stroke="#FF00FF" stroke-width="3"/>
    <text x="705" y="15" fill="#FF00FF" font-family="monospace" font-size="9px">SPINE</text>
    
    <!-- Header repeat pattern -->
    <rect x="30" y="30" width="1340" height="40" fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="35" y="25" fill="#8B0000" font-family="monospace" font-size="8px">Repeated header across spread</text>
  </g>

  <!-- LAYER 2: Grid System -->
  <g id="layer-grid" data-layer="grid">
    <!-- LEFT PAGE: Avenir Next grid -->
    <!-- Main display area -->
    <rect x="80" y="120" width="550" height="200" fill="none" stroke="#00CED1" stroke-width="1.5"/>
    <text x="85" y="115" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">AVENIR DISPLAY ZONE</text>
    
    <!-- Text specimen grid (6 columns) -->
    <line x1="130" y1="360" x2="130" y2="820" stroke="#00CED1" stroke-width="1"/>
    <line x1="210" y1="360" x2="210" y2="820" stroke="#00CED1" stroke-width="1"/>
    <line x1="290" y1="360" x2="290" y2="820" stroke="#00CED1" stroke-width="1"/>
    <line x1="370" y1="360" x2="370" y2="820" stroke="#00CED1" stroke-width="1"/>
    <line x1="450" y1="360" x2="450" y2="820" stroke="#00CED1" stroke-width="1"/>
    <line x1="530" y1="360" x2="530" y2="820" stroke="#00CED1" stroke-width="1"/>
    
    <!-- Column labels for left page -->
    <text x="100" y="380" fill="#00CED1" font-family="monospace" font-size="8px">L1</text>
    <text x="170" y="380" fill="#00CED1" font-family="monospace" font-size="8px">L2</text>
    <text x="250" y="380" fill="#00CED1" font-family="monospace" font-size="8px">L3</text>
    <text x="330" y="380" fill="#00CED1" font-family="monospace" font-size="8px">L4</text>
    <text x="410" y="380" fill="#00CED1" font-family="monospace" font-size="8px">L5</text>
    <text x="490" y="380" fill="#00CED1" font-family="monospace" font-size="8px">L6</text>
    
    <!-- RIGHT PAGE: Eurostile Next grid -->
    <!-- Main display area -->
    <rect x="770" y="120" width="550" height="200" fill="none" stroke="#00CED1" stroke-width="1.5"/>
    <text x="775" y="115" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">EUROSTILE DISPLAY ZONE</text>
    
    <!-- Text specimen grid (6 columns) -->
    <line x1="820" y1="360" x2="820" y2="820" stroke="#00CED1" stroke-width="1"/>
    <line x1="900" y1="360" x2="900" y2="820" stroke="#00CED1" stroke-width="1"/>
    <line x1="980" y1="360" x2="980" y2="820" stroke="#00CED1" stroke-width="1"/>
    <line x1="1060" y1="360" x2="1060" y2="820" stroke="#00CED1" stroke-width="1"/>
    <line x1="1140" y1="360" x2="1140" y2="820" stroke="#00CED1" stroke-width="1"/>
    <line x1="1220" y1="360" x2="1220" y2="820" stroke="#00CED1" stroke-width="1"/>
    
    <!-- Column labels for right page -->
    <text x="790" y="380" fill="#00CED1" font-family="monospace" font-size="8px">R1</text>
    <text x="860" y="380" fill="#00CED1" font-family="monospace" font-size="8px">R2</text>
    <text x="940" y="380" fill="#00CED1" font-family="monospace" font-size="8px">R3</text>
    <text x="1020" y="380" fill="#00CED1" font-family="monospace" font-size="8px">R4</text>
    <text x="1100" y="380" fill="#00CED1" font-family="monospace" font-size="8px">R5</text>
    <text x="1180" y="380" fill="#00CED1" font-family="monospace" font-size="8px">R6</text>
    
    <!-- Horizontal zones -->
    <line x1="80" y1="360" x2="630" y2="360" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="80" y1="520" x2="630" y2="520" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="80" y1="680" x2="630" y2="680" stroke="#00CED1" stroke-width="0.5"/>
    
    <line x1="770" y1="360" x2="1320" y2="360" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="770" y1="520" x2="1320" y2="520" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="770" y1="680" x2="1320" y2="680" stroke="#00CED1" stroke-width="0.5"/>
    
    <!-- Zone labels -->
    <text x="640" y="440" fill="#00CED1" font-family="monospace" font-size="8px">Z1</text>
    <text x="640" y="600" fill="#00CED1" font-family="monospace" font-size="8px">Z2</text>
    <text x="640" y="750" fill="#00CED1" font-family="monospace" font-size="8px">Z3</text>
  </g>

  <!-- LAYER 3: Content Blocks -->
  <g id="layer-content" data-layer="content">
    <!-- HEADER ELEMENTS - LEFT PAGE -->
    <rect x="40" y="40" width="120" height="12" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="45" y="35" fill="#FF4444" font-family="monospace" font-size="7px">SPECIMEN MAGAZINE</text>
    
    <rect x="240" y="40" width="60" height="12" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="245" y="35" fill="#FF4444" font-family="monospace" font-size="7px">THREE</text>
    
    <rect x="380" y="40" width="100" height="12" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="385" y="35" fill="#FF4444" font-family="monospace" font-size="7px">AKIRA KOBAYASHI</text>
    
    <rect x="540" y="40" width="80" height="12" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="545" y="35" fill="#FF4444" font-family="monospace" font-size="7px">PAGE 70-71xx</text>
    
    <!-- HEADER ELEMENTS - RIGHT PAGE -->
    <rect x="740" y="40" width="120" height="12" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="745" y="35" fill="#FF4444" font-family="monospace" font-size="7px">SPECIMEN MAGAZINE</text>
    
    <rect x="940" y="40" width="60" height="12" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="945" y="35" fill="#FF4444" font-family="monospace" font-size="7px">THREE</text>
    
    <rect x="1080" y="40" width="100" height="12" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1085" y="35" fill="#FF4444" font-family="monospace" font-size="7px">AKIRA KOBAYASHI</text>
    
    <rect x="1240" y="40" width="80" height="12" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1245" y="35" fill="#FF4444" font-family="monospace" font-size="7px">PAGE 70-71xx</text>
    
    <!-- LEFT PAGE: Avenir Next -->
    <!-- Main title -->
    <rect x="90" y="80" width="200" height="25" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="95" y="75" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">Avenir Next</text>
    <text x="95" y="115" fill="#FF4444" font-family="monospace" font-size="7px">200×25px title</text>
    
    <!-- Large display letters "AvIN" -->
    <rect x="90" y="140" width="500" height="160" fill="none" stroke="#FF4444" stroke-width="3"/>
    <text x="95" y="135" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">LARGE DISPLAY: "AvIN"</text>
    <text x="95" y="147" fill="#FF4444" font-family="monospace" font-size="8px">500×160px letterforms</text>
    <text x="95" y="310" fill="#FF4444" font-family="monospace" font-size="8px">Sans-serif, geometric construction</text>
    
    <!-- Character set specimens -->
    <rect x="90" y="380" width="520" height="120" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="95" y="375" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">CHARACTER SET SPECIMENS</text>
    <text x="95" y="387" fill="#FF4444" font-family="monospace" font-size="7px">Uppercase, lowercase, numerals</text>
    
    <!-- Weight/style variations -->
    <rect x="90" y="520" width="520" height="140" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="95" y="515" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">WEIGHT VARIATIONS</text>
    <text x="95" y="527" fill="#FF4444" font-family="monospace" font-size="7px">Light, Regular, Medium, Bold specimens</text>
    
    <!-- Technical specifications -->
    <rect x="90" y="690" width="520" height="110" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="95" y="685" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">TECHNICAL SPECIFICATIONS</text>
    <text x="95" y="697" fill="#FF4444" font-family="monospace" font-size="7px">Designer, foundry, year information</text>
    
    <!-- RIGHT PAGE: Eurostile Next -->
    <!-- Main title -->
    <rect x="780" y="80" width="240" height="25" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="785" y="75" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">Eurostile Next:</text>
    <text x="785" y="115" fill="#FF4444" font-family="monospace" font-size="7px">240×25px title</text>
    
    <!-- Large display letters "EuIN" -->
    <rect x="780" y="140" width="500" height="160" fill="none" stroke="#FF4444" stroke-width="3"/>
    <text x="785" y="135" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">LARGE DISPLAY: "EuIN"</text>
    <text x="785" y="147" fill="#FF4444" font-family="monospace" font-size="8px">500×160px letterforms</text>
    <text x="785" y="310" fill="#FF4444" font-family="monospace" font-size="8px">Extended sans-serif, square forms</text>
    
    <!-- Character set specimens -->
    <rect x="780" y="380" width="520" height="120" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="785" y="375" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">CHARACTER SET SPECIMENS</text>
    <text x="785" y="387" fill="#FF4444" font-family="monospace" font-size="7px">Uppercase, lowercase, numerals</text>
    
    <!-- Weight/style variations -->
    <rect x="780" y="520" width="520" height="140" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="785" y="515" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">WEIGHT VARIATIONS</text>
    <text x="785" y="527" fill="#FF4444" font-family="monospace" font-size="7px">Extended family weight specimens</text>
    
    <!-- Technical specifications -->
    <rect x="780" y="690" width="520" height="110" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="785" y="685" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">TECHNICAL SPECIFICATIONS</text>
    <text x="785" y="697" fill="#FF4444" font-family="monospace" font-size="7px">Extended family details</text>
  </g>

  <!-- LAYER 4: Proportional Analysis -->
  <g id="layer-proportions" data-layer="proportions">
    <!-- Golden ratio guides -->
    <line x1="535" y1="70" x2="535" y2="870" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="540" y="90" fill="#FFD700" font-family="monospace" font-size="8px">φ Left: 61.8%</text>
    
    <line x1="865" y1="70" x2="865" y2="870" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="870" y="90" fill="#FFD700" font-family="monospace" font-size="8px">φ Right: 38.2%</text>
    
    <!-- Display area proportions -->
    <rect x="85" y="135" width="510" height="170" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="90" y="320" fill="#FFD700" font-family="monospace" font-size="8px">Avenir display: 36% × 19%</text>
    
    <rect x="775" y="135" width="510" height="170" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="780" y="320" fill="#FFD700" font-family="monospace" font-size="8px">Eurostile display: 36% × 19%</text>
    
    <!-- Bilateral symmetry -->
    <circle cx="700" cy="450" r="8" fill="#FFD700" opacity="0.7"/>
    <text x="710" y="455" fill="#FFD700" font-family="monospace" font-size="8px">Bilateral symmetry</text>
  </g>

  <!-- LAYER 5: Flow & Hierarchy -->
  <g id="layer-flow" data-layer="flow">
    <!-- Comparison flow -->
    <circle cx="190" cy="85" r="8" fill="#8844CC" opacity="0.8"/>
    <text x="165" y="105" fill="#8844CC" font-family="monospace" font-size="8px">1. Avenir</text>
    
    <circle cx="900" cy="85" r="8" fill="#8844CC" opacity="0.8"/>
    <text x="875" y="105" fill="#8844CC" font-family="monospace" font-size="8px">2. Eurostile</text>
    
    <!-- Cross-page comparison arrows -->
    <path d="M590,220 Q650,250 700,220" fill="none" stroke="#8844CC" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M700,230 Q750,260 780,220" fill="none" stroke="#8844CC" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Visual hierarchy -->
    <circle cx="350" cy="220" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="345" y="225" fill="white" font-family="monospace" font-size="9px" font-weight="bold">1</text>
    
    <circle cx="1050" cy="220" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="1045" y="225" fill="white" font-family="monospace" font-size="9px" font-weight="bold">2</text>
    
    <!-- Arrow marker -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
              refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8844CC"/>
      </marker>
    </defs>
  </g>

  <!-- LAYER 6: Info Panel -->
  <g id="layer-info" data-layer="info">
    <!-- Dark background panel -->
    <rect x="0" y="900" width="1400" height="200" fill="#1a1a1a"/>
    
    <!-- Title -->
    <text x="20" y="925" fill="white" font-family="monospace" font-size="14px" font-weight="bold">GRID ANALYSIS — TYPOGRAPHY SPECIMEN: AVENIR NEXT vs EUROSTILE NEXT</text>
    
    <!-- Row 1: Spread dimensions -->
    <text x="20" y="945" fill="#FFD700" font-family="monospace" font-size="10px">SPREAD:</text>
    <text x="120" y="945" fill="white" font-family="monospace" font-size="10px">1400×900px | Individual pages: 650×840px | Aspect: 1.56:1 | φ proximity: 96% match</text>
    
    <!-- Row 2: Comparison structure -->
    <text x="20" y="960" fill="#00CED1" font-family="monospace" font-size="10px">LAYOUT:</text>
    <text x="120" y="960" fill="white" font-family="monospace" font-size="10px">Bilateral comparison | 6-column grid per page | Identical structures for fair comparison</text>
    
    <!-- Row 3: Typography -->
    <text x="20" y="975" fill="#FF4444" font-family="monospace" font-size="10px">TYPEFACES:</text>
    <text x="120" y="975" fill="white" font-family="monospace" font-size="10px">Avenir Next (geometric sans) vs Eurostile Next (square sans) | Extended family comparison</text>
    
    <!-- Row 4: Educational approach -->
    <text x="20" y="990" fill="#FFD700" font-family="monospace" font-size="10px">PURPOSE:</text>
    <text x="120" y="990" fill="white" font-family="monospace" font-size="10px">Typography education | Character comparison | Professional specimen format</text>
    
    <!-- Color legend -->
    <text x="20" y="1010" fill="white" font-family="monospace" font-size="9px">COLOR LEGEND:</text>
    <rect x="120" y="1002" width="12" height="12" fill="#FF00FF"/>
    <text x="138" y="1012" fill="white" font-family="monospace" font-size="8px">Frame/Spine</text>
    <rect x="200" y="1002" width="12" height="12" fill="#00CED1"/>
    <text x="218" y="1012" fill="white" font-family="monospace" font-size="8px">Grid</text>
    <rect x="260" y="1002" width="12" height="12" fill="#FF4444"/>
    <text x="278" y="1012" fill="white" font-family="monospace" font-size="8px">Content</text>
    <rect x="340" y="1002" width="12" height="12" fill="#FFD700"/>
    <text x="358" y="1012" fill="white" font-family="monospace" font-size="8px">Proportions</text>
    <rect x="440" y="1002" width="12" height="12" fill="#8844CC"/>
    <text x="458" y="1012" fill="white" font-family="monospace" font-size="8px">Flow</text>
    
    <!-- Observations -->
    <text x="20" y="1030" fill="#FFD700" font-family="monospace" font-size="9px">OBSERVATIONS:</text>
    <text x="20" y="1045" fill="white" font-family="monospace" font-size="9px">Professional typography specimen design | Perfect bilateral symmetry enables direct comparison</text>
    <text x="20" y="1058" fill="white" font-family="monospace" font-size="9px">Large display samples + technical details | Educational tool for understanding typeface characteristics</text>
    <text x="20" y="1071" fill="white" font-family="monospace" font-size="9px">Geometric (Avenir) vs Square (Eurostile) sans-serif families | Designer: Akira Kobayashi</text>
  </g>

</svg>