<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1400 1000" 
     role="img" aria-label="Grid analysis: Interview Magazine Double-Page Spread">

  <!-- LAYER 1: Page Frame & Margins -->
  <g id="layer-page" data-layer="page">
    <!-- Overall spread boundary -->
    <rect x="0" y="0" width="1400" height="900" 
          fill="none" stroke="#FF00FF" stroke-width="2" stroke-dasharray="5,5"/>
    <!-- Spread label -->
    <text x="700" y="15" text-anchor="middle" fill="#FF00FF" 
          font-family="monospace" font-size="12px" font-weight="bold">DOUBLE-PAGE SPREAD: 1400 × 900px</text>
    
    <!-- Left page boundary -->
    <rect x="20" y="20" width="670" height="860" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="25" y="15" fill="#FF00FF" font-family="monospace" font-size="10px">LEFT PAGE</text>
    
    <!-- Right page boundary -->
    <rect x="710" y="20" width="670" height="860" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="1045" y="15" fill="#FF00FF" font-family="monospace" font-size="10px">RIGHT PAGE</text>
    
    <!-- Gutter/Spine -->
    <line x1="700" y1="0" x2="700" y2="900" stroke="#FF00FF" stroke-width="3"/>
    <text x="705" y="15" fill="#FF00FF" font-family="monospace" font-size="9px">SPINE</text>
    
    <!-- Margins -->
    <rect x="50" y="50" width="610" height="800" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="740" y="50" width="610" height="800" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="55" y="40" fill="#8B0000" font-family="monospace" font-size="8px">Margins: 30px all sides</text>
  </g>

  <!-- LAYER 2: Grid System -->
  <g id="layer-grid" data-layer="grid">
    <!-- Major horizontal division: Photo vs Text -->
    <line x1="50" y1="540" x2="1350" y2="540" stroke="#00CED1" stroke-width="2"/>
    <text x="60" y="535" fill="#00CED1" font-family="monospace" font-size="10px" font-weight="bold">PHOTO/TEXT DIVISION: 60%/40%</text>
    
    <!-- LEFT PAGE Text Grid -->
    <!-- 3-column system for text area -->
    <line x1="230" y1="540" x2="230" y2="850" stroke="#00CED1" stroke-width="1"/>
    <line x1="410" y1="540" x2="410" y2="850" stroke="#00CED1" stroke-width="1"/>
    <line x1="590" y1="540" x2="590" y2="850" stroke="#00CED1" stroke-width="1"/>
    
    <!-- Left page column labels -->
    <text x="140" y="560" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">L1</text>
    <text x="320" y="560" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">L2</text>
    <text x="500" y="560" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">L3</text>
    
    <!-- RIGHT PAGE Text Grid -->
    <!-- 3-column system for text area -->
    <line x1="920" y1="540" x2="920" y2="850" stroke="#00CED1" stroke-width="1"/>
    <line x1="1100" y1="540" x2="1100" y2="850" stroke="#00CED1" stroke-width="1"/>
    <line x1="1280" y1="540" x2="1280" y2="850" stroke="#00CED1" stroke-width="1"/>
    
    <!-- Right page column labels -->
    <text x="830" y="560" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">R1</text>
    <text x="1010" y="560" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">R2</text>
    <text x="1190" y="560" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">R3</text>
    
    <!-- Vertical text spine on right -->
    <line x1="1320" y1="540" x2="1320" y2="850" stroke="#00CED1" stroke-width="1.5"/>
    <text x="1325" y="700" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">SPINE TEXT</text>
    
    <!-- Header zones -->
    <line x1="50" y1="100" x2="1350" y2="100" stroke="#00CED1" stroke-width="0.5"/>
    <text x="60" y="95" fill="#00CED1" font-family="monospace" font-size="8px">Header zone</text>
    
    <!-- Photo grid divisions -->
    <line x1="200" y1="100" x2="200" y2="540" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="350" y1="100" x2="350" y2="540" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="500" y1="100" x2="500" y2="540" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="650" y1="100" x2="650" y2="540" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="800" y1="100" x2="800" y2="540" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="950" y1="100" x2="950" y2="540" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="1100" y1="100" x2="1100" y2="540" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="1250" y1="100" x2="1250" y2="540" stroke="#00CED1" stroke-width="0.5"/>
  </g>

  <!-- LAYER 3: Content Blocks -->
  <g id="layer-content" data-layer="content">
    <!-- HEADER ELEMENTS -->
    
    <!-- Left page header text -->
    <rect x="60" y="60" width="120" height="15" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="65" y="55" fill="#FF4444" font-family="monospace" font-size="7px">INTERVIEW MAGAZINE</text>
    
    <rect x="280" y="60" width="80" height="15" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="285" y="55" fill="#FF4444" font-family="monospace" font-size="7px">ALBERT WATSON</text>
    
    <rect x="560" y="60" width="80" height="15" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="565" y="55" fill="#FF4444" font-family="monospace" font-size="7px">IN THE MOMENT</text>
    
    <!-- Right page header text -->
    <rect x="750" y="60" width="120" height="15" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="755" y="55" fill="#FF4444" font-family="monospace" font-size="7px">INTERVIEW MAGAZINE</text>
    
    <rect x="1070" y="60" width="80" height="15" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1075" y="55" fill="#FF4444" font-family="monospace" font-size="7px">ALBERT WATSON</text>
    
    <rect x="1250" y="60" width="80" height="15" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1255" y="55" fill="#FF4444" font-family="monospace" font-size="7px">IN THE MOMENT</text>
    
    <!-- PHOTOGRAPHIC AREA -->
    <rect x="50" y="100" width="1300" height="440" fill="none" stroke="#FF4444" stroke-width="3"/>
    <text x="55" y="95" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">REPEATED PORTRAIT PHOTOGRAPHY</text>
    <text x="55" y="107" fill="#FF4444" font-family="monospace" font-size="8px">1300×440px - Spans full spread width</text>
    <text x="55" y="119" fill="#FF4444" font-family="monospace" font-size="8px">Multiple figure repetitions with sunglasses</text>
    <text x="55" y="550" fill="#FF4444" font-family="monospace" font-size="8px">B&amp;W photography, high contrast</text>
    
    <!-- Individual portrait segments -->
    <rect x="80" y="130" width="120" height="380" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="220" y="130" width="120" height="380" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="360" y="130" width="120" height="380" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="500" y="130" width="120" height="380" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="640" y="130" width="120" height="380" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="780" y="130" width="120" height="380" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="920" y="130" width="120" height="380" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="1060" y="130" width="120" height="380" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="1200" y="130" width="120" height="380" fill="none" stroke="#FF4444" stroke-width="1"/>
    
    <!-- TEXT AREA - LEFT PAGE -->
    <rect x="60" y="570" width="160" height="260" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="65" y="565" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">TEXT COLUMN 1</text>
    <text x="65" y="577" fill="#FF4444" font-family="monospace" font-size="7px">160×260px body text</text>
    
    <rect x="240" y="570" width="160" height="260" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="245" y="565" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">TEXT COLUMN 2</text>
    
    <rect x="420" y="570" width="160" height="260" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="425" y="565" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">TEXT COLUMN 3</text>
    
    <!-- TEXT AREA - RIGHT PAGE -->
    <rect x="750" y="570" width="160" height="260" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="755" y="565" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">TEXT COLUMN 4</text>
    
    <rect x="930" y="570" width="160" height="260" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="935" y="565" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">TEXT COLUMN 5</text>
    
    <rect x="1110" y="570" width="160" height="260" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1115" y="565" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">TEXT COLUMN 6</text>
    
    <!-- VERTICAL SPINE TEXT -->
    <rect x="1290" y="570" width="50" height="260" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="1295" y="565" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">ALBERT</text>
    <text x="1295" y="577" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">WATSON</text>
    <text x="1295" y="589" fill="#FF4444" font-family="monospace" font-size="7px">Vertical spine</text>
  </g>

  <!-- LAYER 4: Proportional Analysis -->
  <g id="layer-proportions" data-layer="proportions">
    <!-- Golden ratio guides -->
    <line x1="535" y1="50" x2="535" y2="850" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="540" y="70" fill="#FFD700" font-family="monospace" font-size="8px">φ Left: 61.8%</text>
    
    <line x1="865" y1="50" x2="865" y2="850" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="870" y="70" fill="#FFD700" font-family="monospace" font-size="8px">φ Right: 38.2%</text>
    
    <!-- Horizontal golden section for photo/text division -->
    <line x1="50" y1="585" x2="1350" y2="585" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="60" y="580" fill="#FFD700" font-family="monospace" font-size="8px">φ Photo/Text: 61.8%/38.2%</text>
    
    <!-- Photo area proportions -->
    <rect x="45" y="95" width="1310" height="450" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="50" y="560" fill="#FFD700" font-family="monospace" font-size="8px">Photo zone: 93% × 50%</text>
    
    <!-- Spread center balance -->
    <circle cx="700" cy="450" r="8" fill="#FFD700" opacity="0.7"/>
    <text x="710" y="455" fill="#FFD700" font-family="monospace" font-size="8px">Spread center</text>
  </g>

  <!-- LAYER 5: Flow & Hierarchy -->
  <g id="layer-flow" data-layer="flow">
    <!-- Reading entry points -->
    <circle cx="120" cy="70" r="8" fill="#8844CC" opacity="0.8"/>
    <text x="95" y="90" fill="#8844CC" font-family="monospace" font-size="8px">1. Headers</text>
    
    <!-- Visual flow arrows -->
    <path d="M120,80 Q400,200 700,320" fill="none" stroke="#8844CC" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M700,330 Q850,400 120,580" fill="none" stroke="#8844CC" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M400,700 Q800,720 1200,700" fill="none" stroke="#8844CC" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M1200,710 Q1300,750 1315,700" fill="none" stroke="#8844CC" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Hierarchy indicators -->
    <circle cx="700" cy="320" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="695" y="325" fill="white" font-family="monospace" font-size="9px" font-weight="bold">1</text>
    
    <circle cx="320" cy="700" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="315" y="705" fill="white" font-family="monospace" font-size="9px" font-weight="bold">2</text>
    
    <circle cx="1315" cy="700" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="1310" y="705" fill="white" font-family="monospace" font-size="9px" font-weight="bold">3</text>
    
    <!-- Arrow marker definition -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
              refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8844CC"/>
      </marker>
    </defs>
  </g>

  <!-- LAYER 6: Info Panel -->
  <g id="layer-info" data-layer="info">
    <!-- Dark background panel -->
    <rect x="0" y="900" width="1400" height="200" fill="#1a1a1a"/>
    
    <!-- Title -->
    <text x="20" y="925" fill="white" font-family="monospace" font-size="14px" font-weight="bold">GRID ANALYSIS — INTERVIEW MAGAZINE DOUBLE-PAGE SPREAD</text>
    
    <!-- Row 1: Spread dimensions -->
    <text x="20" y="945" fill="#FFD700" font-family="monospace" font-size="10px">SPREAD:</text>
    <text x="120" y="945" fill="white" font-family="monospace" font-size="10px">1400×900px | Individual pages: 670×860px | Aspect: 1.56:1 | φ proximity: 96% match</text>
    
    <!-- Row 2: Layout structure -->
    <text x="20" y="960" fill="#00CED1" font-family="monospace" font-size="10px">LAYOUT:</text>
    <text x="120" y="960" fill="white" font-family="monospace" font-size="10px">Horizontal division: 60% photo area, 40% text | 6-column text grid | 30px margins</text>
    
    <!-- Row 3: Photography -->
    <text x="20" y="975" fill="#FF4444" font-family="monospace" font-size="10px">PHOTO:</text>
    <text x="120" y="975" fill="white" font-family="monospace" font-size="10px">Repeated portrait series (9 figures) | B&amp;W high contrast | Spans 1300px (93% width)</text>
    
    <!-- Row 4: Typography -->
    <text x="20" y="990" fill="#FFD700" font-family="monospace" font-size="10px">TYPE:</text>
    <text x="120" y="990" fill="white" font-family="monospace" font-size="10px">Sans-serif headers | 6-column body text | Vertical "ALBERT WATSON" spine element</text>
    
    <!-- Color legend -->
    <text x="20" y="1010" fill="white" font-family="monospace" font-size="9px">COLOR LEGEND:</text>
    <rect x="120" y="1002" width="12" height="12" fill="#FF00FF"/>
    <text x="138" y="1012" fill="white" font-family="monospace" font-size="8px">Frame/Spine</text>
    <rect x="200" y="1002" width="12" height="12" fill="#00CED1"/>
    <text x="218" y="1012" fill="white" font-family="monospace" font-size="8px">Grid</text>
    <rect x="260" y="1002" width="12" height="12" fill="#FF4444"/>
    <text x="278" y="1012" fill="white" font-family="monospace" font-size="8px">Content</text>
    <rect x="340" y="1002" width="12" height="12" fill="#FFD700"/>
    <text x="358" y="1012" fill="white" font-family="monospace" font-size="8px">Proportions</text>
    <rect x="440" y="1002" width="12" height="12" fill="#8844CC"/>
    <text x="458" y="1012" fill="white" font-family="monospace" font-size="8px">Flow</text>
    
    <!-- Observations -->
    <text x="20" y="1030" fill="#FFD700" font-family="monospace" font-size="9px">OBSERVATIONS:</text>
    <text x="20" y="1045" fill="white" font-family="monospace" font-size="9px">Editorial magazine layout emphasizing photographer Albert Watson | Repeated portrait creates rhythm</text>
    <text x="20" y="1058" fill="white" font-family="monospace" font-size="9px">Strong horizontal photo/text division at golden ratio | Vertical spine typography adds editorial sophistication</text>
    <text x="20" y="1071" fill="white" font-family="monospace" font-size="9px">Contemporary magazine design balancing visual impact with readable text layout</text>
    <text x="20" y="1084" fill="white" font-family="monospace" font-size="9px">Photo repetition technique creates visual pattern while maintaining editorial professionalism</text>
  </g>

</svg>