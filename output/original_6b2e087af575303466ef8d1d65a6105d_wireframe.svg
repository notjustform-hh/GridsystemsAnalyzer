<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1700 1100" 
     role="img" aria-label="Grid analysis: Fashion Editorial - Geometric Shape &amp; Model Double-Page Spread">

  <!-- LAYER 1: Page Frame & Margins -->
  <g id="layer-page" data-layer="page">
    <rect x="0" y="0" width="1700" height="1100" 
          fill="none" stroke="#FF00FF" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="850" y="15" text-anchor="middle" fill="#FF00FF" 
          font-family="monospace" font-size="12px" font-weight="bold">FASHION EDITORIAL SPREAD: 1700 × 1100px (Geometric Editorial)</text>
    
    <!-- Page boundaries -->
    <rect x="50" y="50" width="775" height="1000" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="55" y="45" fill="#FF00FF" font-family="monospace" font-size="10px">LEFT PAGE - GEOMETRIC</text>
    
    <rect x="875" y="50" width="775" height="1000" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="1262" y="45" fill="#FF00FF" font-family="monospace" font-size="10px">RIGHT PAGE - EDITORIAL</text>
    
    <!-- Central spine/gutter -->
    <rect x="825" y="0" width="50" height="1100" fill="none" stroke="#FF00FF" stroke-width="2"/>
    <text x="840" y="30" fill="#FF00FF" font-family="monospace" font-size="8px" transform="rotate(90 840 30)">SPINE</text>
    
    <!-- Working margins -->
    <rect x="70" y="70" width="735" height="960" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="895" y="70" width="735" height="960" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- LAYER 2: Grid System -->
  <g id="layer-grid" data-layer="grid">
    <!-- LEFT PAGE: Geometric structure -->
    <rect x="90" y="90" width="695" height="940" fill="none" stroke="#00CED1" stroke-width="2"/>
    <text x="95" y="85" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">GEOMETRIC COMPOSITION AREA</text>
    
    <!-- Geometric shape zone -->
    <rect x="200" y="200" width="480" height="650" fill="none" stroke="#00CED1" stroke-width="2"/>
    <text x="205" y="195" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">BLACK SHAPE ZONE</text>
    
    <!-- RIGHT PAGE: Editorial structure -->
    <rect x="915" y="90" width="695" height="940" fill="none" stroke="#00CED1" stroke-width="2"/>
    <text x="920" y="85" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">EDITORIAL CONTENT AREA</text>
    
    <!-- Model photography zone -->
    <rect x="1100" y="150" width="450" height="700" fill="none" stroke="#00CED1" stroke-width="1.5"/>
    <text x="1105" y="145" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">MODEL PHOTOGRAPHY</text>
    
    <!-- Text/credits zone -->
    <rect x="950" y="300" width="120" height="400" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="955" y="295" fill="#00CED1" font-family="monospace" font-size="8px">CREDITS ZONE</text>
    
    <!-- Header zones -->
    <line x1="90" y1="120" x2="785" y2="120" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="915" y1="120" x2="1610" y2="120" stroke="#00CED1" stroke-width="0.5"/>
    <text x="95" y="110" fill="#00CED1" font-family="monospace" font-size="8px">HEADER LINES</text>
  </g>

  <!-- LAYER 3: Content Blocks -->
  <g id="layer-content" data-layer="content">
    <!-- LEFT PAGE: Headers -->
    <rect x="90" y="90" width="120" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="95" y="85" fill="#FF4444" font-family="monospace" font-size="7px">MAGAZINE TITLE</text>
    
    <rect x="250" y="90" width="60" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="255" y="85" fill="#FF4444" font-family="monospace" font-size="7px">THREE</text>
    
    <rect x="400" y="90" width="120" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="405" y="85" fill="#FF4444" font-family="monospace" font-size="7px">AKIRA KOBAYASHI</text>
    
    <rect x="650" y="90" width="80" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="655" y="85" fill="#FF4444" font-family="monospace" font-size="7px">PAGE 70-71</text>
    
    <!-- Large geometric black shape -->
    <rect x="220" y="220" width="440" height="610" fill="#FF4444" opacity="0.8"/>
    <text x="225" y="215" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">LARGE BLACK GEOMETRIC SHAPE</text>
    
    <!-- Shape description -->
    <rect x="100" y="890" width="200" height="80" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="105" y="885" fill="#FF4444" font-family="monospace" font-size="7px">SHAPE DESCRIPTION</text>
    
    <!-- RIGHT PAGE: Headers -->
    <rect x="915" y="90" width="120" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="920" y="85" fill="#FF4444" font-family="monospace" font-size="7px">MAGAZINE TITLE</text>
    
    <rect x="1075" y="90" width="60" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1080" y="85" fill="#FF4444" font-family="monospace" font-size="7px">THREE</text>
    
    <rect x="1225" y="90" width="120" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1230" y="85" fill="#FF4444" font-family="monospace" font-size="7px">AKIRA KOBAYASHI</text>
    
    <rect x="1475" y="90" width="80" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1480" y="85" fill="#FF4444" font-family="monospace" font-size="7px">PAGE 70-71</text>
    
    <!-- Model photography -->
    <rect x="1120" y="170" width="410" height="660" fill="none" stroke="#FF4444" stroke-width="3"/>
    <text x="1125" y="165" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">MODEL PHOTOGRAPH</text>
    
    <!-- Vertical text "VIBERLMAISON" -->
    <rect x="1350" y="140" width="20" height="200" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="1355" y="135" fill="#FF4444" font-family="monospace" font-size="7px" transform="rotate(90 1355 135)">VERTICAL TEXT</text>
    
    <rect x="1350" y="360" width="20" height="100" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="1355" y="355" fill="#FF4444" font-family="monospace" font-size="7px" transform="rotate(90 1355 355)">BOOK</text>
    
    <!-- Editorial credits -->
    <rect x="970" y="320" width="80" height="300" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="975" y="315" fill="#FF4444" font-family="monospace" font-size="8px">EDITORIAL CREDITS</text>
    
    <!-- Model details -->
    <rect x="970" y="650" width="80" height="150" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="975" y="645" fill="#FF4444" font-family="monospace" font-size="7px">MODEL INFO</text>
    
    <!-- Footer info -->
    <rect x="1120" y="890" width="200" height="60" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1125" y="885" fill="#FF4444" font-family="monospace" font-size="7px">FOOTER DETAILS</text>
    
    <!-- Page numbers -->
    <rect x="90" y="1020" width="30" height="15" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="95" y="1015" fill="#FF4444" font-family="monospace" font-size="6px">LEFT</text>
    
    <rect x="1580" y="1020" width="30" height="15" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1585" y="1015" fill="#FF4444" font-family="monospace" font-size="6px">RIGHT</text>
  </g>

  <!-- LAYER 4: Proportional Analysis -->
  <g id="layer-proportions" data-layer="proportions">
    <!-- Golden ratio divisions -->
    <line x1="650" y1="70" x2="650" y2="1030" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="655" y="90" fill="#FFD700" font-family="monospace" font-size="8px">φ Left: 38.2%</text>
    
    <line x1="1050" y1="70" x2="1050" y2="1030" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="1055" y="90" fill="#FFD700" font-family="monospace" font-size="8px">φ Right: 61.8%</text>
    
    <!-- Geometric shape proportional analysis -->
    <rect x="220" y="220" width="440" height="610" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="225" y="840" fill="#FFD700" font-family="monospace" font-size="8px">Shape: 25.9% × 55.5%</text>
    
    <!-- Model photography zone -->
    <rect x="1120" y="170" width="410" height="660" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="1125" y="840" fill="#FFD700" font-family="monospace" font-size="8px">Photo: 24.1% × 60%</text>
    
    <!-- Central proportional marker -->
    <circle cx="850" cy="550" r="8" fill="#FFD700" opacity="0.7"/>
    <text x="860" y="555" fill="#FFD700" font-family="monospace" font-size="8px">Center</text>
  </g>

  <!-- LAYER 5: Flow & Hierarchy -->
  <g id="layer-flow" data-layer="flow">
    <!-- Primary visual flow -->
    <circle cx="440" cy="525" r="14" fill="#8844CC" opacity="0.8"/>
    <text x="434" y="531" fill="white" font-family="monospace" font-size="10px" font-weight="bold">1</text>
    
    <circle cx="1325" cy="500" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="1320" y="505" fill="white" font-family="monospace" font-size="9px" font-weight="bold">2</text>
    
    <circle cx="1360" cy="250" r="10" fill="#8844CC" opacity="0.7"/>
    <text x="1357" y="255" fill="white" font-family="monospace" font-size="8px" font-weight="bold">3</text>
    
    <circle cx="1010" cy="470" r="8" fill="#8844CC" opacity="0.6"/>
    <text x="1007" y="475" fill="white" font-family="monospace" font-size="7px" font-weight="bold">4</text>
    
    <!-- Flow arrows -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
              refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8844CC"/>
      </marker>
    </defs>
    
    <path d="M 454 525 Q 700 480 1313 500" fill="none" stroke="#8844CC" 
          stroke-width="3" marker-end="url(#arrowhead)" opacity="0.7"/>
    <path d="M 1325 488 Q 1340 400 1350 260" fill="none" stroke="#8844CC" 
          stroke-width="2" marker-end="url(#arrowhead)" opacity="0.6"/>
  </g>

  <!-- LAYER 6: Info Panel -->
  <g id="layer-info" data-layer="info">
    <rect x="0" y="1100" width="1700" height="200" fill="#1a1a1a"/>
    
    <text x="20" y="1125" fill="white" font-family="monospace" font-size="14px" font-weight="bold">GRID ANALYSIS — FASHION EDITORIAL: GEOMETRIC SHAPE & MODEL SPREAD</text>
    
    <text x="20" y="1145" fill="#FFD700" font-family="monospace" font-size="10px">FORMAT:</text>
    <text x="120" y="1145" fill="white" font-family="monospace" font-size="10px">1700×1100px double-page spread | Fashion magazine | Editorial photography format</text>
    
    <text x="20" y="1160" fill="#00CED1" font-family="monospace" font-size="10px">LAYOUT:</text>
    <text x="120" y="1160" fill="white" font-family="monospace" font-size="10px">Asymmetric: Left geometric abstraction | Right fashion photography | Dramatic contrast</text>
    
    <text x="20" y="1175" fill="#FF4444" font-family="monospace" font-size="10px">VISUAL:</text>
    <text x="120" y="1175" fill="white" font-family="monospace" font-size="10px">Large black geometric shape | Fashion model photograph | Vertical "VIBERLMAISON BOOK"</text>
    
    <text x="20" y="1190" fill="#8844CC" font-family="monospace" font-size="10px">HIERARCHY:</text>
    <text x="120" y="1190" fill="white" font-family="monospace" font-size="10px">1. Geometric shape | 2. Model photo | 3. Vertical brand text | 4. Editorial credits</text>
    
    <text x="20" y="1230" fill="#FFD700" font-family="monospace" font-size="9px">OBSERVATIONS:</text>
    <text x="20" y="1245" fill="white" font-family="monospace" font-size="9px">Abstract-figurative contrast | Geometric minimalism vs fashion photography | Strong asymmetric balance</text>
    <text x="20" y="1258" fill="white" font-family="monospace" font-size="9px">Black shape creates dramatic visual weight | Vertical typography integration | Editorial magazine format</text>
    <text x="20" y="1271" fill="white" font-family="monospace" font-size="9px">Fashion editorial with architectural design approach | Form and photography dialogue</text>
  </g>

</svg>