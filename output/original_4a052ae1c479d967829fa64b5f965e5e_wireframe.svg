<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1900 1300" 
     role="img" aria-label="Grid analysis: NewWork Magazine Willi Kunz Black Spread">

  <!-- LAYER 1: Page Frame & Margins -->
  <g id="layer-page" data-layer="page">
    <rect x="0" y="0" width="1900" height="1300" 
          fill="none" stroke="#FF00FF" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="950" y="15" text-anchor="middle" fill="#FF00FF" 
          font-family="monospace" font-size="12px" font-weight="bold">NEWWORK MAGAZINE WILLI KUNZ SPREAD: 1900 × 1300px (Black Editorial)</text>
    
    <!-- Page boundaries -->
    <rect x="40" y="40" width="910" height="1220" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="45" y="35" fill="#FF00FF" font-family="monospace" font-size="10px">LEFT PAGE</text>
    
    <rect x="950" y="40" width="910" height="1220" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="1455" y="35" fill="#FF00FF" font-family="monospace" font-size="10px">RIGHT PAGE</text>
    
    <!-- Central spine/gutter -->
    <rect x="910" y="0" width="40" height="1300" fill="none" stroke="#FF00FF" stroke-width="2"/>
    <text x="920" y="25" fill="#FF00FF" font-family="monospace" font-size="8px" transform="rotate(90 920 25)">SPINE</text>
    
    <!-- Working margins -->
    <rect x="80" y="80" width="830" height="1140" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="990" y="80" width="830" height="1140" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- LAYER 2: Grid System -->
  <g id="layer-grid" data-layer="grid">
    <!-- Header strip -->
    <rect x="100" y="100" width="1700" height="60" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="105" y="95" fill="#00CED1" font-family="monospace" font-size="8px">HEADER STRIP</text>
    
    <!-- Left circular logo area -->
    <circle cx="300" cy="400" r="120" fill="none" stroke="#00CED1" stroke-width="2"/>
    <text x="305" y="295" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">CIRCULAR LOGO ZONE</text>
    
    <!-- Left text zone -->
    <rect x="100" y="600" width="400" height="500" fill="none" stroke="#00CED1" stroke-width="1.5"/>
    <text x="105" y="595" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">LEFT TEXT ZONE</text>
    
    <!-- Central designer name area -->
    <rect x="600" y="300" width="300" height="200" fill="none" stroke="#00CED1" stroke-width="2"/>
    <text x="605" y="295" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">DESIGNER NAME AREA</text>
    
    <!-- Right text columns -->
    <rect x="1000" y="600" width="800" height="500" fill="none" stroke="#00CED1" stroke-width="1.5"/>
    <text x="1005" y="595" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">RIGHT TEXT COLUMNS</text>
    
    <!-- Column dividers in right section -->
    <line x1="1200" y1="600" x2="1200" y2="1100" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="1400" y1="600" x2="1400" y2="1100" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="1600" y1="600" x2="1600" y2="1100" stroke="#00CED1" stroke-width="0.5"/>
    
    <!-- Vertical branding area -->
    <rect x="1750" y="200" width="120" height="800" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="1755" y="195" fill="#00CED1" font-family="monospace" font-size="8px">VERTICAL BRAND</text>
  </g>

  <!-- LAYER 3: Content Blocks -->
  <g id="layer-content" data-layer="content">
    <!-- Header elements -->
    <rect x="100" y="120" width="140" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="105" y="115" fill="#FF4444" font-family="monospace" font-size="7px">NEWWORK MAGAZINE</text>
    
    <rect x="300" y="120" width="60" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="305" y="115" fill="#FF4444" font-family="monospace" font-size="7px">2018</text>
    
    <rect x="1600" y="120" width="120" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1605" y="115" fill="#FF4444" font-family="monospace" font-size="7px">WILLI KUNZ</text>
    
    <rect x="1750" y="120" width="80" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1755" y="115" fill="#FF4444" font-family="monospace" font-size="7px">A5 - NEW</text>
    
    <!-- Circular logo element -->
    <circle cx="300" cy="400" r="100" fill="none" stroke="#FF4444" stroke-width="3"/>
    <text x="270" y="380" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">CIRCULAR</text>
    <text x="280" y="395" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">LOGO</text>
    <text x="260" y="410" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">"A1"</text>
    <text x="280" y="425" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">ELEMENT</text>
    
    <!-- Central designer name -->
    <rect x="620" y="340" width="260" height="120" fill="none" stroke="#FF4444" stroke-width="3"/>
    <text x="625" y="335" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">LARGE "WILLI KUNZ"</text>
    
    <!-- Left description text -->
    <rect x="120" y="620" width="360" height="460" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="125" y="615" fill="#FF4444" font-family="monospace" font-size="8px">LEFT DESCRIPTION TEXT</text>
    
    <!-- Right text columns -->
    <rect x="1020" y="620" width="160" height="460" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1025" y="615" fill="#FF4444" font-family="monospace" font-size="7px">COL 1</text>
    
    <rect x="1220" y="620" width="160" height="460" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1225" y="615" fill="#FF4444" font-family="monospace" font-size="7px">COL 2</text>
    
    <rect x="1420" y="620" width="160" height="460" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1425" y="615" fill="#FF4444" font-family="monospace" font-size="7px">COL 3</text>
    
    <rect x="1620" y="620" width="160" height="460" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1625" y="615" fill="#FF4444" font-family="monospace" font-size="7px">COL 4</text>
    
    <!-- Vertical "NEW" branding -->
    <rect x="1770" y="220" width="80" height="760" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="1775" y="215" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">VERTICAL "NEW"</text>
    
    <!-- Footer elements -->
    <rect x="120" y="1200" width="60" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="125" y="1195" fill="#FF4444" font-family="monospace" font-size="6px">PAGE LEFT</text>
    
    <rect x="1740" y="1200" width="60" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1745" y="1195" fill="#FF4444" font-family="monospace" font-size="6px">PAGE RIGHT</text>
  </g>

  <!-- LAYER 4: Proportional Analysis -->
  <g id="layer-proportions" data-layer="proportions">
    <!-- Golden ratio divisions -->
    <line x1="731" y1="80" x2="731" y2="1220" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="736" y="100" fill="#FFD700" font-family="monospace" font-size="8px">φ Left: 38.5%</text>
    
    <line x1="1169" y1="80" x2="1169" y2="1220" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="1174" y="100" fill="#FFD700" font-family="monospace" font-size="8px">φ Right: 61.5%</text>
    
    <!-- Circular element proportional analysis -->
    <circle cx="300" cy="400" r="120" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="205" y="530" fill="#FFD700" font-family="monospace" font-size="8px">Circle: 12.6% diameter</text>
    
    <!-- Designer name proportional analysis -->
    <rect x="620" y="340" width="260" height="120" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="625" y="470" fill="#FFD700" font-family="monospace" font-size="8px">Name: 13.7% × 9.2%</text>
    
    <!-- Central proportional marker -->
    <circle cx="950" cy="650" r="8" fill="#FFD700" opacity="0.7"/>
    <text x="960" y="655" fill="#FFD700" font-family="monospace" font-size="8px">Center</text>
  </g>

  <!-- LAYER 5: Flow & Hierarchy -->
  <g id="layer-flow" data-layer="flow">
    <!-- Primary reading flow -->
    <circle cx="300" cy="400" r="14" fill="#8844CC" opacity="0.8"/>
    <text x="293" y="407" fill="white" font-family="monospace" font-size="10px" font-weight="bold">1</text>
    
    <circle cx="750" cy="400" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="745" y="405" fill="white" font-family="monospace" font-size="9px" font-weight="bold">2</text>
    
    <circle cx="300" cy="850" r="10" fill="#8844CC" opacity="0.7"/>
    <text x="297" y="855" fill="white" font-family="monospace" font-size="8px" font-weight="bold">3</text>
    
    <circle cx="1400" cy="850" r="10" fill="#8844CC" opacity="0.7"/>
    <text x="1397" y="855" fill="white" font-family="monospace" font-size="8px" font-weight="bold">4</text>
    
    <circle cx="1810" cy="600" r="8" fill="#8844CC" opacity="0.6"/>
    <text x="1807" y="605" fill="white" font-family="monospace" font-size="7px" font-weight="bold">5</text>
    
    <!-- Flow arrows -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
              refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8844CC"/>
      </marker>
    </defs>
    
    <path d="M 314 400 Q 550 380 738 400" fill="none" stroke="#8844CC" 
          stroke-width="3" marker-end="url(#arrowhead)" opacity="0.8"/>
    <path d="M 300 414 Q 300 650 300 840" fill="none" stroke="#8844CC" 
          stroke-width="2" marker-end="url(#arrowhead)" opacity="0.7"/>
    <path d="M 750 412 Q 1100 650 1388 850" fill="none" stroke="#8844CC" 
          stroke-width="2" marker-end="url(#arrowhead)" opacity="0.7"/>
  </g>

  <!-- LAYER 6: Info Panel -->
  <g id="layer-info" data-layer="info">
    <rect x="0" y="1300" width="1900" height="200" fill="#1a1a1a"/>
    
    <text x="20" y="1325" fill="white" font-family="monospace" font-size="14px" font-weight="bold">GRID ANALYSIS — NEWWORK MAGAZINE WILLI KUNZ BLACK SPREAD</text>
    
    <text x="20" y="1345" fill="#FFD700" font-family="monospace" font-size="10px">FORMAT:</text>
    <text x="120" y="1345" fill="white" font-family="monospace" font-size="10px">1900×1300px double-page spread | Designer profile | Black editorial format</text>
    
    <text x="20" y="1360" fill="#00CED1" font-family="monospace" font-size="10px">LAYOUT:</text>
    <text x="120" y="1360" fill="white" font-family="monospace" font-size="10px">Left: circular logo + text | Center: designer name | Right: 4-column text + vertical brand</text>
    
    <text x="20" y="1375" fill="#FF4444" font-family="monospace" font-size="10px">TYPE:</text>
    <text x="120" y="1375" fill="white" font-family="monospace" font-size="10px">Large "WILLI KUNZ" centerpiece | White text on black | Circular "A1" logo element</text>
    
    <text x="20" y="1390" fill="#8844CC" font-family="monospace" font-size="10px">HIERARCHY:</text>
    <text x="120" y="1390" fill="white" font-family="monospace" font-size="10px">1. Circular logo | 2. Designer name | 3. Left description | 4. Right columns | 5. Vertical brand</text>
    
    <text x="20" y="1430" fill="#FFD700" font-family="monospace" font-size="9px">OBSERVATIONS:</text>
    <text x="20" y="1445" fill="white" font-family="monospace" font-size="9px">Swiss design influence | High contrast black &amp; white editorial | Professional designer profile format</text>
    <text x="20" y="1458" fill="white" font-family="monospace" font-size="9px">Systematic column structure | Circular logo element emphasis | Contemporary magazine design</text>
    <text x="20" y="1471" fill="white" font-family="monospace" font-size="9px">Typography-focused layout | Clean hierarchical information architecture</text>
  </g>

</svg>