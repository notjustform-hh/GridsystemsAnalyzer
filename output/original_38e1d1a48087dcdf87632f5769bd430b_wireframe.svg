<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .grid-line { 
        stroke: #E0E0E0; 
        stroke-width: 0.5px; 
        fill: none; 
        opacity: 0.3; 
      }
      .grid-major { 
        stroke: #BDBDBD; 
        stroke-width: 1.5px; 
        fill: none; 
      }
      .brand-background { 
        fill: #4A90D9; 
        fill-opacity: 0.8; 
        stroke: #4A90D9; 
        stroke-width: 2px; 
      }
      .brand-typography { 
        fill: #FFFFFF; 
        fill-opacity: 0.9; 
        stroke: #4A90D9; 
        stroke-width: 1px; 
      }
      .content-text { 
        fill: #FFFFFF; 
        fill-opacity: 0.7; 
        stroke: #FFFFFF; 
        stroke-width: 0.5px; 
      }
      .photo-area { 
        fill: #666666; 
        fill-opacity: 0.4; 
        stroke: #666666; 
        stroke-width: 1.5px; 
      }
      .geometric-overlay { 
        fill: #4A90D9; 
        fill-opacity: 0.6; 
        stroke: #4A90D9; 
        stroke-width: 2px; 
      }
      .number-element { 
        fill: #4A90D9; 
        fill-opacity: 0.8; 
        stroke: #4A90D9; 
        stroke-width: 2px; 
      }
      .margin-text { 
        fill: #1A56A0; 
        fill-opacity: 0.3; 
        stroke: #1A56A0; 
        stroke-width: 0.5px; 
      }
      .label { 
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; 
        font-size: 8px; 
        fill: #666666; 
      }
      .measurement { 
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; 
        font-size: 7px; 
        fill: #CC3333; 
        font-weight: bold; 
      }
      .brand-guide {
        stroke: #4A90D9;
        stroke-width: 1px;
        stroke-dasharray: 3,2;
        fill: none;
        opacity: 0.8;
      }
    </style>
  </defs>
  
  <!-- Page divide -->
  <line x1="400" y1="0" x2="400" y2="500" class="grid-major"/>
  
  <!-- LEFT PAGE: Brand Background System -->
  
  <!-- Full page blue background -->
  <rect x="20" y="20" width="360" height="460" class="brand-background"/>
  <text x="25" y="35" class="label" fill="white">FULL BRAND BACKGROUND</text>
  <text x="25" y="45" class="label" fill="white">100% coverage blue</text>
  
  <!-- Brand typography - NEWWORK -->
  <rect x="120" y="80" width="180" height="50" class="brand-typography"/>
  <text x="125" y="95" class="label" fill="#4A90D9">NEWWORK</text>
  <text x="125" y="105" class="label" fill="#4A90D9">Large serif typography</text>
  <text x="125" y="115" class="label" fill="#4A90D9">White on blue</text>
  
  <!-- Subtitle -->
  <rect x="150" y="140" width="80" height="15" class="content-text"/>
  <text x="155" y="150" class="label" fill="white">MAGAZINE</text>
  
  <!-- Content sections (white text lists) -->
  <rect x="50" y="180" width="120" height="80" class="content-text"/>
  <text x="55" y="192" class="label" fill="white">Content Section 1</text>
  <text x="55" y="202" class="label" fill="white">Structured list format</text>
  <text x="55" y="212" class="label" fill="white">Multiple items</text>
  <text x="55" y="222" class="label" fill="white">White typography</text>
  
  <rect x="200" y="180" width="120" height="80" class="content-text"/>
  <text x="205" y="192" class="label" fill="white">Content Section 2</text>
  <text x="205" y="202" class="label" fill="white">Parallel structure</text>
  <text x="205" y="212" class="label" fill="white">Editorial content</text>
  
  <rect x="80" y="280" width="200" height="60" class="content-text"/>
  <text x="85" y="292" class="label" fill="white">Additional Content Block</text>
  <text x="85" y="302" class="label" fill="white">Contributors, credits</text>
  <text x="85" y="312" class="label" fill="white">Magazine information</text>
  
  <rect x="50" y="360" width="280" height="100" class="content-text"/>
  <text x="55" y="375" class="label" fill="white">Extended Content Area</text>
  <text x="55" y="385" class="label" fill="white">Detailed information, articles</text>
  <text x="55" y="395" class="label" fill="white">Multi-line content blocks</text>
  <text x="55" y="405" class="label" fill="white">White text on brand blue</text>
  
  <!-- LEFT PAGE MEASUREMENTS -->
  <text x="20" y="15" class="measurement">LEFT: 100% BRAND BACKGROUND + WHITE TYPOGRAPHY</text>
  <text x="20" y="10" class="measurement">Pure brand expression with structured content</text>
  
  <!-- RIGHT PAGE: Geometric Photo Integration -->
  
  <!-- Brand typography - NEWWORK (black on white) -->
  <rect x="620" y="40" width="140" height="35" class="margin-text"/>
  <text x="625" y="52" class="label">NEWWORK</text>
  <text x="625" y="62" class="label">Black serif on white</text>
  
  <!-- Photo area (black and white portrait) -->
  <rect x="490" y="90" width="180" height="280" class="photo-area"/>
  <text x="495" y="105" class="label">PHOTO AREA</text>
  <text x="495" y="115" class="label">B&amp;W Portrait</text>
  <text x="495" y="125" class="label">~45% of page</text>
  
  <!-- Blue geometric overlays -->
  <rect x="460" y="150" width="120" height="80" class="geometric-overlay"/>
  <text x="465" y="165" class="label" fill="white">BLUE OVERLAY 1</text>
  <text x="465" y="175" class="label" fill="white">30% × 20%</text>
  
  <rect x="500" y="260" width="100" height="120" class="geometric-overlay"/>
  <text x="505" y="275" class="label" fill="white">BLUE OVERLAY 2</text>
  <text x="505" y="285" class="label" fill="white">25% × 30%</text>
  
  <!-- Large number "01" -->
  <rect x="690" y="180" width="80" height="120" class="number-element"/>
  <text x="695" y="200" class="label" fill="white">01</text>
  <text x="695" y="210" class="label" fill="white">Large number</text>
  <text x="695" y="220" class="label" fill="white">Brand blue</text>
  <text x="695" y="230" class="label" fill="white">Structural element</text>
  
  <!-- Right margin text content -->
  <rect x="720" y="80" width="60" height="60" class="margin-text"/>
  <text x="725" y="92" class="label">Margin Text 1</text>
  <text x="725" y="102" class="label">Small format</text>
  
  <rect x="720" y="320" width="60" height="80" class="margin-text"/>
  <text x="725" y="332" class="label">Margin Text 2</text>
  <text x="725" y="342" class="label">Editorial info</text>
  <text x="725" y="352" class="label">Credits</text>
  
  <rect x="720" y="420" width="60" height="60" class="margin-text"/>
  <text x="725" y="432" class="label">Margin Text 3</text>
  <text x="725" y="442" class="label">Additional</text>
  <text x="725" y="452" class="label">Details</text>
  
  <!-- RIGHT PAGE MEASUREMENTS -->
  <text x="420" y="15" class="measurement">RIGHT: PHOTO + GEOMETRIC OVERLAYS + MARGIN TEXT</text>
  <text x="420" y="10" class="measurement">Brand integration through color + geometry</text>
  
  <!-- BRAND COLOR SYSTEM INDICATORS -->
  <rect x="200" y="490" width="400" height="8" class="brand-guide"/>
  <text x="350" y="505" class="measurement" text-anchor="middle">BRAND BLUE CONNECTS BOTH PAGES</text>
  <text x="350" y="515" class="measurement" text-anchor="middle">Left: Background | Right: Geometric overlays</text>
  
  <!-- Geometric relationship indicators -->
  <line x1="300" y1="200" x2="520" y2="180" class="brand-guide"/>
  <text x="400" y="170" class="measurement" style="font-size: 6px;">Brand continuity</text>
  
  <!-- Proportional measurements -->
  <text x="50" y="450" class="measurement">Left text area: ~15% of blue background</text>
  <text x="420" y="450" class="measurement">Photo area: ~45% | Overlays: ~25% | Number: ~15%</text>
  <text x="420" y="460" class="measurement">Blue overlay blocks: 30×20% + 25×30%</text>
  <text x="420" y="470" class="measurement">Margin text: 3 blocks in right edge</text>
  
  <!-- Brand color consistency guides -->
  <circle cx="200" cy="150" r="4" fill="#4A90D9" opacity="0.8"/>
  <circle cx="550" cy="200" r="4" fill="#4A90D9" opacity="0.8"/>
  <line x1="204" y1="150" x2="546" y2="200" class="brand-guide"/>
  <text x="350" y="180" class="measurement" style="font-size: 6px;">Same brand blue</text>
</svg>