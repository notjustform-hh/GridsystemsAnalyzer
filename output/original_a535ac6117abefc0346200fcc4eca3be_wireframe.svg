<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .grid-line { 
        stroke: #E0E0E0; 
        stroke-width: 0.5px; 
        fill: none; 
        opacity: 0.4; 
      }
      .grid-major { 
        stroke: #BDBDBD; 
        stroke-width: 1.5px; 
        fill: none; 
      }
      .content-block { 
        fill: #1A56A0; 
        fill-opacity: 0.35; 
        stroke: #1A56A0; 
        stroke-width: 1.5px; 
      }
      .text-small { 
        fill: #4A90D9; 
        fill-opacity: 0.25; 
        stroke: #4A90D9; 
        stroke-width: 1px; 
      }
      .headline-large { 
        fill: #1A56A0; 
        fill-opacity: 0.45; 
        stroke: #1A56A0; 
        stroke-width: 2px; 
      }
      .brand-identity { 
        fill: #7BB3E0; 
        fill-opacity: 0.35; 
        stroke: #7BB3E0; 
        stroke-width: 1.5px; 
      }
      .whitespace-zone { 
        fill: none; 
        stroke: #EEEEEE; 
        stroke-width: 1px;
        stroke-dasharray: 3,3;
        opacity: 0.6;
      }
      .label { 
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; 
        font-size: 9px; 
        fill: #666666; 
      }
      .measurement { 
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; 
        font-size: 8px; 
        fill: #CC3333; 
        font-weight: bold; 
      }
      .spatial-guide {
        stroke: #33AA33;
        stroke-width: 1px;
        stroke-dasharray: 2,2;
        fill: none;
        opacity: 0.7;
      }
    </style>
  </defs>
  
  <!-- Page divide -->
  <line x1="400" y1="0" x2="400" y2="500" class="grid-major"/>
  
  <!-- LEFT PAGE: Asymmetric positioning with white space -->
  
  <!-- Golden ratio guide lines (spatial positioning) -->
  <line x1="120" y1="0" x2="120" y2="500" class="spatial-guide"/>
  <line x1="0" y1="190" x2="400" y2="190" class="spatial-guide"/>
  
  <!-- Large white space zone -->
  <rect x="20" y="40" width="280" height="280" class="whitespace-zone"/>
  <text x="160" y="180" class="label" text-anchor="middle">INTENTIONAL WHITE SPACE</text>
  <text x="160" y="195" class="label" text-anchor="middle">~70% of layout</text>
  
  <!-- Small content block (positioned using spatial algorithm) -->
  <rect x="30" y="340" width="120" height="120" class="content-block"/>
  <text x="35" y="355" class="label">Content Block</text>
  <text x="35" y="365" class="label">~30% width</text>
  <text x="35" y="375" class="label">Golden ratio position</text>
  
  <!-- LEFT PAGE MEASUREMENTS -->
  <text x="20" y="20" class="measurement">LEFT: ASYMMETRIC WHITE SPACE SYSTEM</text>
  <text x="20" y="30" class="measurement">30% content + 70% white space</text>
  
  <!-- RIGHT PAGE: Typography hierarchy -->
  
  <!-- Primary headline area (large serif names) -->
  <rect x="430" y="60" width="340" height="140" class="headline-large"/>
  <text x="435" y="75" class="label">PRIMARY HEADLINES</text>
  <text x="435" y="85" class="label">Large serif italic</text>
  <text x="435" y="95" class="label">"helmut schmid..."</text>
  <text x="435" y="105" class="label">~60% width upper right</text>
  
  <!-- Magazine identity block -->
  <rect x="620" y="220" width="150" height="80" class="brand-identity"/>
  <text x="625" y="235" class="label">MAGAZINE IDENTITY</text>
  <text x="625" y="245" class="label">"NEWWORK MAGAZINE"</text>
  <text x="625" y="255" class="label">Sans-serif, medium scale</text>
  
  <!-- Small metadata/issue info -->
  <rect x="720" y="30" width="60" height="25" class="text-small"/>
  <text x="725" y="45" class="label" style="font-size: 7px;">Issue info</text>
  
  <!-- Small metadata bottom right -->
  <rect x="720" y="450" width="60" height="40" class="text-small"/>
  <text x="725" y="465" class="label" style="font-size: 7px;">Metadata</text>
  
  <!-- RIGHT PAGE MEASUREMENTS -->
  <text x="420" y="20" class="measurement">RIGHT: SPATIAL TYPOGRAPHY HIERARCHY</text>
  <text x="420" y="30" class="measurement">3-scale system with optical positioning</text>
  
  <!-- Spatial relationship indicators -->
  <line x1="430" y1="200" x2="600" y2="220" class="spatial-guide"/>
  <text x="500" y="210" class="measurement" style="font-size: 7px;">Optical balance</text>
  
  <!-- Typography scale indicators -->
  <text x="430" y="320" class="measurement">SCALE 1: Large headlines (60pt)</text>
  <text x="430" y="335" class="measurement">SCALE 2: Brand identity (24pt)</text>
  <text x="430" y="350" class="measurement">SCALE 3: Metadata (10pt)</text>
  
  <!-- White space mathematical relationship -->
  <text x="30" y="480" class="measurement">WHITE SPACE ALGORITHM:</text>
  <text x="30" y="490" class="measurement">Golden ratio positioning (38.2% : 61.8%)</text>
  
  <!-- Content positioning guides -->
  <circle cx="90" cy="400" r="3" fill="#33AA33" opacity="0.8"/>
  <circle cx="600" cy="130" r="3" fill="#33AA33" opacity="0.8"/>
  <text x="10" y="400" class="measurement" style="font-size: 7px;">Golden ratio point</text>
  <text x="520" y="130" class="measurement" style="font-size: 7px;">Optical center</text>
</svg>