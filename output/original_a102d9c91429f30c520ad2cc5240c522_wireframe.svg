<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1000 1400" 
     role="img" aria-label="Grid analysis: Toro Y Moi Concert Poster - Outer Peace World Tour">

  <!-- LAYER 1: Page Frame & Margins -->
  <g id="layer-page" data-layer="page">
    <rect x="0" y="0" width="1000" height="1400" 
          fill="none" stroke="#FF00FF" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="500" y="15" text-anchor="middle" fill="#FF00FF" 
          font-family="monospace" font-size="12px" font-weight="bold">TORO Y MOI CONCERT POSTER: 1000 × 1400px (Music Tour Poster)</text>
    
    <!-- Page boundaries -->
    <rect x="40" y="40" width="920" height="1320" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="45" y="35" fill="#FF00FF" font-family="monospace" font-size="10px">POSTER AREA</text>
    
    <!-- Working margins -->
    <rect x="70" y="70" width="860" height="1260" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="75" y="65" fill="#8B0000" font-family="monospace" font-size="9px">WORKING MARGINS: 30px</text>
  </g>

  <!-- LAYER 2: Grid System -->
  <g id="layer-grid" data-layer="grid">
    <!-- Main title area -->
    <rect x="90" y="90" width="820" height="200" fill="none" stroke="#00CED1" stroke-width="2"/>
    <text x="95" y="85" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">TITLE TYPOGRAPHY ZONE</text>
    
    <!-- Keyboard graphic area -->
    <rect x="90" y="310" width="820" height="80" fill="none" stroke="#00CED1" stroke-width="1.5"/>
    <text x="95" y="305" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">KEYBOARD GRAPHIC</text>
    
    <!-- Background image area -->
    <rect x="90" y="410" width="820" height="600" fill="none" stroke="#00CED1" stroke-width="2"/>
    <text x="95" y="405" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">BACKGROUND PHOTOGRAPHY AREA</text>
    
    <!-- Tour dates area -->
    <rect x="90" y="1030" width="820" height="280" fill="none" stroke="#00CED1" stroke-width="1.5"/>
    <text x="95" y="1025" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">TOUR DATES TABLE</text>
    
    <!-- Tour dates columns -->
    <line x1="200" y1="1030" x2="200" y2="1310" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="350" y1="1030" x2="350" y2="1310" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="650" y1="1030" x2="650" y2="1310" stroke="#00CED1" stroke-width="0.5"/>
    <text x="95" y="1320" fill="#00CED1" font-family="monospace" font-size="8px">DATE | LOCATION | VENUE | STATUS</text>
  </g>

  <!-- LAYER 3: Content Blocks -->
  <g id="layer-content" data-layer="content">
    <!-- Main title "Toro Y Moi" -->
    <rect x="110" y="110" width="500" height="120" fill="none" stroke="#FF4444" stroke-width="3"/>
    <text x="115" y="105" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">LARGE "TORO Y MOI"</text>
    
    <!-- Subtitle elements -->
    <rect x="650" y="130" width="200" height="40" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="655" y="125" fill="#FF4444" font-family="monospace" font-size="8px">WORLD TOUR</text>
    
    <rect x="650" y="190" width="80" height="40" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="655" y="185" fill="#FF4444" font-family="monospace" font-size="8px">2019</text>
    
    <!-- Subtitle "Outer Peace" -->
    <rect x="110" y="240" width="360" height="50" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="115" y="235" fill="#FF4444" font-family="monospace" font-size="8px">OUTER PEACE</text>
    
    <!-- Piano keyboard graphic -->
    <rect x="110" y="320" width="780" height="60" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="115" y="315" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">PIANO KEYBOARD GRAPHIC</text>
    
    <!-- Background hands/organic imagery -->
    <rect x="110" y="430" width="780" height="560" fill="none" stroke="#FF4444" stroke-width="2" opacity="0.7"/>
    <text x="115" y="425" fill="#FF4444" font-family="monospace" font-size="8px">BACKGROUND HANDS/ORGANIC IMAGERY</text>
    
    <!-- Tour dates entries (first few visible) -->
    <rect x="110" y="1050" width="760" height="240" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="115" y="1045" fill="#FF4444" font-family="monospace" font-size="8px">TOUR DATES LIST</text>
    
    <!-- Sample tour date rows -->
    <rect x="120" y="1070" width="60" height="15" fill="none" stroke="#FF4444" stroke-width="0.5"/>
    <text x="125" y="1065" fill="#FF4444" font-family="monospace" font-size="6px">01/14</text>
    
    <rect x="200" y="1070" width="130" height="15" fill="none" stroke="#FF4444" stroke-width="0.5"/>
    <text x="205" y="1065" fill="#FF4444" font-family="monospace" font-size="6px">OAKLAND, CA</text>
    
    <rect x="350" y="1070" width="280" height="15" fill="none" stroke="#FF4444" stroke-width="0.5"/>
    <text x="355" y="1065" fill="#FF4444" font-family="monospace" font-size="6px">VENUE NAME</text>
    
    <rect x="650" y="1070" width="100" height="15" fill="none" stroke="#FF4444" stroke-width="0.5"/>
    <text x="655" y="1065" fill="#FF4444" font-family="monospace" font-size="6px">SOLD OUT</text>
    
    <!-- Footer branding -->
    <rect x="110" y="1310" width="150" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="115" y="1305" fill="#FF4444" font-family="monospace" font-size="7px">TOROYMOI.COM</text>
    
    <rect x="700" y="1310" width="190" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="705" y="1305" fill="#FF4444" font-family="monospace" font-size="7px">ADDITIONAL INFO</text>
  </g>

  <!-- LAYER 4: Proportional Analysis -->
  <g id="layer-proportions" data-layer="proportions">
    <!-- Golden ratio divisions -->
    <line x1="383" y1="70" x2="383" y2="1330" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="388" y="90" fill="#FFD700" font-family="monospace" font-size="8px">φ Division: 38.3%</text>
    
    <line x1="617" y1="70" x2="617" y2="1330" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="622" y="90" fill="#FFD700" font-family="monospace" font-size="8px">φ Division: 61.7%</text>
    
    <!-- Title area proportional analysis -->
    <rect x="110" y="110" width="500" height="120" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="115" y="240" fill="#FFD700" font-family="monospace" font-size="8px">Title: 50% × 8.6%</text>
    
    <!-- Background area proportional emphasis -->
    <rect x="110" y="430" width="780" height="560" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="115" y="1000" fill="#FFD700" font-family="monospace" font-size="8px">Background: 78% × 40%</text>
    
    <!-- Tour dates proportional analysis -->
    <rect x="110" y="1050" width="760" height="240" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="115" y="1300" fill="#FFD700" font-family="monospace" font-size="8px">Dates: 76% × 17.1%</text>
    
    <!-- Central proportional marker -->
    <circle cx="500" cy="700" r="8" fill="#FFD700" opacity="0.7"/>
    <text x="510" y="705" fill="#FFD700" font-family="monospace" font-size="8px">Center</text>
  </g>

  <!-- LAYER 5: Flow & Hierarchy -->
  <g id="layer-flow" data-layer="flow">
    <!-- Visual hierarchy flow -->
    <circle cx="360" cy="170" r="14" fill="#8844CC" opacity="0.8"/>
    <text x="355" y="176" fill="white" font-family="monospace" font-size="10px" font-weight="bold">1</text>
    
    <circle cx="290" cy="265" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="286" y="270" fill="white" font-family="monospace" font-size="9px" font-weight="bold">2</text>
    
    <circle cx="500" cy="350" r="10" fill="#8844CC" opacity="0.7"/>
    <text x="497" y="355" fill="white" font-family="monospace" font-size="8px" font-weight="bold">3</text>
    
    <circle cx="500" cy="700" r="10" fill="#8844CC" opacity="0.7"/>
    <text x="497" y="705" fill="white" font-family="monospace" font-size="8px" font-weight="bold">4</text>
    
    <circle cx="450" cy="1170" r="8" fill="#8844CC" opacity="0.6"/>
    <text x="447" y="1175" fill="white" font-family="monospace" font-size="7px" font-weight="bold">5</text>
    
    <!-- Flow arrows -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
              refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8844CC"/>
      </marker>
    </defs>
    
    <path d="M 360 184 Q 320 220 302 253" fill="none" stroke="#8844CC" 
          stroke-width="3" marker-end="url(#arrowhead)" opacity="0.7"/>
    <path d="M 290 277 Q 380 310 488 350" fill="none" stroke="#8844CC" 
          stroke-width="2" marker-end="url(#arrowhead)" opacity="0.6"/>
    <path d="M 500 360 Q 500 550 500 690" fill="none" stroke="#8844CC" 
          stroke-width="2" marker-end="url(#arrowhead)" opacity="0.6"/>
    <path d="M 500 710 Q 475 940 450 1162" fill="none" stroke="#8844CC" 
          stroke-width="2" marker-end="url(#arrowhead)" opacity="0.5"/>
  </g>

  <!-- LAYER 6: Info Panel -->
  <g id="layer-info" data-layer="info">
    <rect x="0" y="1400" width="1000" height="200" fill="#1a1a1a"/>
    
    <text x="20" y="1425" fill="white" font-family="monospace" font-size="14px" font-weight="bold">GRID ANALYSIS — TORO Y MOI CONCERT POSTER: OUTER PEACE WORLD TOUR</text>
    
    <text x="20" y="1445" fill="#FFD700" font-family="monospace" font-size="10px">FORMAT:</text>
    <text x="120" y="1445" fill="white" font-family="monospace" font-size="10px">1000×1400px concert poster | Music tour promotion | Single page format</text>
    
    <text x="20" y="1460" fill="#00CED1" font-family="monospace" font-size="10px">LAYOUT:</text>
    <text x="120" y="1460" fill="white" font-family="monospace" font-size="10px">Title typography zone | Keyboard graphic | Background photography | Tour dates table</text>
    
    <text x="20" y="1475" fill="#FF4444" font-family="monospace" font-size="10px">VISUAL:</text>
    <text x="120" y="1475" fill="white" font-family="monospace" font-size="10px">Large "TORO Y MOI" title | "Outer Peace" subtitle | Piano keyboard | Organic background imagery</text>
    
    <text x="20" y="1490" fill="#8844CC" font-family="monospace" font-size="10px">HIERARCHY:</text>
    <text x="120" y="1490" fill="white" font-family="monospace" font-size="10px">1. Artist name | 2. Album title | 3. Keyboard graphic | 4. Background | 5. Tour dates</text>
    
    <text x="20" y="1530" fill="#FFD700" font-family="monospace" font-size="9px">OBSERVATIONS:</text>
    <text x="20" y="1545" fill="white" font-family="monospace" font-size="9px">Organic design approach | Typography &amp; imagery integration | Music-visual connection through keyboard</text>
    <text x="20" y="1558" fill="white" font-family="monospace" font-size="9px">Tour promotion with detailed venue information | Contemporary poster design aesthetic</text>
    <text x="20" y="1571" fill="white" font-family="monospace" font-size="9px">Curved lines create visual flow | High contrast typography over photography</text>
  </g>

</svg>