<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .grid-line { 
        stroke: #E0E0E0; 
        stroke-width: 0.5px; 
        fill: none; 
        opacity: 0.6; 
      }
      .grid-major { 
        stroke: #BDBDBD; 
        stroke-width: 1.5px; 
        fill: none; 
      }
      .red-overlay { 
        fill: #E06070; 
        fill-opacity: 0.35; 
        stroke: #E06070; 
        stroke-width: 1.5px; 
      }
      .text-block { 
        fill: #4A90D9; 
        fill-opacity: 0.25; 
        stroke: #4A90D9; 
        stroke-width: 1px; 
      }
      .geometric-shape { 
        fill: #E06070; 
        fill-opacity: 0.45; 
        stroke: #E06070; 
        stroke-width: 2px; 
      }
      .photo-element { 
        fill: #E8A838; 
        fill-opacity: 0.4; 
        stroke: #E8A838; 
        stroke-width: 1.5px; 
      }
      .typography-large { 
        fill: #1A56A0; 
        fill-opacity: 0.3; 
        stroke: #1A56A0; 
        stroke-width: 2px; 
      }
      .label { 
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; 
        font-size: 9px; 
        fill: #666666; 
      }
      .measurement { 
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; 
        font-size: 8px; 
        fill: #CC3333; 
        font-weight: bold; 
      }
      .layer-indicator {
        stroke: #8844CC;
        stroke-width: 1px;
        stroke-dasharray: 4,2;
        fill: none;
        opacity: 0.7;
      }
    </style>
  </defs>
  
  <!-- Page divide -->
  <line x1="400" y1="0" x2="400" y2="500" class="grid-major"/>
  
  <!-- LEFT PAGE: Geometric overlay system -->
  
  <!-- Grid structure indicators -->
  <line x1="80" y1="0" x2="80" y2="500" class="grid-line"/>
  <line x1="160" y1="0" x2="160" y2="500" class="grid-line"/>
  <line x1="240" y1="0" x2="240" y2="500" class="grid-line"/>
  <line x1="320" y1="0" x2="320" y2="500" class="grid-line"/>
  
  <!-- Red overlay block (Layer 2) -->
  <rect x="20" y="50" width="100" height="150" class="red-overlay"/>
  <text x="25" y="65" class="label">RED BLOCK</text>
  <text x="25" y="75" class="label">25% × 30%</text>
  <text x="25" y="85" class="label">Layer 2</text>
  
  <!-- Typography elements within red block -->
  <rect x="30" y="100" width="80" height="40" class="typography-large"/>
  <text x="35" y="115" class="label" fill="white">"1"</text>
  <text x="35" y="125" class="label" fill="white">Large number</text>
  
  <!-- Text columns (Layer 1 - Base) -->
  <rect x="20" y="220" width="70" height="200" class="text-block"/>
  <rect x="100" y="220" width="70" height="200" class="text-block"/>
  <rect x="180" y="220" width="70" height="200" class="text-block"/>
  <rect x="260" y="220" width="70" height="200" class="text-block"/>
  
  <!-- Sequential number elements -->
  <rect x="130" y="160" width="40" height="40" class="typography-large"/>
  <text x="145" y="175" class="label">2</text>
  <rect x="200" y="160" width="40" height="40" class="typography-large"/>
  <text x="215" y="175" class="label">3</text>
  
  <!-- LEFT PAGE MEASUREMENTS -->
  <text x="20" y="20" class="measurement">LEFT: GEOMETRIC OVERLAY + GRID SYSTEM</text>
  <text x="20" y="30" class="measurement">Sequential elements (1-2-3) + columnar base</text>
  
  <!-- RIGHT PAGE: Red column + geometric integration -->
  
  <!-- Red column (full height) -->
  <rect x="420" y="50" width="140" height="400" class="red-overlay"/>
  <text x="425" y="65" class="label">RED COLUMN</text>
  <text x="425" y="75" class="label">35% width</text>
  <text x="425" y="85" class="label">Full height</text>
  
  <!-- Large "A" typography within red column -->
  <polygon points="460,120 500,200 520,200 525,180 475,180 480,120" class="typography-large" fill="white" fill-opacity="0.8"/>
  <text x="425" y="105" class="label">Large "A"</text>
  <text x="425" y="115" class="label">Integrated type</text>
  
  <!-- Text columns on right -->
  <rect x="570" y="100" width="60" height="300" class="text-block"/>
  <rect x="640" y="100" width="60" height="300" class="text-block"/>
  <rect x="710" y="100" width="60" height="300" class="text-block"/>
  
  <!-- RIGHT PAGE MEASUREMENTS -->
  <text x="420" y="20" class="measurement">RIGHT: RED COLUMN + TEXT GRID (35% : 65%)</text>
  <text x="420" y="30" class="measurement">Geometric integration with typography</text>
  
  <!-- CENTRAL GEOMETRIC ELEMENTS (Layer 3 - Overlays) -->
  
  <!-- Large circle spanning across spread -->
  <circle cx="380" cy="250" r="60" class="geometric-shape"/>
  <text x="350" y="240" class="label">CENTRAL CIRCLE</text>
  <text x="350" y="250" class="label">~15% diameter</text>
  <text x="350" y="260" class="label">Spans both pages</text>
  
  <!-- Photo element within circle -->
  <circle cx="380" cy="250" r="40" class="photo-element"/>
  <text x="355" y="275" class="label" style="font-size: 7px;">Portrait photo</text>
  
  <!-- Number "3" within circle -->
  <rect x="370" y="235" width="20" height="30" class="typography-large"/>
  <text x="375" y="250" class="label" fill="white">3</text>
  
  <!-- Arrow element -->
  <polygon points="340,250 360,240 360,245 380,245 380,255 360,255 360,260" class="geometric-shape"/>
  <text x="320" y="270" class="label" style="font-size: 7px;">Directional arrow</text>
  
  <!-- LAYER SYSTEM INDICATORS -->
  <rect x="50" y="450" width="300" height="40" class="layer-indicator"/>
  <text x="60" y="465" class="measurement">LAYER 1: Base grid + text columns</text>
  <text x="60" y="475" class="measurement">LAYER 2: Red overlays + blocks</text>
  <text x="60" y="485" class="measurement">LAYER 3: Geometric shapes + central elements</text>
  
  <!-- Geometric relationship indicators -->
  <line x1="120" y1="125" x2="380" y2="190" class="layer-indicator"/>
  <text x="200" y="150" class="measurement" style="font-size: 7px;">Geometric alignment</text>
  
  <!-- Proportional measurements -->
  <text x="30" y="440" class="measurement">Red block: 25% × 30%</text>
  <text x="170" y="440" class="measurement">Red column: 35% × 100%</text>
  <text x="300" y="440" class="measurement">Circle: 15% diameter</text>
  
  <!-- Spatial relationship guides -->
  <line x1="120" y1="50" x2="120" y2="200" class="layer-indicator"/>
  <line x1="490" y1="50" x2="490" y2="450" class="layer-indicator"/>
  <text x="125" y="130" class="measurement" style="font-size: 7px; transform: rotate(90deg);">25%</text>
  <text x="495" y="250" class="measurement" style="font-size: 7px; transform: rotate(90deg);">35%</text>
</svg>