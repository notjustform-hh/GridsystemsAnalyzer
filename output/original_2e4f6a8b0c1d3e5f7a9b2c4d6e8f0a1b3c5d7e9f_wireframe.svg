<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1200 800" 
     role="img" aria-label="Grid analysis: Paper Size Reference Chart">

  <!-- LAYER 1: Page Frame & Margins -->
  <g id="layer-page" data-layer="page">
    <!-- Overall page boundary -->
    <rect x="0" y="0" width="1200" height="650" 
          fill="none" stroke="#FF00FF" stroke-width="2" stroke-dasharray="5,5"/>
    <!-- Page label -->
    <text x="600" y="15" text-anchor="middle" fill="#FF00FF" 
          font-family="monospace" font-size="12px" font-weight="bold">SINGLE PAGE: 1200 × 650px</text>
    
    <!-- Margins -->
    <rect x="40" y="40" width="1120" height="570" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="45" y="30" fill="#8B0000" font-family="monospace" font-size="9px">Margins: 40px all sides</text>
  </g>

  <!-- LAYER 2: Grid System -->
  <g id="layer-grid" data-layer="grid">
    <!-- Main content area division -->
    <rect x="60" y="60" width="580" height="350" fill="none" stroke="#00CED1" stroke-width="2"/>
    <text x="65" y="55" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">DIAGRAM AREA</text>
    <text x="65" y="67" fill="#00CED1" font-family="monospace" font-size="8px">580×350px nested format system</text>
    
    <!-- Text information area -->
    <rect x="680" y="60" width="480" height="350" fill="none" stroke="#00CED1" stroke-width="2"/>
    <text x="685" y="55" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">INFORMATION AREA</text>
    <text x="685" y="67" fill="#00CED1" font-family="monospace" font-size="8px">480×350px text specifications</text>
    
    <!-- Grid lines within diagram area -->
    <!-- A2 division -->
    <line x1="350" y1="60" x2="350" y2="240" stroke="#00CED1" stroke-width="1"/>
    <!-- A3 divisions -->
    <line x1="60" y1="240" x2="350" y2="240" stroke="#00CED1" stroke-width="1"/>
    <line x1="230" y1="240" x2="230" y2="410" stroke="#00CED1" stroke-width="1"/>
    
    <!-- Smaller format grid lines -->
    <line x1="230" y1="320" x2="350" y2="320" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="290" y1="240" x2="290" y2="320" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="320" y1="240" x2="320" y2="290" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="290" y1="290" x2="320" y2="290" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="320" y1="275" x2="335" y2="275" stroke="#00CED1" stroke-width="0.5"/>
    
    <!-- Information area grid -->
    <line x1="680" y1="200" x2="1160" y2="200" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="680" y1="300" x2="1160" y2="300" stroke="#00CED1" stroke-width="0.5"/>
    
    <!-- Labels -->
    <text x="645" y="150" fill="#00CED1" font-family="monospace" font-size="8px">Info</text>
  </g>

  <!-- LAYER 3: Content Blocks -->
  <g id="layer-content" data-layer="content">
    <!-- A1 (largest format) -->
    <rect x="350" y="60" width="290" height="350" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="360" y="55" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">A1</text>
    <text x="480" y="240" fill="#FF4444" font-family="monospace" font-size="14px" font-weight="bold">A1</text>
    
    <!-- A2 -->
    <rect x="60" y="60" width="290" height="180" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="70" y="55" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">A2</text>
    <text x="180" y="160" fill="#FF4444" font-family="monospace" font-size="14px" font-weight="bold">A2</text>
    
    <!-- A3 -->
    <rect x="60" y="240" width="170" height="170" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="70" y="235" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">A3</text>
    <text x="130" y="330" fill="#FF4444" font-family="monospace" font-size="12px" font-weight="bold">A3</text>
    
    <!-- A4 -->
    <rect x="230" y="240" width="120" height="80" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="240" y="235" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">A4</text>
    <text x="280" y="285" fill="#FF4444" font-family="monospace" font-size="10px" font-weight="bold">A4</text>
    
    <!-- A5 -->
    <rect x="290" y="240" width="60" height="80" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="300" y="235" fill="#FF4444" font-family="monospace" font-size="7px" font-weight="bold">A5</text>
    <text x="315" y="285" fill="#FF4444" font-family="monospace" font-size="8px">A5</text>
    
    <!-- A6 -->
    <rect x="230" y="320" width="60" height="40" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="240" y="315" fill="#FF4444" font-family="monospace" font-size="7px">A6</text>
    <text x="250" y="345" fill="#FF4444" font-family="monospace" font-size="7px">A6</text>
    
    <!-- A7 -->
    <rect x="290" y="320" width="30" height="40" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="295" y="315" fill="#FF4444" font-family="monospace" font-size="6px">A7</text>
    <text x="300" y="345" fill="#FF4444" font-family="monospace" font-size="6px">A7</text>
    
    <!-- A8 -->
    <rect x="320" y="240" width="30" height="35" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="325" y="235" fill="#FF4444" font-family="monospace" font-size="6px">A8</text>
    <text x="330" y="260" fill="#FF4444" font-family="monospace" font-size="6px">A8</text>
    
    <!-- INFORMATION PANEL -->
    <rect x="700" y="80" width="440" height="300" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="710" y="75" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">SIZE SPECIFICATIONS</text>
    
    <!-- Size listing -->
    <text x="720" y="110" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">A0 = 841 × 1189 mm</text>
    <text x="720" y="125" fill="#FF4444" font-family="monospace" font-size="8px">A1 = 594 × 841 mm</text>
    <text x="720" y="140" fill="#FF4444" font-family="monospace" font-size="8px">A2 = 420 × 594 mm</text>
    <text x="720" y="155" fill="#FF4444" font-family="monospace" font-size="8px">A3 = 297 × 420 mm</text>
    <text x="720" y="170" fill="#FF4444" font-family="monospace" font-size="8px">A4 = 210 × 297 mm</text>
    <text x="720" y="185" fill="#FF4444" font-family="monospace" font-size="8px">A5 = 148 × 210 mm</text>
    
    <text x="920" y="110" fill="#FF4444" font-family="monospace" font-size="8px">A6 = 105 × 148 mm</text>
    <text x="920" y="125" fill="#FF4444" font-family="monospace" font-size="8px">A7 = 74 × 105 mm</text>
    <text x="920" y="140" fill="#FF4444" font-family="monospace" font-size="8px">A8 = 52 × 74 mm</text>
    <text x="920" y="155" fill="#FF4444" font-family="monospace" font-size="8px">A9 = 37 × 52 mm</text>
    <text x="920" y="170" fill="#FF4444" font-family="monospace" font-size="8px">A10 = 26 × 37 mm</text>
    
    <!-- Diagram area detail -->
    <rect x="720" y="220" width="200" height="80" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="725" y="215" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">VISUAL NESTING</text>
    <text x="725" y="240" fill="#FF4444" font-family="monospace" font-size="7px">Each size = 1/2 area of previous</text>
    <text x="725" y="252" fill="#FF4444" font-family="monospace" font-size="7px">√2 ratio maintains proportions</text>
    <text x="725" y="264" fill="#FF4444" font-family="monospace" font-size="7px">Geometric progression system</text>
    <text x="725" y="276" fill="#FF4444" font-family="monospace" font-size="7px">ISO 216 international standard</text>
    
    <!-- Mathematical basis -->
    <rect x="940" y="220" width="180" height="80" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="945" y="215" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">MATHEMATICAL BASIS</text>
    <text x="945" y="240" fill="#FF4444" font-family="monospace" font-size="7px">Ratio: 1:√2 (1:1.414)</text>
    <text x="945" y="252" fill="#FF4444" font-family="monospace" font-size="7px">Base: A0 = 1 m²</text>
    <text x="945" y="264" fill="#FF4444" font-family="monospace" font-size="7px">Consistent proportions</text>
    <text x="945" y="276" fill="#FF4444" font-family="monospace" font-size="7px">Folding compatibility</text>
  </g>

  <!-- LAYER 4: Proportional Analysis -->
  <g id="layer-proportions" data-layer="proportions">
    <!-- √2 ratio guides -->
    <line x1="440" y1="60" x2="440" y2="410" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="445" y="80" fill="#FFD700" font-family="monospace" font-size="8px">√2 division: 1.414</text>
    
    <!-- Proportional relationships -->
    <rect x="55" y="55" width="590" height="360" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="60" y="430" fill="#FFD700" font-family="monospace" font-size="8px">Diagram proportions: 1.64:1 ≈ √2 + φ</text>
    
    <!-- Mathematical center -->
    <circle cx="350" cy="235" r="6" fill="#FFD700" opacity="0.7"/>
    <text x="360" y="240" fill="#FFD700" font-family="monospace" font-size="8px">System center</text>
    
    <!-- Format progression lines -->
    <path d="M205,150 Q275,200 290,280" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M290,280 Q310,300 320,255" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="250" y="400" fill="#FFD700" font-family="monospace" font-size="8px">Geometric progression</text>
  </g>

  <!-- LAYER 5: Flow & Hierarchy -->
  <g id="layer-flow" data-layer="flow">
    <!-- Reading flow for understanding system -->
    <circle cx="205" cy="150" r="8" fill="#8844CC" opacity="0.8"/>
    <text x="180" y="170" fill="#8844CC" font-family="monospace" font-size="8px">1. Start A2</text>
    
    <!-- System flow arrows -->
    <path d="M210,155 Q250,180 290,280" fill="none" stroke="#8844CC" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M295,285 Q310,300 720,200" fill="none" stroke="#8844CC" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Hierarchy indicators -->
    <circle cx="495" cy="235" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="490" y="240" fill="white" font-family="monospace" font-size="9px" font-weight="bold">1</text>
    
    <circle cx="920" cy="150" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="915" y="155" fill="white" font-family="monospace" font-size="9px" font-weight="bold">2</text>
    
    <!-- Arrow marker -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
              refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8844CC"/>
      </marker>
    </defs>
  </g>

  <!-- LAYER 6: Info Panel -->
  <g id="layer-info" data-layer="info">
    <!-- Dark background panel -->
    <rect x="0" y="650" width="1200" height="150" fill="#1a1a1a"/>
    
    <!-- Title -->
    <text x="20" y="675" fill="white" font-family="monospace" font-size="14px" font-weight="bold">GRID ANALYSIS — PAPER SIZE REFERENCE CHART</text>
    
    <!-- Row 1: Page dimensions -->
    <text x="20" y="695" fill="#FFD700" font-family="monospace" font-size="10px">PAGE:</text>
    <text x="120" y="695" fill="white" font-family="monospace" font-size="10px">1200×650px | Aspect: 1.85:1 | Educational diagram format</text>
    
    <!-- Row 2: Content structure -->
    <text x="20" y="710" fill="#00CED1" font-family="monospace" font-size="10px">LAYOUT:</text>
    <text x="120" y="710" fill="white" font-family="monospace" font-size="10px">Visual diagram (48%) + Information panel (40%) | Mathematical demonstration</text>
    
    <!-- Row 3: System -->
    <text x="20" y="725" fill="#FF4444" font-family="monospace" font-size="10px">SYSTEM:</text>
    <text x="120" y="725" fill="white" font-family="monospace" font-size="10px">ISO 216 A-series | √2 ratio (1:1.414) | Nested geometric progression A0-A10</text>
    
    <!-- Row 4: Educational purpose -->
    <text x="20" y="740" fill="#FFD700" font-family="monospace" font-size="10px">PURPOSE:</text>
    <text x="120" y="740" fill="white" font-family="monospace" font-size="10px">Technical reference | Shows proportional relationships | Design education tool</text>
    
    <!-- Observations -->
    <text x="20" y="760" fill="#FFD700" font-family="monospace" font-size="9px">OBSERVATIONS:</text>
    <text x="20" y="775" fill="white" font-family="monospace" font-size="9px">Mathematical elegance: each format exactly 1/2 area of previous | √2 ratio maintains proportions when folded</text>
    <text x="20" y="788" fill="white" font-family="monospace" font-size="9px">Visual + textual learning: diagram shows nesting, text provides specifications | International standard reference</text>
  </g>

</svg>