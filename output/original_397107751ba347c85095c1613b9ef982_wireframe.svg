<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1600 1200" 
     role="img" aria-label="Grid analysis: Minimalist Typography Spread - NU Letterforms">

  <!-- LAYER 1: Page Frame & Margins -->
  <g id="layer-page" data-layer="page">
    <rect x="0" y="0" width="1600" height="1200" 
          fill="none" stroke="#FF00FF" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="800" y="15" text-anchor="middle" fill="#FF00FF" 
          font-family="monospace" font-size="12px" font-weight="bold">SINGLE PAGE LAYOUT: 1600 × 1200px (4:3 Ratio)</text>
    
    <!-- Page boundaries -->
    <rect x="80" y="80" width="1440" height="1040" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="85" y="75" fill="#FF00FF" font-family="monospace" font-size="10px">CONTENT AREA</text>
    
    <!-- Margins -->
    <rect x="120" y="120" width="1360" height="960" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="125" y="115" fill="#8B0000" font-family="monospace" font-size="9px">WORKING MARGINS: 40px</text>
  </g>

  <!-- LAYER 2: Grid System -->
  <g id="layer-grid" data-layer="grid">
    <!-- Central axis -->
    <line x1="800" y1="120" x2="800" y2="1080" stroke="#00CED1" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="805" y="140" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">CENTRAL AXIS</text>
    
    <!-- Horizontal divisions -->
    <line x1="120" y1="400" x2="1480" y2="400" stroke="#00CED1" stroke-width="1"/>
    <text x="125" y="395" fill="#00CED1" font-family="monospace" font-size="8px">TOP ZONE</text>
    
    <line x1="120" y1="800" x2="1480" y2="800" stroke="#00CED1" stroke-width="1"/>
    <text x="125" y="795" fill="#00CED1" font-family="monospace" font-size="8px">LOWER ZONE</text>
    
    <!-- Typography zones -->
    <rect x="160" y="200" width="580" height="520" fill="none" stroke="#00CED1" stroke-width="1.5"/>
    <text x="165" y="195" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">"N" LETTERFORM ZONE</text>
    
    <rect x="860" y="200" width="580" height="520" fill="none" stroke="#00CED1" stroke-width="1.5"/>
    <text x="865" y="195" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">"U" LETTERFORM ZONE</text>
    
    <!-- Text areas -->
    <rect x="160" y="840" width="580" height="180" fill="none" stroke="#00CED1" stroke-width="1"/>
    <rect x="860" y="840" width="580" height="180" fill="none" stroke="#00CED1" stroke-width="1"/>
  </g>

  <!-- LAYER 3: Content Blocks -->
  <g id="layer-content" data-layer="content">
    <!-- Large "N" letterform -->
    <rect x="180" y="220" width="540" height="480" fill="none" stroke="#FF4444" stroke-width="4"/>
    <text x="185" y="215" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">LARGE "N" - PRIMARY</text>
    
    <!-- Letter "N" stroke elements -->
    <rect x="200" y="240" width="80" height="440" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="205" y="235" fill="#FF4444" font-family="monospace" font-size="7px">Left Stem</text>
    
    <rect x="320" y="240" width="240" height="60" fill="none" stroke="#FF4444" stroke-width="1" 
          transform="rotate(60 440 270)"/>
    <text x="325" y="235" fill="#FF4444" font-family="monospace" font-size="7px">Diagonal</text>
    
    <rect x="600" y="240" width="80" height="440" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="605" y="235" fill="#FF4444" font-family="monospace" font-size="7px">Right Stem</text>
    
    <!-- Large "U" letterform -->
    <rect x="880" y="220" width="540" height="480" fill="none" stroke="#FF4444" stroke-width="4"/>
    <text x="885" y="215" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">LARGE "U" - PRIMARY</text>
    
    <!-- Letter "U" stroke elements -->
    <rect x="900" y="240" width="80" height="380" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="905" y="235" fill="#FF4444" font-family="monospace" font-size="7px">Left Stem</text>
    
    <rect x="920" y="600" width="260" height="80" fill="none" stroke="#FF4444" stroke-width="2" 
          rx="40" ry="40"/>
    <text x="925" y="595" fill="#FF4444" font-family="monospace" font-size="7px">Curved Base</text>
    
    <rect x="1300" y="240" width="80" height="380" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="1305" y="235" fill="#FF4444" font-family="monospace" font-size="7px">Right Stem</text>
    
    <!-- Supporting text blocks -->
    <rect x="180" y="860" width="540" height="140" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="185" y="855" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">LEFT TEXT BLOCK</text>
    
    <rect x="880" y="860" width="540" height="140" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="885" y="855" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">RIGHT TEXT BLOCK</text>
    
    <!-- Page numbers/attribution -->
    <rect x="120" y="1040" width="100" height="40" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="125" y="1035" fill="#FF4444" font-family="monospace" font-size="7px">LEFT FOOTER</text>
    
    <rect x="1380" y="1040" width="100" height="40" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1385" y="1035" fill="#FF4444" font-family="monospace" font-size="7px">RIGHT FOOTER</text>
  </g>

  <!-- LAYER 4: Proportional Analysis -->
  <g id="layer-proportions" data-layer="proportions">
    <!-- Golden ratio divisions -->
    <line x1="618" y1="120" x2="618" y2="1080" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="623" y="140" fill="#FFD700" font-family="monospace" font-size="8px">φ Division: 38.2%</text>
    
    <line x1="982" y1="120" x2="982" y2="1080" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="987" y="140" fill="#FFD700" font-family="monospace" font-size="8px">φ Division: 61.8%</text>
    
    <!-- Typography zones proportional analysis -->
    <rect x="180" y="220" width="540" height="480" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="185" y="715" fill="#FFD700" font-family="monospace" font-size="8px">"N" zone: 33.75% × 40%</text>
    
    <rect x="880" y="220" width="540" height="480" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="885" y="715" fill="#FFD700" font-family="monospace" font-size="8px">"U" zone: 33.75% × 40%</text>
    
    <!-- Central proportional marker -->
    <circle cx="800" cy="460" r="8" fill="#FFD700" opacity="0.7"/>
    <text x="810" y="465" fill="#FFD700" font-family="monospace" font-size="8px">Center</text>
  </g>

  <!-- LAYER 5: Flow & Hierarchy -->
  <g id="layer-flow" data-layer="flow">
    <!-- Primary reading flow -->
    <circle cx="450" cy="460" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="445" y="465" fill="white" font-family="monospace" font-size="9px" font-weight="bold">1</text>
    
    <circle cx="1150" cy="460" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="1145" y="465" fill="white" font-family="monospace" font-size="9px" font-weight="bold">2</text>
    
    <circle cx="450" cy="920" r="10" fill="#8844CC" opacity="0.6"/>
    <text x="447" y="925" fill="white" font-family="monospace" font-size="8px" font-weight="bold">3</text>
    
    <circle cx="1150" cy="920" r="10" fill="#8844CC" opacity="0.6"/>
    <text x="1147" y="925" fill="white" font-family="monospace" font-size="8px" font-weight="bold">4</text>
    
    <!-- Flow arrows -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
              refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8844CC"/>
      </marker>
    </defs>
    
    <path d="M 462 460 Q 700 440 1138 460" fill="none" stroke="#8844CC" 
          stroke-width="2" marker-end="url(#arrowhead)" opacity="0.7"/>
    <path d="M 450 472 Q 450 700 450 908" fill="none" stroke="#8844CC" 
          stroke-width="1.5" marker-end="url(#arrowhead)" opacity="0.5"/>
  </g>

  <!-- LAYER 6: Info Panel -->
  <g id="layer-info" data-layer="info">
    <rect x="0" y="1200" width="1600" height="200" fill="#1a1a1a"/>
    
    <text x="20" y="1225" fill="white" font-family="monospace" font-size="14px" font-weight="bold">GRID ANALYSIS — MINIMALIST TYPOGRAPHY SPREAD: "NU" LETTERFORMS</text>
    
    <text x="20" y="1245" fill="#FFD700" font-family="monospace" font-size="10px">FORMAT:</text>
    <text x="120" y="1245" fill="white" font-family="monospace" font-size="10px">1600×1200px single page | 4:3 aspect ratio | Typography specimen format</text>
    
    <text x="20" y="1260" fill="#00CED1" font-family="monospace" font-size="10px">LAYOUT:</text>
    <text x="120" y="1260" fill="white" font-family="monospace" font-size="10px">Bilateral symmetry | Central axis division | Large letterforms with supporting text zones</text>
    
    <text x="20" y="1275" fill="#FF4444" font-family="monospace" font-size="10px">TYPE:</text>
    <text x="120" y="1275" fill="white" font-family="monospace" font-size="10px">Extreme scale letterforms "NU" | Sans-serif construction | Minimal supporting text</text>
    
    <text x="20" y="1290" fill="#8844CC" font-family="monospace" font-size="10px">HIERARCHY:</text>
    <text x="120" y="1290" fill="white" font-family="monospace" font-size="10px">1. "N" letterform | 2. "U" letterform | 3. Left text | 4. Right text</text>
    
    <text x="20" y="1330" fill="#FFD700" font-family="monospace" font-size="9px">OBSERVATIONS:</text>
    <text x="20" y="1345" fill="white" font-family="monospace" font-size="9px">Perfect bilateral symmetry | Typography as primary content | Minimalist aesthetic maximizes letterform impact</text>
    <text x="20" y="1358" fill="white" font-family="monospace" font-size="9px">Large letterforms occupy 67% of vertical space | Golden ratio present in proportional divisions</text>
    <text x="20" y="1371" fill="white" font-family="monospace" font-size="9px">Educational typography specimen | Form and function unified in letterform demonstration</text>
  </g>

</svg>