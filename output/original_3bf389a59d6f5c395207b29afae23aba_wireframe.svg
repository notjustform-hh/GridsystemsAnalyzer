<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1400 1000" 
     role="img" aria-label="Grid analysis: Swiss Typography Double-Page Spread">

  <!-- LAYER 1: Page Frame & Margins -->
  <g id="layer-page" data-layer="page">
    <!-- Overall spread boundary -->
    <rect x="0" y="0" width="1400" height="800" 
          fill="none" stroke="#FF00FF" stroke-width="2" stroke-dasharray="5,5"/>
    <!-- Spread label -->
    <text x="700" y="15" text-anchor="middle" fill="#FF00FF" 
          font-family="monospace" font-size="12px" font-weight="bold">DOUBLE-PAGE SPREAD: 1400 × 800px</text>
    
    <!-- Left page boundary -->
    <rect x="40" y="40" width="620" height="720" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="45" y="30" fill="#FF00FF" font-family="monospace" font-size="10px">LEFT PAGE</text>
    
    <!-- Right page boundary -->
    <rect x="740" y="40" width="620" height="720" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="1045" y="30" fill="#FF00FF" font-family="monospace" font-size="10px">RIGHT PAGE</text>
    
    <!-- Gutter/Spine -->
    <line x1="700" y1="0" x2="700" y2="800" stroke="#FF00FF" stroke-width="3"/>
    <text x="705" y="15" fill="#FF00FF" font-family="monospace" font-size="9px">SPINE</text>
    
    <!-- Margins -->
    <rect x="80" y="80" width="540" height="640" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="780" y="80" width="540" height="640" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="85" y="70" fill="#8B0000" font-family="monospace" font-size="8px">Margins: 40px all sides</text>
  </g>

  <!-- LAYER 2: Grid System -->
  <g id="layer-grid" data-layer="grid">
    <!-- LEFT PAGE Grid -->
    <!-- Vertical divisions (3-column system) -->
    <line x1="240" y1="80" x2="240" y2="720" stroke="#00CED1" stroke-width="1"/>
    <line x1="460" y1="80" x2="460" y2="720" stroke="#00CED1" stroke-width="1"/>
    
    <!-- Left page column labels -->
    <text x="160" y="100" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">L1</text>
    <text x="350" y="100" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">L2</text>
    <text x="560" y="100" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">L3</text>
    
    <!-- RIGHT PAGE Grid -->
    <!-- Vertical divisions (3-column system) -->
    <line x1="940" y1="80" x2="940" y2="720" stroke="#00CED1" stroke-width="1"/>
    <line x1="1160" y1="80" x2="1160" y2="720" stroke="#00CED1" stroke-width="1"/>
    
    <!-- Right page column labels -->
    <text x="860" y="100" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">R1</text>
    <text x="1050" y="100" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">R2</text>
    <text x="1260" y="100" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">R3</text>
    
    <!-- Horizontal zones (both pages) -->
    <line x1="80" y1="200" x2="620" y2="200" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="80" y1="350" x2="620" y2="350" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="80" y1="500" x2="620" y2="500" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="80" y1="650" x2="620" y2="650" stroke="#00CED1" stroke-width="0.5"/>
    
    <line x1="780" y1="200" x2="1320" y2="200" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="780" y1="350" x2="1320" y2="350" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="780" y1="500" x2="1320" y2="500" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="780" y1="650" x2="1320" y2="650" stroke="#00CED1" stroke-width="0.5"/>
    
    <!-- Zone labels -->
    <text x="630" y="140" fill="#00CED1" font-family="monospace" font-size="8px">Z1</text>
    <text x="630" y="275" fill="#00CED1" font-family="monospace" font-size="8px">Z2</text>
    <text x="630" y="425" fill="#00CED1" font-family="monospace" font-size="8px">Z3</text>
    <text x="630" y="575" fill="#00CED1" font-family="monospace" font-size="8px">Z4</text>
    <text x="630" y="700" fill="#00CED1" font-family="monospace" font-size="8px">Z5</text>
  </g>

  <!-- LAYER 3: Content Blocks -->
  <g id="layer-content" data-layer="content">
    <!-- LEFT PAGE CONTENT -->
    
    <!-- Page number "3" -->
    <rect x="90" y="90" width="40" height="60" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="95" y="85" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">PAGE "3"</text>
    <text x="95" y="165" fill="#FF4444" font-family="monospace" font-size="7px">40×60px</text>
    
    <!-- Small text block (top right) -->
    <rect x="480" y="90" width="120" height="80" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="485" y="85" fill="#FF4444" font-family="monospace" font-size="7px">Caption text block</text>
    <text x="485" y="180" fill="#FF4444" font-family="monospace" font-size="7px">120×80px</text>
    
    <!-- Large "merz 60" typography -->
    <rect x="90" y="220" width="280" height="120" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="95" y="215" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">MERZ 60</text>
    <text x="95" y="227" fill="#FF4444" font-family="monospace" font-size="7px">280×120px display</text>
    <text x="95" y="351" fill="#FF4444" font-family="monospace" font-size="7px">Spans columns L1-L2</text>
    
    <!-- Horizontal line separator -->
    <line x1="90" y1="380" x2="580" y2="380" stroke="#FF4444" stroke-width="1"/>
    <text x="95" y="375" fill="#FF4444" font-family="monospace" font-size="7px">Separator line</text>
    
    <!-- Fragmented text "ipo rafise onaz letr" -->
    <rect x="90" y="420" width="180" height="180" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="95" y="415" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">FRAGMENTED TEXT</text>
    <text x="95" y="427" fill="#FF4444" font-family="monospace" font-size="7px">"ipo rafise onaz letr"</text>
    <text x="95" y="439" fill="#FF4444" font-family="monospace" font-size="7px">180×180px</text>
    <text x="95" y="611" fill="#FF4444" font-family="monospace" font-size="7px">Spans column L1</text>
    
    <!-- RIGHT PAGE CONTENT -->
    
    <!-- Page number "4" -->
    <rect x="790" y="480" width="40" height="60" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="795" y="475" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">PAGE "4"</text>
    <text x="795" y="555" fill="#FF4444" font-family="monospace" font-size="7px">40×60px</text>
    
    <!-- Small text block (top right) -->
    <rect x="1180" y="90" width="120" height="80" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1185" y="85" fill="#FF4444" font-family="monospace" font-size="7px">Caption text block</text>
    <text x="1185" y="180" fill="#FF4444" font-family="monospace" font-size="7px">120×80px</text>
    
    <!-- "april 60" -->
    <rect x="940" y="380" width="160" height="60" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="945" y="375" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">APRIL 60</text>
    <text x="945" y="387" fill="#FF4444" font-family="monospace" font-size="7px">160×60px</text>
    <text x="945" y="451" fill="#FF4444" font-family="monospace" font-size="7px">Column R2</text>
    
    <!-- "tipo" -->
    <rect x="1180" y="380" width="100" height="80" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="1185" y="375" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">TIPO</text>
    <text x="1185" y="387" fill="#FF4444" font-family="monospace" font-size="7px">100×80px</text>
    <text x="1185" y="471" fill="#FF4444" font-family="monospace" font-size="7px">Column R3</text>
    
    <!-- "im prime" -->
    <rect x="1180" y="520" width="120" height="80" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1185" y="515" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">IM PRIME</text>
    <text x="1185" y="527" fill="#FF4444" font-family="monospace" font-size="7px">120×80px</text>
    <text x="1185" y="611" fill="#FF4444" font-family="monospace" font-size="7px">Column R3</text>
  </g>

  <!-- LAYER 4: Proportional Analysis -->
  <g id="layer-proportions" data-layer="proportions">
    <!-- Golden ratio guides across spread -->
    <line x1="535" y1="80" x2="535" y2="720" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="540" y="100" fill="#FFD700" font-family="monospace" font-size="8px">φ Left: 61.8%</text>
    
    <line x1="865" y1="80" x2="865" y2="720" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="870" y="100" fill="#FFD700" font-family="monospace" font-size="8px">φ Right: 38.2%</text>
    
    <!-- Horizontal golden section -->
    <line x1="80" y1="575" x2="1320" y2="575" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="90" y="570" fill="#FFD700" font-family="monospace" font-size="8px">φ Horizontal: 61.8%</text>
    
    <!-- Typography scale relationships -->
    <rect x="85" y="215" width="290" height="130" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="90" y="355" fill="#FFD700" font-family="monospace" font-size="8px">Primary type zone</text>
    
    <!-- Spread center balance point -->
    <circle cx="700" cy="400" r="8" fill="#FFD700" opacity="0.7"/>
    <text x="710" y="405" fill="#FFD700" font-family="monospace" font-size="8px">Spread center</text>
  </g>

  <!-- LAYER 5: Flow & Hierarchy -->
  <g id="layer-flow" data-layer="flow">
    <!-- Reading entry points -->
    <circle cx="110" cy="110" r="8" fill="#8844CC" opacity="0.8"/>
    <text x="85" y="130" fill="#8844CC" font-family="monospace" font-size="8px">1. Start</text>
    
    <!-- Visual flow arrows -->
    <path d="M110,120 Q200,160 280,240" fill="none" stroke="#8844CC" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M280,340 Q400,360 520,120" fill="none" stroke="#8844CC" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M620,200 Q680,300 810,500" fill="none" stroke="#8844CC" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M850,500 Q1000,420 1180,400" fill="none" stroke="#8844CC" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Hierarchy indicators -->
    <circle cx="190" cy="280" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="185" y="285" fill="white" font-family="monospace" font-size="9px" font-weight="bold">1</text>
    
    <circle cx="810" cy="500" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="805" y="505" fill="white" font-family="monospace" font-size="9px" font-weight="bold">2</text>
    
    <circle cx="1020" cy="420" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="1015" y="425" fill="white" font-family="monospace" font-size="9px" font-weight="bold">3</text>
    
    <!-- Arrow marker definition -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
              refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8844CC"/>
      </marker>
    </defs>
  </g>

  <!-- LAYER 6: Info Panel -->
  <g id="layer-info" data-layer="info">
    <!-- Dark background panel -->
    <rect x="0" y="800" width="1400" height="200" fill="#1a1a1a"/>
    
    <!-- Title -->
    <text x="20" y="825" fill="white" font-family="monospace" font-size="14px" font-weight="bold">GRID ANALYSIS — SWISS TYPOGRAPHY DOUBLE-PAGE SPREAD</text>
    
    <!-- Row 1: Spread dimensions -->
    <text x="20" y="845" fill="#FFD700" font-family="monospace" font-size="10px">SPREAD:</text>
    <text x="120" y="845" fill="white" font-family="monospace" font-size="10px">1400×800px | Individual pages: 620×720px | Aspect: 1.75:1 | φ proximity: 92% match</text>
    
    <!-- Row 2: Grid structure -->
    <text x="20" y="860" fill="#00CED1" font-family="monospace" font-size="10px">GRID:</text>
    <text x="120" y="860" fill="white" font-family="monospace" font-size="10px">Symmetrical 3-column system per page | 5 horizontal zones | 40px margins | Swiss grid principles</text>
    
    <!-- Row 3: Typography -->
    <text x="20" y="875" fill="#FF4444" font-family="monospace" font-size="10px">TYPOGRAPHY:</text>
    <text x="120" y="875" fill="white" font-family="monospace" font-size="10px">Sans-serif hierarchy | Display: "merz 60" (120px height) | Body: fragmented text approach</text>
    
    <!-- Row 4: Content distribution -->
    <text x="20" y="890" fill="#FFD700" font-family="monospace" font-size="10px">BALANCE:</text>
    <text x="120" y="890" fill="white" font-family="monospace" font-size="10px">Left page: dominant "merz 60" + fragmented text | Right page: distributed "april 60", "tipo", "im prime"</text>
    
    <!-- Color legend -->
    <text x="20" y="910" fill="white" font-family="monospace" font-size="9px">COLOR LEGEND:</text>
    <rect x="120" y="902" width="12" height="12" fill="#FF00FF"/>
    <text x="138" y="912" fill="white" font-family="monospace" font-size="8px">Frame/Spine</text>
    <rect x="200" y="902" width="12" height="12" fill="#00CED1"/>
    <text x="218" y="912" fill="white" font-family="monospace" font-size="8px">Grid</text>
    <rect x="260" y="902" width="12" height="12" fill="#FF4444"/>
    <text x="278" y="912" fill="white" font-family="monospace" font-size="8px">Content</text>
    <rect x="340" y="902" width="12" height="12" fill="#FFD700"/>
    <text x="358" y="912" fill="white" font-family="monospace" font-size="8px">Proportions</text>
    <rect x="440" y="902" width="12" height="12" fill="#8844CC"/>
    <text x="458" y="912" fill="white" font-family="monospace" font-size="8px">Flow</text>
    
    <!-- Observations -->
    <text x="20" y="930" fill="#FFD700" font-family="monospace" font-size="9px">OBSERVATIONS:</text>
    <text x="20" y="945" fill="white" font-family="monospace" font-size="9px">Classic Swiss International Style | Asymmetric balance across spread | Typography as primary design element</text>
    <text x="20" y="958" fill="white" font-family="monospace" font-size="9px">Left-heavy composition balanced by right-page distribution | Fragmented text creates texture and rhythm</text>
    <text x="20" y="971" fill="white" font-family="monospace" font-size="9px">Minimal color palette | Grid as invisible structure | Page numbers as navigation anchors</text>
    <text x="20" y="984" fill="white" font-family="monospace" font-size="9px">Likely from 1960s design magazine or typography specimen | "merz 60" suggests Merz magazine connection</text>
  </g>

</svg>