<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1200 900" 
     role="img" aria-label="Grid analysis: Philosophical Essay Layout">

  <!-- LAYER 1: Page Frame & Margins -->
  <g id="layer-page" data-layer="page">
    <!-- Page boundary -->
    <rect x="0" y="0" width="1200" height="720" 
          fill="none" stroke="#FF00FF" stroke-width="2" stroke-dasharray="5,5"/>
    <!-- Page label -->
    <text x="600" y="15" text-anchor="middle" fill="#FF00FF" 
          font-family="monospace" font-size="11px" font-weight="bold">PAGE FRAME: 1200 × 720px</text>
    <!-- Margins -->
    <rect x="40" y="40" width="1120" height="640" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="45" y="30" fill="#8B0000" font-family="monospace" font-size="9px">MARGINS: 40px all sides</text>
  </g>

  <!-- LAYER 2: Grid System -->
  <g id="layer-grid" data-layer="grid">
    <!-- Vertical divisions -->
    <!-- Left zone boundary (40%) -->
    <line x1="480" y1="40" x2="480" y2="680" stroke="#00CED1" stroke-width="1.5"/>
    <text x="485" y="55" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">LEFT ZONE: 40%</text>
    <text x="485" y="67" fill="#00CED1" font-family="monospace" font-size="8px">440px width</text>
    
    <!-- Right zone subdivisions -->
    <line x1="600" y1="40" x2="600" y2="680" stroke="#00CED1" stroke-width="1"/>
    <line x1="780" y1="40" x2="780" y2="680" stroke="#00CED1" stroke-width="1"/>
    <line x1="960" y1="40" x2="960" y2="680" stroke="#00CED1" stroke-width="1"/>
    
    <!-- Right zone labels -->
    <text x="540" y="55" fill="#00CED1" font-family="monospace" font-size="9px">R1: 10%</text>
    <text x="690" y="55" fill="#00CED1" font-family="monospace" font-size="9px">R2: 15%</text>
    <text x="870" y="55" fill="#00CED1" font-family="monospace" font-size="9px">R3: 15%</text>
    <text x="1050" y="55" fill="#00CED1" font-family="monospace" font-size="9px">R4: 20%</text>
    
    <!-- Horizontal zones -->
    <line x1="40" y1="160" x2="1160" y2="160" stroke="#00CED1" stroke-width="1"/>
    <line x1="40" y1="320" x2="1160" y2="320" stroke="#00CED1" stroke-width="1"/>
    <line x1="40" y1="520" x2="1160" y2="520" stroke="#00CED1" stroke-width="1"/>
    
    <!-- Zone labels on right -->
    <text x="1170" y="100" fill="#00CED1" font-family="monospace" font-size="9px">HDR</text>
    <text x="1170" y="240" fill="#00CED1" font-family="monospace" font-size="9px">MAIN</text>
    <text x="1170" y="420" fill="#00CED1" font-family="monospace" font-size="9px">MID</text>
    <text x="1170" y="600" fill="#00CED1" font-family="monospace" font-size="9px">BTM</text>
  </g>

  <!-- LAYER 3: Content Blocks -->
  <g id="layer-content" data-layer="content">
    <!-- Large circular arch (left dominant element) -->
    <circle cx="260" cy="400" r="180" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="85" y="390" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">ARCH IMAGE</text>
    <text x="85" y="402" fill="#FF4444" font-family="monospace" font-size="7px">360×360px</text>
    <text x="85" y="414" fill="#FF4444" font-family="monospace" font-size="7px">30% of page</text>
    
    <!-- Header text blocks -->
    <rect x="80" y="80" width="150" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="85" y="75" fill="#FF4444" font-family="monospace" font-size="7px">La presencia ausente</text>
    
    <rect x="400" y="80" width="160" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="405" y="75" fill="#FF4444" font-family="monospace" font-size="7px">The absent presence</text>
    
    <!-- Central display typography -->
    <rect x="720" y="250" width="200" height="60" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="725" y="245" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">SENCIA</text>
    <text x="725" y="257" fill="#FF4444" font-family="monospace" font-size="7px">200×60px display</text>
    
    <!-- Large title block -->
    <rect x="720" y="380" width="280" height="120" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="725" y="375" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">EL DÍA QUE EL HOMBRE</text>
    <text x="725" y="387" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">CREÓ A DIOS</text>
    <text x="725" y="399" fill="#FF4444" font-family="monospace" font-size="7px">280×120px</text>
    
    <!-- Repetitive text blocks (right side) -->
    <rect x="520" y="180" width="180" height="15" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="520" y="200" width="180" height="15" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="520" y="220" width="180" height="15" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="520" y="240" width="180" height="15" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="520" y="260" width="180" height="15" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="525" y="175" fill="#FF4444" font-family="monospace" font-size="7px">Repetitive text pattern</text>
    
    <!-- Filosófico with year -->
    <rect x="620" y="580" width="120" height="40" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="625" y="575" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">FILOSÓFICO</text>
    <text x="625" y="587" fill="#FF4444" font-family="monospace" font-size="7px">120×40px</text>
    
    <!-- Year display -->
    <rect x="920" y="580" width="80" height="60" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="925" y="575" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">20-18</text>
    <text x="925" y="587" fill="#FF4444" font-family="monospace" font-size="7px">80×60px</text>
    
    <!-- Small architectural images -->
    <rect x="840" y="480" width="60" height="80" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="845" y="475" fill="#FF4444" font-family="monospace" font-size="7px">Detail img</text>
    
    <!-- Bottom text blocks -->
    <rect x="60" y="580" width="200" height="40" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="60" y="625" width="200" height="40" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="65" y="575" fill="#FF4444" font-family="monospace" font-size="7px">Bottom text blocks</text>
  </g>

  <!-- LAYER 4: Proportional Analysis -->
  <g id="layer-proportions" data-layer="proportions">
    <!-- Golden ratio guides -->
    <line x1="444" y1="40" x2="444" y2="680" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="450" y="100" fill="#FFD700" font-family="monospace" font-size="8px">φ vertical: 37%</text>
    
    <line x1="40" y1="445" x2="1160" y2="445" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="50" y="440" fill="#FFD700" font-family="monospace" font-size="8px">φ horizontal: 61.8%</text>
    
    <!-- Arch positioning analysis -->
    <circle cx="260" cy="400" r="185" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="85" y="220" fill="#FFD700" font-family="monospace" font-size="8px">Arch center aligns</text>
    <text x="85" y="232" fill="#FFD700" font-family="monospace" font-size="8px">to golden section</text>
    
    <!-- Typography scale relationships -->
    <rect x="715" y="245" width="210" height="270" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="720" y="530" fill="#FFD700" font-family="monospace" font-size="8px">Main type area</text>
    <text x="720" y="542" fill="#FFD700" font-family="monospace" font-size="8px">17.5% × 37.5%</text>
  </g>

  <!-- LAYER 5: Flow & Hierarchy -->
  <g id="layer-flow" data-layer="flow">
    <!-- Entry points -->
    <circle cx="165" cy="90" r="8" fill="#8844CC" opacity="0.7"/>
    <text x="150" y="110" fill="#8844CC" font-family="monospace" font-size="8px">1. Entry</text>
    
    <!-- Visual flow arrows -->
    <path d="M165,98 Q300,200 720,260" fill="none" stroke="#8844CC" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M820,310 Q850,350 720,390" fill="none" stroke="#8844CC" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M800,500 Q750,550 680,590" fill="none" stroke="#8844CC" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Hierarchy numbers -->
    <circle cx="260" cy="400" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="255" y="405" fill="white" font-family="monospace" font-size="9px" font-weight="bold">1</text>
    
    <circle cx="820" cy="280" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="815" y="285" fill="white" font-family="monospace" font-size="9px" font-weight="bold">2</text>
    
    <circle cx="820" cy="440" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="815" y="445" fill="white" font-family="monospace" font-size="9px" font-weight="bold">3</text>
    
    <!-- Arrow marker definition -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
              refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8844CC"/>
      </marker>
    </defs>
  </g>

  <!-- LAYER 6: Info Panel -->
  <g id="layer-info" data-layer="info">
    <!-- Dark background panel -->
    <rect x="0" y="720" width="1200" height="180" fill="#1a1a1a"/>
    
    <!-- Title -->
    <text x="20" y="745" fill="white" font-family="monospace" font-size="14px" font-weight="bold">GRID ANALYSIS — PHILOSOPHICAL ESSAY LAYOUT</text>
    
    <!-- Row 1: Dimensions and ratios -->
    <text x="20" y="765" fill="#FFD700" font-family="monospace" font-size="10px">DIMENSIONS:</text>
    <text x="120" y="765" fill="white" font-family="monospace" font-size="10px">Page: 1200×720px | Aspect: 1.67:1 | φ proximity: 97% match</text>
    
    <!-- Row 2: Grid structure -->
    <text x="20" y="780" fill="#00CED1" font-family="monospace" font-size="10px">GRID:</text>
    <text x="120" y="780" fill="white" font-family="monospace" font-size="10px">Asymmetric zones — Left: 40% (arch dominant) | Right: 60% (4-column text system)</text>
    
    <!-- Row 3: Typography -->
    <text x="20" y="795" fill="#FF4444" font-family="monospace" font-size="10px">TYPOGRAPHY:</text>
    <text x="120" y="795" fill="white" font-family="monospace" font-size="10px">Scale range: 1:8 ratio | Display: 48px+ | Body: 6px | Dramatic contrast</text>
    
    <!-- Row 4: Proportions -->
    <text x="20" y="810" fill="#FFD700" font-family="monospace" font-size="10px">PROPORTIONS:</text>
    <text x="120" y="810" fill="white" font-family="monospace" font-size="10px">Arch: 30% page area | Main text zone: 17.5%×37.5% | Golden ratio positioning</text>
    
    <!-- Color legend -->
    <text x="20" y="830" fill="white" font-family="monospace" font-size="9px">COLOR LEGEND:</text>
    <rect x="120" y="822" width="12" height="12" fill="#FF00FF"/>
    <text x="138" y="832" fill="white" font-family="monospace" font-size="8px">Frame</text>
    <rect x="180" y="822" width="12" height="12" fill="#00CED1"/>
    <text x="198" y="832" fill="white" font-family="monospace" font-size="8px">Grid</text>
    <rect x="240" y="822" width="12" height="12" fill="#FF4444"/>
    <text x="258" y="832" fill="white" font-family="monospace" font-size="8px">Content</text>
    <rect x="320" y="822" width="12" height="12" fill="#FFD700"/>
    <text x="338" y="832" fill="white" font-family="monospace" font-size="8px">Proportions</text>
    <rect x="420" y="822" width="12" height="12" fill="#8844CC"/>
    <text x="438" y="832" fill="white" font-family="monospace" font-size="8px">Flow</text>
    
    <!-- Observations -->
    <text x="20" y="850" fill="#FFD700" font-family="monospace" font-size="9px">OBSERVATIONS:</text>
    <text x="20" y="865" fill="white" font-family="monospace" font-size="9px">Dramatic contrast composition — massive circular arch vs. fragmented text system</text>
    <text x="20" y="878" fill="white" font-family="monospace" font-size="9px">Black background creates infinite depth | Bilingual content | Philosophical theme integration</text>
    <text x="20" y="891" fill="white" font-family="monospace" font-size="9px">Typography as architecture — text blocks mirror architectural fragments</text>
  </g>

</svg>