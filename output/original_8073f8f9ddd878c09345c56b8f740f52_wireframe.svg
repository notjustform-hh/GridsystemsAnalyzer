<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1400 1000" 
     role="img" aria-label="Grid analysis: NewWork Magazine Credits Page">

  <!-- LAYER 1: Page Frame & Margins -->
  <g id="layer-page" data-layer="page">
    <rect x="0" y="0" width="1400" height="1000" 
          fill="none" stroke="#FF00FF" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="700" y="15" text-anchor="middle" fill="#FF00FF" 
          font-family="monospace" font-size="12px" font-weight="bold">NEWWORK MAGAZINE CREDITS PAGE: 1400 × 1000px (Single Page)</text>
    
    <!-- Page boundaries -->
    <rect x="50" y="50" width="1300" height="900" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="55" y="45" fill="#FF00FF" font-family="monospace" font-size="10px">CONTENT AREA</text>
    
    <!-- Working margins -->
    <rect x="100" y="100" width="1200" height="800" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="105" y="95" fill="#8B0000" font-family="monospace" font-size="9px">WORKING MARGINS: 50px</text>
  </g>

  <!-- LAYER 2: Grid System -->
  <g id="layer-grid" data-layer="grid">
    <!-- Central content area -->
    <rect x="120" y="120" width="1160" height="760" fill="none" stroke="#00CED1" stroke-width="2"/>
    <text x="125" y="115" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">MAIN CONTENT GRID</text>
    
    <!-- Designer names area -->
    <rect x="450" y="150" width="500" height="400" fill="none" stroke="#00CED1" stroke-width="1.5"/>
    <text x="455" y="145" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">DESIGNER NAMES LIST</text>
    
    <!-- Left credits area -->
    <rect x="120" y="580" width="380" height="250" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="125" y="575" fill="#00CED1" font-family="monospace" font-size="8px">LEFT CREDITS BLOCK</text>
    
    <!-- Center credits area -->
    <rect x="520" y="580" width="360" height="250" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="525" y="575" fill="#00CED1" font-family="monospace" font-size="8px">CENTER CREDITS BLOCK</text>
    
    <!-- Right area -->
    <rect x="900" y="150" width="380" height="680" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="905" y="145" fill="#00CED1" font-family="monospace" font-size="8px">RIGHT SIDEBAR</text>
    
    <!-- Header area -->
    <rect x="120" y="120" width="1160" height="40" fill="none" stroke="#00CED1" stroke-width="0.5"/>
    <text x="125" y="110" fill="#00CED1" font-family="monospace" font-size="8px">HEADER ZONE</text>
  </g>

  <!-- LAYER 3: Content Blocks -->
  <g id="layer-content" data-layer="content">
    <!-- Header elements -->
    <rect x="120" y="120" width="200" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="125" y="115" fill="#FF4444" font-family="monospace" font-size="7px">NEWWORK MAGAZINE</text>
    
    <rect x="400" y="120" width="60" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="405" y="115" fill="#FF4444" font-family="monospace" font-size="7px">ISSUE</text>
    
    <rect x="1200" y="120" width="80" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1205" y="115" fill="#FF4444" font-family="monospace" font-size="7px">PAGE 5</text>
    
    <!-- Main designer names -->
    <rect x="470" y="170" width="200" height="25" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="475" y="165" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">Rudolf Hostettler</text>
    
    <rect x="470" y="205" width="180" height="25" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="475" y="200" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">Jost Hochuli</text>
    
    <rect x="470" y="240" width="250" height="25" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="475" y="235" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">TGG Hafen Senn Stiéger</text>
    
    <rect x="470" y="275" width="160" height="25" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="475" y="270" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">Gaston Isoz</text>
    
    <rect x="470" y="310" width="200" height="25" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="475" y="305" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">Jürgen Bergbauer</text>
    
    <rect x="470" y="345" width="160" height="25" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="475" y="340" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">Taka Mayumi</text>
    
    <rect x="470" y="380" width="180" height="25" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="475" y="375" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">Lillian Bassman</text>
    
    <!-- Large "NEWWORK MAGAZINE" -->
    <rect x="920" y="300" width="320" height="150" fill="none" stroke="#FF4444" stroke-width="3"/>
    <text x="925" y="295" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">LARGE "NEWWORK MAGAZINE"</text>
    
    <!-- Left credits -->
    <rect x="140" y="600" width="340" height="200" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="145" y="595" fill="#FF4444" font-family="monospace" font-size="8px">LEFT CREDITS TEXT</text>
    
    <!-- Center credits -->
    <rect x="540" y="600" width="320" height="200" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="545" y="595" fill="#FF4444" font-family="monospace" font-size="8px">CENTER CREDITS TEXT</text>
    
    <!-- Right sidebar elements -->
    <rect x="1150" y="500" width="120" height="80" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1155" y="495" fill="#FF4444" font-family="monospace" font-size="7px">SIDEBAR INFO</text>
    
    <rect x="1150" y="600" width="120" height="100" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1155" y="595" fill="#FF4444" font-family="monospace" font-size="7px">CONTACT INFO</text>
    
    <rect x="1150" y="720" width="120" height="60" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1155" y="715" fill="#FF4444" font-family="monospace" font-size="7px">ISSUE NUMBER</text>
  </g>

  <!-- LAYER 4: Proportional Analysis -->
  <g id="layer-proportions" data-layer="proportions">
    <!-- Golden ratio divisions -->
    <line x1="566" y1="100" x2="566" y2="900" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="571" y="120" fill="#FFD700" font-family="monospace" font-size="8px">φ Division: 40.5%</text>
    
    <line x1="866" y1="100" x2="866" y2="900" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="871" y="120" fill="#FFD700" font-family="monospace" font-size="8px">φ Division: 61.9%</text>
    
    <!-- Designer names proportional analysis -->
    <rect x="470" y="170" width="460" height="235" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="475" y="415" fill="#FFD700" font-family="monospace" font-size="8px">Names area: 32.9% × 23.5%</text>
    
    <!-- Central proportional marker -->
    <circle cx="700" cy="500" r="8" fill="#FFD700" opacity="0.7"/>
    <text x="710" y="505" fill="#FFD700" font-family="monospace" font-size="8px">Center</text>
  </g>

  <!-- LAYER 5: Flow & Hierarchy -->
  <g id="layer-flow" data-layer="flow">
    <!-- Primary reading flow -->
    <circle cx="570" cy="280" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="565" y="285" fill="white" font-family="monospace" font-size="9px" font-weight="bold">1</text>
    
    <circle cx="1080" cy="375" r="10" fill="#8844CC" opacity="0.7"/>
    <text x="1077" y="380" fill="white" font-family="monospace" font-size="8px" font-weight="bold">2</text>
    
    <circle cx="310" cy="700" r="10" fill="#8844CC" opacity="0.6"/>
    <text x="307" y="705" fill="white" font-family="monospace" font-size="8px" font-weight="bold">3</text>
    
    <circle cx="700" cy="700" r="8" fill="#8844CC" opacity="0.6"/>
    <text x="697" y="705" fill="white" font-family="monospace" font-size="7px" font-weight="bold">4</text>
    
    <!-- Flow arrows -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
              refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8844CC"/>
      </marker>
    </defs>
    
    <path d="M 582 280 Q 800 320 1068 375" fill="none" stroke="#8844CC" 
          stroke-width="2" marker-end="url(#arrowhead)" opacity="0.7"/>
    <path d="M 570 292 Q 450 500 322 700" fill="none" stroke="#8844CC" 
          stroke-width="1.5" marker-end="url(#arrowhead)" opacity="0.6"/>
  </g>

  <!-- LAYER 6: Info Panel -->
  <g id="layer-info" data-layer="info">
    <rect x="0" y="1000" width="1400" height="200" fill="#1a1a1a"/>
    
    <text x="20" y="1025" fill="white" font-family="monospace" font-size="14px" font-weight="bold">GRID ANALYSIS — NEWWORK MAGAZINE CREDITS PAGE</text>
    
    <text x="20" y="1045" fill="#FFD700" font-family="monospace" font-size="10px">FORMAT:</text>
    <text x="120" y="1045" fill="white" font-family="monospace" font-size="10px">1400×1000px single page | Credits/masthead page | Magazine format</text>
    
    <text x="20" y="1060" fill="#00CED1" font-family="monospace" font-size="10px">LAYOUT:</text>
    <text x="120" y="1060" fill="white" font-family="monospace" font-size="10px">Central designer names list | Left-center credits blocks | Right brand emphasis</text>
    
    <text x="20" y="1075" fill="#FF4444" font-family="monospace" font-size="10px">TYPE:</text>
    <text x="120" y="1075" fill="white" font-family="monospace" font-size="10px">Hierarchical designer names | Large "NEWWORK MAGAZINE" branding | Credits text</text>
    
    <text x="20" y="1090" fill="#8844CC" font-family="monospace" font-size="10px">HIERARCHY:</text>
    <text x="120" y="1090" fill="white" font-family="monospace" font-size="10px">1. Designer names | 2. Magazine branding | 3. Credits blocks | 4. Contact info</text>
    
    <text x="20" y="1130" fill="#FFD700" font-family="monospace" font-size="9px">OBSERVATIONS:</text>
    <text x="20" y="1145" fill="white" font-family="monospace" font-size="9px">Systematic credits organization | Swiss typography influence | Professional magazine format</text>
    <text x="20" y="1158" fill="white" font-family="monospace" font-size="9px">Designer names as primary content | Clean hierarchical information architecture</text>
    <text x="20" y="1171" fill="white" font-family="monospace" font-size="9px">Balanced asymmetric layout | Brand emphasis through typography scale</text>
  </g>

</svg>