<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1200 1600" 
     role="img" aria-label="Grid analysis: Control Synx Magazine Cover - Textured Typography">

  <!-- LAYER 1: Page Frame & Margins -->
  <g id="layer-page" data-layer="page">
    <rect x="0" y="0" width="1200" height="1600" 
          fill="none" stroke="#FF00FF" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="600" y="15" text-anchor="middle" fill="#FF00FF" 
          font-family="monospace" font-size="12px" font-weight="bold">CONTROL SYNX MAGAZINE COVER: 1200 × 1600px (Portrait Format)</text>
    
    <!-- Page boundaries -->
    <rect x="40" y="40" width="1120" height="1520" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="45" y="35" fill="#FF00FF" font-family="monospace" font-size="10px">COVER AREA</text>
    
    <!-- Working margins -->
    <rect x="80" y="80" width="1040" height="1440" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="85" y="75" fill="#8B0000" font-family="monospace" font-size="9px">WORKING MARGINS: 40px</text>
  </g>

  <!-- LAYER 2: Grid System -->
  <g id="layer-grid" data-layer="grid">
    <!-- Main typography zone -->
    <rect x="100" y="400" width="1000" height="800" fill="none" stroke="#00CED1" stroke-width="2"/>
    <text x="105" y="395" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">MAIN TYPOGRAPHY AREA</text>
    
    <!-- Header zone -->
    <rect x="100" y="100" width="1000" height="120" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="105" y="95" fill="#00CED1" font-family="monospace" font-size="8px">HEADER ZONE</text>
    
    <!-- Footer zone -->
    <rect x="100" y="1300" width="1000" height="120" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="105" y="1295" fill="#00CED1" font-family="monospace" font-size="8px">FOOTER ZONE</text>
    
    <!-- Typography positioning guides -->
    <line x1="150" y1="400" x2="150" y2="1200" stroke="#00CED1" stroke-width="0.5"/>
    <text x="155" y="420" fill="#00CED1" font-family="monospace" font-size="7px" transform="rotate(90 155 420)">LEFT EDGE</text>
    
    <line x1="1050" y1="400" x2="1050" y2="1200" stroke="#00CED1" stroke-width="0.5"/>
    <text x="1055" y="420" fill="#00CED1" font-family="monospace" font-size="7px" transform="rotate(90 1055 420)">RIGHT EDGE</text>
    
    <!-- Central axis -->
    <line x1="600" y1="100" x2="600" y2="1500" stroke="#00CED1" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="605" y="120" fill="#00CED1" font-family="monospace" font-size="8px">CENTER AXIS</text>
  </g>

  <!-- LAYER 3: Content Blocks -->
  <g id="layer-content" data-layer="content">
    <!-- Header elements -->
    <rect x="900" y="120" width="180" height="30" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="905" y="115" fill="#FF4444" font-family="monospace" font-size="7px">SPECIMEN FOR ART</text>
    
    <rect x="900" y="160" width="150" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="905" y="155" fill="#FF4444" font-family="monospace" font-size="7px">LET HELVETICA INSTRUCT</text>
    
    <!-- Large textured "CO" -->
    <rect x="160" y="450" width="280" height="320" fill="none" stroke="#FF4444" stroke-width="4"/>
    <text x="165" y="445" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">LARGE "CO" TEXTURED</text>
    
    <!-- Large textured "N" -->
    <rect x="480" y="450" width="200" height="320" fill="none" stroke="#FF4444" stroke-width="4"/>
    <text x="485" y="445" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">LARGE "N" TEXTURED</text>
    
    <!-- "TROL" continuation -->
    <rect x="720" y="450" width="280" height="200" fill="none" stroke="#FF4444" stroke-width="3"/>
    <text x="725" y="445" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">"TROL" OVERLAY</text>
    
    <!-- Large "SY" -->
    <rect x="160" y="800" width="240" height="280" fill="none" stroke="#FF4444" stroke-width="4"/>
    <text x="165" y="795" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">LARGE "SY" TEXTURED</text>
    
    <!-- Large "N" bottom -->
    <rect x="440" y="800" width="200" height="280" fill="none" stroke="#FF4444" stroke-width="4"/>
    <text x="445" y="795" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">LARGE "N" BOTTOM</text>
    
    <!-- "X" final letter -->
    <rect x="680" y="800" width="200" height="280" fill="none" stroke="#FF4444" stroke-width="4"/>
    <text x="685" y="795" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">LARGE "X" FINAL</text>
    
    <!-- "R" overlay -->
    <rect x="900" y="800" width="160" height="280" fill="none" stroke="#FF4444" stroke-width="3"/>
    <text x="905" y="795" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">"R" OVERLAY</text>
    
    <!-- Footer elements -->
    <rect x="120" y="1440" width="60" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="125" y="1435" fill="#FF4444" font-family="monospace" font-size="7px">#CONTROL</text>
    
    <rect x="900" y="1440" width="80" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="905" y="1435" fill="#FF4444" font-family="monospace" font-size="7px">03.2023</text>
    
    <rect x="1020" y="1440" width="80" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1025" y="1435" fill="#FF4444" font-family="monospace" font-size="7px">05.20.2027</text>
  </g>

  <!-- LAYER 4: Proportional Analysis -->
  <g id="layer-proportions" data-layer="proportions">
    <!-- Golden ratio divisions -->
    <line x1="461" y1="80" x2="461" y2="1520" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="466" y="100" fill="#FFD700" font-family="monospace" font-size="8px">φ Division: 38.4%</text>
    
    <line x1="739" y1="80" x2="739" y2="1520" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="744" y="100" fill="#FFD700" font-family="monospace" font-size="8px">φ Division: 61.6%</text>
    
    <!-- Typography zone proportional analysis -->
    <rect x="160" y="450" width="840" height="630" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="165" y="1090" fill="#FFD700" font-family="monospace" font-size="8px">Typography: 70% × 39%</text>
    
    <!-- Textured area analysis -->
    <rect x="160" y="450" width="520" height="320" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="165" y="780" fill="#FFD700" font-family="monospace" font-size="8px">Top text: 43% × 20%</text>
    
    <!-- Central proportional marker -->
    <circle cx="600" cy="800" r="8" fill="#FFD700" opacity="0.7"/>
    <text x="610" y="805" fill="#FFD700" font-family="monospace" font-size="8px">Center</text>
  </g>

  <!-- LAYER 5: Flow & Hierarchy -->
  <g id="layer-flow" data-layer="flow">
    <!-- Typography reading flow -->
    <circle cx="300" cy="600" r="14" fill="#8844CC" opacity="0.8"/>
    <text x="294" y="606" fill="white" font-family="monospace" font-size="10px" font-weight="bold">1</text>
    
    <circle cx="580" cy="600" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="575" y="605" fill="white" font-family="monospace" font-size="9px" font-weight="bold">2</text>
    
    <circle cx="810" cy="550" r="10" fill="#8844CC" opacity="0.7"/>
    <text x="807" y="555" fill="white" font-family="monospace" font-size="8px" font-weight="bold">3</text>
    
    <circle cx="300" cy="940" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="295" y="945" fill="white" font-family="monospace" font-size="9px" font-weight="bold">4</text>
    
    <circle cx="540" cy="940" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="535" y="945" fill="white" font-family="monospace" font-size="9px" font-weight="bold">5</text>
    
    <circle cx="780" cy="940" r="10" fill="#8844CC" opacity="0.7"/>
    <text x="777" y="945" fill="white" font-family="monospace" font-size="8px" font-weight="bold">6</text>
    
    <!-- Flow arrows -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
              refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8844CC"/>
      </marker>
    </defs>
    
    <path d="M 314 600 Q 450 580 568 600" fill="none" stroke="#8844CC" 
          stroke-width="3" marker-end="url(#arrowhead)" opacity="0.8"/>
    <path d="M 580 612 Q 700 580 798 550" fill="none" stroke="#8844CC" 
          stroke-width="2" marker-end="url(#arrowhead)" opacity="0.7"/>
    <path d="M 300 614 Q 300 800 300 928" fill="none" stroke="#8844CC" 
          stroke-width="2" marker-end="url(#arrowhead)" opacity="0.7"/>
  </g>

  <!-- LAYER 6: Info Panel -->
  <g id="layer-info" data-layer="info">
    <rect x="0" y="1600" width="1200" height="200" fill="#1a1a1a"/>
    
    <text x="20" y="1625" fill="white" font-family="monospace" font-size="14px" font-weight="bold">GRID ANALYSIS — CONTROL SYNX MAGAZINE COVER</text>
    
    <text x="20" y="1645" fill="#FFD700" font-family="monospace" font-size="10px">FORMAT:</text>
    <text x="120" y="1645" fill="white" font-family="monospace" font-size="10px">1200×1600px portrait cover | Magazine format | Textured typography design</text>
    
    <text x="20" y="1660" fill="#00CED1" font-family="monospace" font-size="10px">LAYOUT:</text>
    <text x="120" y="1660" fill="white" font-family="monospace" font-size="10px">Central typography dominance | Layered textured letterforms | Dark background with white type</text>
    
    <text x="20" y="1675" fill="#FF4444" font-family="monospace" font-size="10px">TYPE:</text>
    <text x="120" y="1675" fill="white" font-family="monospace" font-size="10px">Large "CONTROL SYNX" with texture overlay | Header text | Footer information</text>
    
    <text x="20" y="1690" fill="#8844CC" font-family="monospace" font-size="10px">HIERARCHY:</text>
    <text x="120" y="1690" fill="white" font-family="monospace" font-size="10px">1. "CO" letters | 2. "N" | 3. "TROL" | 4. "SY" | 5. "N" | 6. "X" + "R"</text>
    
    <text x="20" y="1730" fill="#FFD700" font-family="monospace" font-size="9px">OBSERVATIONS:</text>
    <text x="20" y="1745" fill="white" font-family="monospace" font-size="9px">Experimental typography with texture effects | Magazine cover with artistic approach</text>
    <text x="20" y="1758" fill="white" font-family="monospace" font-size="9px">Layered letterforms create depth | Dark aesthetic with white textured typography</text>
    <text x="20" y="1771" fill="white" font-family="monospace" font-size="9px">Contemporary magazine design | Typography as primary visual element</text>
  </g>

</svg>