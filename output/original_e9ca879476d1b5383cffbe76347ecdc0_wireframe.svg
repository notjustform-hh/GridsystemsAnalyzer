<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1800 1200" 
     role="img" aria-label="Grid analysis: Typography Specimen - Axis &amp; FP Clifford Double-Page Spread">

  <!-- LAYER 1: Page Frame & Margins -->
  <g id="layer-page" data-layer="page">
    <rect x="0" y="0" width="1800" height="1200" 
          fill="none" stroke="#FF00FF" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="900" y="15" text-anchor="middle" fill="#FF00FF" 
          font-family="monospace" font-size="12px" font-weight="bold">TYPOGRAPHY SPECIMEN SPREAD: 1800 × 1200px (Font Comparison)</text>
    
    <!-- Page boundaries -->
    <rect x="60" y="60" width="810" height="1080" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="65" y="55" fill="#FF00FF" font-family="monospace" font-size="10px">LEFT PAGE - AXIS</text>
    
    <rect x="930" y="60" width="810" height="1080" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="1335" y="55" fill="#FF00FF" font-family="monospace" font-size="10px">RIGHT PAGE - FP CLIFFORD</text>
    
    <!-- Central spine/gutter -->
    <rect x="870" y="0" width="60" height="1200" fill="none" stroke="#FF00FF" stroke-width="2"/>
    <text x="890" y="30" fill="#FF00FF" font-family="monospace" font-size="8px" transform="rotate(90 890 30)">SPINE</text>
    
    <!-- Working margins -->
    <rect x="90" y="90" width="750" height="1020" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="960" y="90" width="750" height="1020" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- LAYER 2: Grid System -->
  <g id="layer-grid" data-layer="grid">
    <!-- LEFT PAGE: Axis font structure -->
    <rect x="110" y="120" width="320" height="360" fill="none" stroke="#00CED1" stroke-width="2"/>
    <text x="115" y="115" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">AXIS SPECIMEN AREA</text>
    
    <rect x="470" y="120" width="340" height="160" fill="none" stroke="#00CED1" stroke-width="1.5"/>
    <text x="475" y="115" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">AXIS CHARACTER SET</text>
    
    <rect x="470" y="300" width="340" height="480" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="475" y="295" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">AXIS SAMPLE TEXT</text>
    
    <!-- LEFT PAGE text area -->
    <rect x="110" y="540" width="700" height="480" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="115" y="535" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">AXIS BODY TEXT AREA</text>
    
    <!-- Header areas -->
    <line x1="90" y1="120" x2="840" y2="120" stroke="#00CED1" stroke-width="0.5"/>
    <text x="95" y="110" fill="#00CED1" font-family="monospace" font-size="8px">HEADER LINE</text>
    
    <!-- RIGHT PAGE: FP Clifford structure -->
    <rect x="980" y="120" width="320" height="360" fill="none" stroke="#00CED1" stroke-width="2"/>
    <text x="985" y="115" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">CLIFFORD SPECIMEN</text>
    
    <rect x="1340" y="120" width="340" height="160" fill="none" stroke="#00CED1" stroke-width="1.5"/>
    <text x="1345" y="115" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">CLIFFORD CHARACTER SET</text>
    
    <rect x="1340" y="300" width="340" height="480" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="1345" y="295" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">CLIFFORD SAMPLE TEXT</text>
    
    <!-- RIGHT PAGE text area -->
    <rect x="980" y="540" width="700" height="480" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="985" y="535" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">CLIFFORD BODY TEXT</text>
  </g>

  <!-- LAYER 3: Content Blocks -->
  <g id="layer-content" data-layer="content">
    <!-- LEFT PAGE: Axis content -->
    <!-- Headers -->
    <rect x="90" y="90" width="120" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="95" y="85" fill="#FF4444" font-family="monospace" font-size="7px">SPECIMEN MAGAZINE</text>
    
    <rect x="280" y="90" width="60" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="285" y="85" fill="#FF4444" font-family="monospace" font-size="7px">THREE</text>
    
    <rect x="430" y="90" width="120" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="435" y="85" fill="#FF4444" font-family="monospace" font-size="7px">AKIRA KOBAYASHI</text>
    
    <rect x="720" y="90" width="80" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="725" y="85" fill="#FF4444" font-family="monospace" font-size="7px">PAGE 70-71xx</text>
    
    <!-- Large specimen letters -->
    <rect x="130" y="150" width="280" height="300" fill="none" stroke="#FF4444" stroke-width="3"/>
    <text x="135" y="145" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">AXIS LARGE SPECIMEN</text>
    
    <!-- Character set display -->
    <rect x="490" y="140" width="300" height="40" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="495" y="135" fill="#FF4444" font-family="monospace" font-size="7px">AXIS ALPHABET CAPS</text>
    
    <rect x="490" y="190" width="300" height="30" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="495" y="185" fill="#FF4444" font-family="monospace" font-size="7px">AXIS NUMBERS</text>
    
    <rect x="490" y="230" width="300" height="40" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="495" y="225" fill="#FF4444" font-family="monospace" font-size="7px">AXIS LOWERCASE</text>
    
    <!-- Sample text area -->
    <rect x="490" y="320" width="300" height="140" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="495" y="315" fill="#FF4444" font-family="monospace" font-size="7px">AXIS SAMPLE TEXT</text>
    
    <!-- Body text columns -->
    <rect x="130" y="560" width="320" height="440" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="135" y="555" fill="#FF4444" font-family="monospace" font-size="7px">AXIS DESCRIPTION</text>
    
    <rect x="470" y="560" width="320" height="440" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="475" y="555" fill="#FF4444" font-family="monospace" font-size="7px">DESIGN PROCESS</text>
    
    <!-- RIGHT PAGE: FP Clifford content -->
    <!-- Headers -->
    <rect x="960" y="90" width="120" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="965" y="85" fill="#FF4444" font-family="monospace" font-size="7px">SPECIMEN MAGAZINE</text>
    
    <rect x="1150" y="90" width="60" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1155" y="85" fill="#FF4444" font-family="monospace" font-size="7px">THREE</text>
    
    <rect x="1300" y="90" width="120" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1305" y="85" fill="#FF4444" font-family="monospace" font-size="7px">AKIRA KOBAYASHI</text>
    
    <rect x="1590" y="90" width="80" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1595" y="85" fill="#FF4444" font-family="monospace" font-size="7px">PAGE 70-71xx</text>
    
    <!-- Central sample area -->
    <rect x="1000" y="150" width="280" height="300" fill="none" stroke="#FF4444" stroke-width="3"/>
    <text x="1005" y="145" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">CLIFFORD SPECIMEN</text>
    
    <!-- Character set display -->
    <rect x="1360" y="140" width="300" height="40" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="1365" y="135" fill="#FF4444" font-family="monospace" font-size="7px">CLIFFORD CAPS</text>
    
    <rect x="1360" y="190" width="300" height="30" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="1365" y="185" fill="#FF4444" font-family="monospace" font-size="7px">CLIFFORD NUMBERS</text>
    
    <rect x="1360" y="230" width="300" height="40" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="1365" y="225" fill="#FF4444" font-family="monospace" font-size="7px">CLIFFORD LOWERCASE</text>
    
    <!-- Sample text area -->
    <rect x="1360" y="320" width="300" height="140" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="1365" y="315" fill="#FF4444" font-family="monospace" font-size="7px">CLIFFORD SAMPLE</text>
    
    <!-- Body text columns -->
    <rect x="1000" y="560" width="320" height="440" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1005" y="555" fill="#FF4444" font-family="monospace" font-size="7px">CLIFFORD DESCRIPTION</text>
    
    <rect x="1340" y="560" width="320" height="440" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1345" y="555" fill="#FF4444" font-family="monospace" font-size="7px">TECHNICAL NOTES</text>
    
    <!-- Page numbers -->
    <rect x="110" y="1080" width="30" height="15" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="115" y="1075" fill="#FF4444" font-family="monospace" font-size="6px">LEFT</text>
    
    <rect x="1650" y="1080" width="30" height="15" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1655" y="1075" fill="#FF4444" font-family="monospace" font-size="6px">RIGHT</text>
  </g>

  <!-- LAYER 4: Proportional Analysis -->
  <g id="layer-proportions" data-layer="proportions">
    <!-- Golden ratio divisions -->
    <line x1="693" y1="90" x2="693" y2="1110" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="698" y="110" fill="#FFD700" font-family="monospace" font-size="8px">φ Left: 38.5%</text>
    
    <line x1="1107" y1="90" x2="1107" y2="1110" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="1112" y="110" fill="#FFD700" font-family="monospace" font-size="8px">φ Right: 61.5%</text>
    
    <!-- Typography specimen zones -->
    <rect x="130" y="150" width="280" height="300" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="135" y="460" fill="#FFD700" font-family="monospace" font-size="8px">Axis zone: 15.6% × 25%</text>
    
    <rect x="1000" y="150" width="280" height="300" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="1005" y="460" fill="#FFD700" font-family="monospace" font-size="8px">Clifford zone: 15.6% × 25%</text>
    
    <!-- Central proportional marker -->
    <circle cx="900" cy="600" r="8" fill="#FFD700" opacity="0.7"/>
    <text x="910" y="605" fill="#FFD700" font-family="monospace" font-size="8px">Center</text>
  </g>

  <!-- LAYER 5: Flow & Hierarchy -->
  <g id="layer-flow" data-layer="flow">
    <!-- Primary reading flow -->
    <circle cx="270" cy="300" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="265" y="305" fill="white" font-family="monospace" font-size="9px" font-weight="bold">1</text>
    
    <circle cx="640" cy="200" r="10" fill="#8844CC" opacity="0.7"/>
    <text x="637" y="205" fill="white" font-family="monospace" font-size="8px" font-weight="bold">2</text>
    
    <circle cx="1140" cy="300" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="1135" y="305" fill="white" font-family="monospace" font-size="9px" font-weight="bold">3</text>
    
    <circle cx="1510" cy="200" r="10" fill="#8844CC" opacity="0.7"/>
    <text x="1507" y="205" fill="white" font-family="monospace" font-size="8px" font-weight="bold">4</text>
    
    <circle cx="290" cy="780" r="8" fill="#8844CC" opacity="0.6"/>
    <text x="287" y="785" fill="white" font-family="monospace" font-size="7px" font-weight="bold">5</text>
    
    <!-- Flow arrows -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
              refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8844CC"/>
      </marker>
    </defs>
    
    <path d="M 282 300 Q 450 250 628 200" fill="none" stroke="#8844CC" 
          stroke-width="2" marker-end="url(#arrowhead)" opacity="0.7"/>
    <path d="M 950 300 Q 1100 250 1128 300" fill="none" stroke="#8844CC" 
          stroke-width="2" marker-end="url(#arrowhead)" opacity="0.7"/>
  </g>

  <!-- LAYER 6: Info Panel -->
  <g id="layer-info" data-layer="info">
    <rect x="0" y="1200" width="1800" height="200" fill="#1a1a1a"/>
    
    <text x="20" y="1225" fill="white" font-family="monospace" font-size="14px" font-weight="bold">GRID ANALYSIS — TYPOGRAPHY SPECIMEN: AXIS &amp; FP CLIFFORD COMPARISON</text>
    
    <text x="20" y="1245" fill="#FFD700" font-family="monospace" font-size="10px">FORMAT:</text>
    <text x="120" y="1245" fill="white" font-family="monospace" font-size="10px">1800×1200px double-page spread | Typography specimen magazine | Educational format</text>
    
    <text x="20" y="1260" fill="#00CED1" font-family="monospace" font-size="10px">LAYOUT:</text>
    <text x="120" y="1260" fill="white" font-family="monospace" font-size="10px">Mirror structure | Left: Axis font | Right: FP Clifford | Character sets + sample text + descriptions</text>
    
    <text x="20" y="1275" fill="#FF4444" font-family="monospace" font-size="10px">TYPE:</text>
    <text x="120" y="1275" fill="white" font-family="monospace" font-size="10px">Large specimen displays | Character set grids | Sample text blocks | Technical descriptions</text>
    
    <text x="20" y="1290" fill="#8844CC" font-family="monospace" font-size="10px">HIERARCHY:</text>
    <text x="120" y="1290" fill="white" font-family="monospace" font-size="10px">1. Specimen letters | 2. Character sets | 3. Mirror specimen | 4. Tech specs | 5. Body text</text>
    
    <text x="20" y="1330" fill="#FFD700" font-family="monospace" font-size="9px">OBSERVATIONS:</text>
    <text x="20" y="1345" fill="white" font-family="monospace" font-size="9px">Perfect mirrored comparison layout | Educational typography specimen format | Akira Kobayashi design</text>
    <text x="20" y="1358" fill="white" font-family="monospace" font-size="9px">Bilateral symmetry enables direct font comparison | Character sets demonstrate letterform details</text>
    <text x="20" y="1371" fill="white" font-family="monospace" font-size="9px">Professional specimen magazine | Technical analysis with visual comparison methodology</text>
  </g>

</svg>