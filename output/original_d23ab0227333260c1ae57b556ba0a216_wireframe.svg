<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1200 900" 
     role="img" aria-label="Grid analysis: Editorial Magazine Spread">

  <!-- LAYER 1: Page Frame & Margins -->
  <g id="layer-page" data-layer="page">
    <!-- Outer page boundary (magenta stroke) -->
    <rect x="20" y="20" width="560" height="760" fill="none" stroke="#FF00FF" stroke-width="2"/>
    <rect x="620" y="20" width="560" height="760" fill="none" stroke="#FF00FF" stroke-width="2"/>
    
    <!-- Page labels -->
    <text x="300" y="15" text-anchor="middle" fill="#FF00FF" font-family="monospace" font-size="12px" font-weight="bold">LEFT PAGE</text>
    <text x="900" y="15" text-anchor="middle" fill="#FF00FF" font-family="monospace" font-size="12px" font-weight="bold">RIGHT PAGE</text>
    
    <!-- Gutter center line -->
    <line x1="600" y1="20" x2="600" y2="780" stroke="#FF00FF" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="600" y="15" text-anchor="middle" fill="#FF00FF" font-family="monospace" font-size="10px">GUTTER</text>
    
    <!-- Inner margins (dark red, dashed) -->
    <rect x="40" y="40" width="520" height="720" fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="640" y="40" width="520" height="720" fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Margin measurements -->
    <text x="30" y="400" fill="#8B0000" font-family="monospace" font-size="8px" transform="rotate(-90, 30, 400)">MARGIN 20px</text>
    <text x="590" y="400" fill="#8B0000" font-family="monospace" font-size="8px" transform="rotate(-90, 590, 400)">MARGIN 20px</text>
  </g>

  <!-- LAYER 2: Grid System -->
  <g id="layer-grid" data-layer="grid">
    <!-- Left page vertical guidelines -->
    <line x1="120" y1="40" x2="120" y2="760" stroke="#00CED1" stroke-width="1"/>
    <line x1="200" y1="40" x2="200" y2="760" stroke="#00CED1" stroke-width="1"/>
    <line x1="320" y1="40" x2="320" y2="760" stroke="#00CED1" stroke-width="1"/>
    <line x1="450" y1="40" x2="450" y2="760" stroke="#00CED1" stroke-width="1"/>
    
    <!-- Right page vertical guidelines -->
    <line x1="750" y1="40" x2="750" y2="760" stroke="#00CED1" stroke-width="1"/>
    <line x1="900" y1="40" x2="900" y2="760" stroke="#00CED1" stroke-width="1"/>
    <line x1="1050" y1="40" x2="1050" y2="760" stroke="#00CED1" stroke-width="1"/>
    
    <!-- Column labels at top -->
    <text x="80" y="35" text-anchor="middle" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">COL 1</text>
    <text x="160" y="35" text-anchor="middle" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">COL 2</text>
    <text x="260" y="35" text-anchor="middle" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">COL 3</text>
    <text x="385" y="35" text-anchor="middle" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">COL 4</text>
    <text x="515" y="35" text-anchor="middle" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">COL 5</text>
    
    <text x="695" y="35" text-anchor="middle" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">R-COL 1</text>
    <text x="825" y="35" text-anchor="middle" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">R-COL 2</text>
    <text x="975" y="35" text-anchor="middle" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">R-COL 3</text>
    
    <!-- Horizontal zone division lines -->
    <line x1="40" y1="120" x2="560" y2="120" stroke="#00CED1" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="40" y1="250" x2="560" y2="250" stroke="#00CED1" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="40" y1="680" x2="560" y2="680" stroke="#00CED1" stroke-width="0.5" stroke-dasharray="2,2"/>
    
    <line x1="640" y1="200" x2="1160" y2="200" stroke="#00CED1" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="640" y1="550" x2="1160" y2="550" stroke="#00CED1" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="640" y1="680" x2="1160" y2="680" stroke="#00CED1" stroke-width="0.5" stroke-dasharray="2,2"/>
    
    <!-- Zone labels on right edge -->
    <text x="565" y="80" fill="#00CED1" font-family="monospace" font-size="8px" font-weight="bold">HDR</text>
    <text x="565" y="185" fill="#00CED1" font-family="monospace" font-size="8px" font-weight="bold">BOX</text>
    <text x="565" y="465" fill="#00CED1" font-family="monospace" font-size="8px" font-weight="bold">MAIN</text>
    <text x="565" y="730" fill="#00CED1" font-family="monospace" font-size="8px" font-weight="bold">FTR</text>
    
    <text x="1165" y="110" fill="#00CED1" font-family="monospace" font-size="8px" font-weight="bold">HDR</text>
    <text x="1165" y="375" fill="#00CED1" font-family="monospace" font-size="8px" font-weight="bold">TITLE</text>
    <text x="1165" y="615" fill="#00CED1" font-family="monospace" font-size="8px" font-weight="bold">SUB</text>
    <text x="1165" y="730" fill="#00CED1" font-family="monospace" font-size="8px" font-weight="bold">CRED</text>
    
    <!-- Column width annotations -->
    <text x="80" y="775" text-anchor="middle" fill="#00CED1" font-family="monospace" font-size="7px">80px (14%)</text>
    <text x="160" y="775" text-anchor="middle" fill="#00CED1" font-family="monospace" font-size="7px">80px (14%)</text>
    <text x="260" y="775" text-anchor="middle" fill="#00CED1" font-family="monospace" font-size="7px">120px (21%)</text>
    <text x="385" y="775" text-anchor="middle" fill="#00CED1" font-family="monospace" font-size="7px">130px (23%)</text>
    <text x="515" y="775" text-anchor="middle" fill="#00CED1" font-family="monospace" font-size="7px">110px (20%)</text>
  </g>

  <!-- LAYER 3: Content Blocks - OUTLINES ONLY -->
  <g id="layer-content" data-layer="content">
    <!-- Left page content outlines -->
    <!-- Header area -->
    <rect x="45" y="50" width="510" height="25" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="50" y="65" fill="#FF4444" font-family="monospace" font-size="8px">HEADER: SPECIMEN MAGAZINE - FORM - WALLPAPERLAB - NO</text>
    
    <!-- Limited Edition notice -->
    <rect x="45" y="85" width="100" height="30" fill="rgba(255,68,68,0.1)" stroke="#FF4444" stroke-width="1.5"/>
    <text x="50" y="100" fill="#FF4444" font-family="monospace" font-size="8px">Limited Edition</text>
    <text x="50" y="110" fill="#FF4444" font-family="monospace" font-size="8px">Anna Wlazgorki</text>
    
    <!-- Wallpaperlab box -->
    <rect x="220" y="130" width="140" height="110" fill="rgba(255,68,68,0.1)" stroke="#FF4444" stroke-width="2"/>
    <text x="225" y="145" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">wallpaperlab</text>
    <rect x="240" y="165" width="100" height="60" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="245" y="180" fill="#FF4444" font-family="monospace" font-size="7px">Interior content</text>
    <text x="245" y="190" fill="#FF4444" font-family="monospace" font-size="7px">with text blocks</text>
    
    <!-- Main text column (newspaper style) -->
    <rect x="45" y="260" width="200" height="410" fill="rgba(255,68,68,0.05)" stroke="#FF4444" stroke-width="2"/>
    <text x="50" y="275" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">MAIN TEXT BLOCK</text>
    <text x="50" y="285" fill="#FF4444" font-family="monospace" font-size="7px">Dense typography</text>
    <text x="50" y="295" fill="#FF4444" font-family="monospace" font-size="7px">200px × 410px</text>
    <text x="50" y="305" fill="#FF4444" font-family="monospace" font-size="7px">Newspaper style</text>
    
    <!-- Multiple text lines representation -->
    <line x1="55" y1="320" x2="235" y2="320" stroke="#FF4444" stroke-width="0.5"/>
    <line x1="55" y1="330" x2="230" y2="330" stroke="#FF4444" stroke-width="0.5"/>
    <line x1="55" y1="340" x2="240" y2="340" stroke="#FF4444" stroke-width="0.5"/>
    <line x1="55" y1="350" x2="225" y2="350" stroke="#FF4444" stroke-width="0.5"/>
    <line x1="55" y1="360" x2="235" y2="360" stroke="#FF4444" stroke-width="0.5"/>
    
    <!-- Business card element -->
    <rect x="45" y="690" width="85" height="55" fill="rgba(255,68,68,0.1)" stroke="#FF4444" stroke-width="1.5"/>
    <text x="50" y="705" fill="#FF4444" font-family="monospace" font-size="7px">Business card</text>
    <text x="50" y="715" fill="#FF4444" font-family="monospace" font-size="7px">85px × 55px</text>
    
    <!-- Right page content outlines -->
    <!-- Black background indicator -->
    <rect x="645" y="45" width="510" height="710" fill="rgba(0,0,0,0.8)" stroke="#FF4444" stroke-width="2"/>
    <text x="650" y="60" fill="#FFFFFF" font-family="monospace" font-size="8px">BLACK BACKGROUND (100%)</text>
    
    <!-- Large typography NUMBERS -->
    <rect x="700" y="180" width="400" height="180" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="705" y="195" fill="#FFFFFF" font-family="monospace" font-size="9px" font-weight="bold">NUMBERS</text>
    <text x="705" y="205" fill="#FFFFFF" font-family="monospace" font-size="7px">Large condensed serif</text>
    <text x="705" y="215" fill="#FFFFFF" font-family="monospace" font-size="7px">400px × 180px</text>
    
    <!-- Large typography RON KEYSON -->
    <rect x="700" y="380" width="400" height="160" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="705" y="395" fill="#FFFFFF" font-family="monospace" font-size="9px" font-weight="bold">RON KEYSON</text>
    <text x="705" y="405" fill="#FFFFFF" font-family="monospace" font-size="7px">Large condensed serif</text>
    <text x="705" y="415" fill="#FFFFFF" font-family="monospace" font-size="7px">400px × 160px</text>
    
    <!-- Credits area -->
    <rect x="700" y="690" width="240" height="50" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="705" y="705" fill="#FFFFFF" font-family="monospace" font-size="7px">CREDITS</text>
    <text x="705" y="715" fill="#FFFFFF" font-family="monospace" font-size="7px">About the author</text>
    <text x="705" y="725" fill="#FFFFFF" font-family="monospace" font-size="7px">240px × 50px</text>
  </g>

  <!-- LAYER 4: Proportional Analysis -->
  <g id="layer-proportions" data-layer="proportions">
    <!-- Golden ratio analysis -->
    <circle cx="300" cy="400" r="3" fill="#FFD700"/>
    <circle cx="900" cy="400" r="3" fill="#FFD700"/>
    
    <!-- Golden ratio guides -->
    <line x1="300" y1="40" x2="300" y2="760" stroke="#FFD700" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.6"/>
    <line x1="900" y1="40" x2="900" y2="760" stroke="#FFD700" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.6"/>
    
    <!-- Proportion annotations -->
    <text x="305" y="405" fill="#FFD700" font-family="monospace" font-size="7px">φ center</text>
    <text x="905" y="405" fill="#FFD700" font-family="monospace" font-size="7px">φ center</text>
    
    <!-- Spread ratio analysis -->
    <text x="600" y="795" text-anchor="middle" fill="#FFD700" font-family="monospace" font-size="8px">Spread ratio: 1.6:1 (≈ φ = 1.618)</text>
  </g>

  <!-- LAYER 5: Flow & Hierarchy -->
  <g id="layer-flow" data-layer="flow">
    <!-- Reading direction arrows -->
    <path d="M 60 100 L 200 140" stroke="#8844CC" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 220 180 L 140 280" stroke="#8844CC" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 600 300 L 720 220" stroke="#8844CC" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Arrow marker definition -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8844CC"/>
      </marker>
    </defs>
    
    <!-- Visual hierarchy numbering -->
    <circle cx="90" cy="95" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="90" y="99" text-anchor="middle" fill="white" font-family="monospace" font-size="10px" font-weight="bold">1</text>
    
    <circle cx="290" cy="185" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="290" y="189" text-anchor="middle" fill="white" font-family="monospace" font-size="10px" font-weight="bold">2</text>
    
    <circle cx="145" cy="320" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="145" y="324" text-anchor="middle" fill="white" font-family="monospace" font-size="10px" font-weight="bold">3</text>
    
    <circle cx="900" cy="280" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="900" y="284" text-anchor="middle" fill="white" font-family="monospace" font-size="10px" font-weight="bold">4</text>
    
    <!-- Entry point marker -->
    <rect x="35" y="45" width="15" height="15" fill="#8844CC" transform="rotate(45, 42.5, 52.5)"/>
    <text x="55" y="57" fill="#8844CC" font-family="monospace" font-size="7px">ENTRY</text>
  </g>

  <!-- LAYER 6: Info Panel -->
  <g id="layer-info" data-layer="info">
    <!-- Dark background panel -->
    <rect x="0" y="800" width="1200" height="100" fill="#1a1a1a"/>
    
    <!-- Title -->
    <text x="20" y="820" fill="white" font-family="monospace" font-size="12px" font-weight="bold">GRID ANALYSIS — EDITORIAL MAGAZINE SPREAD</text>
    
    <!-- Row 1: Dimensions and ratios -->
    <text x="20" y="840" fill="white" font-family="monospace" font-size="10px">
      SPREAD: 1200 × 760 px | PAGE RATIO: 1.36:1 | φ CHECK: 1.6:1 ≈ 1.618 ✓
    </text>
    
    <!-- Row 2: Column structure -->
    <text x="20" y="855" fill="white" font-family="monospace" font-size="10px">
      LEFT COLS: 5 (14% | 14% | 21% | 23% | 20%) GUTTER: 20px | RIGHT COLS: 3 (variable widths)
    </text>
    
    <!-- Row 3: Vertical zones -->
    <text x="20" y="870" fill="white" font-family="monospace" font-size="10px">
      ZONES: Header(80px) | Box(130px) | Main(420px) | Footer(80px) | Right: Title(340px) | Credits(60px)
    </text>
    
    <!-- Row 4: Golden ratio analysis -->
    <text x="20" y="885" fill="white" font-family="monospace" font-size="10px">
      φ ANALYSIS: Spread follows golden ratio 1.6:1 | Content centers at φ points (300px, 900px)
    </text>
    
    <!-- Color legend -->
    <rect x="750" y="815" width="12" height="12" fill="#FF00FF"/>
    <text x="770" y="825" fill="white" font-family="monospace" font-size="9px">Page Frame</text>
    
    <rect x="850" y="815" width="12" height="12" fill="#00CED1"/>
    <text x="870" y="825" fill="white" font-family="monospace" font-size="9px">Grid Lines</text>
    
    <rect x="950" y="815" width="12" height="12" fill="#FF4444"/>
    <text x="970" y="825" fill="white" font-family="monospace" font-size="9px">Content</text>
    
    <rect x="1050" y="815" width="12" height="12" fill="#FFD700"/>
    <text x="1070" y="825" fill="white" font-family="monospace" font-size="9px">Golden Ratio</text>
    
    <rect x="750" y="835" width="12" height="12" fill="#8B0000"/>
    <text x="770" y="845" fill="white" font-family="monospace" font-size="9px">Margins</text>
    
    <rect x="850" y="835" width="12" height="12" fill="#8844CC"/>
    <text x="870" y="845" fill="white" font-family="monospace" font-size="9px">Flow</text>
    
    <!-- Observations -->
    <text x="750" y="865" fill="white" font-family="monospace" font-size="9px" font-weight="bold">OBSERVATIONS:</text>
    <text x="750" y="878" fill="white" font-family="monospace" font-size="8px">Asymmetric compound grid with typography maximalism (left) vs. minimalism (right)</text>
    <text x="750" y="888" fill="white" font-family="monospace" font-size="8px">Strong contrast: dense text block vs. large display type on black</text>
    
    <!-- Proportional analysis -->
    <text x="20" y="895" fill="white" font-family="monospace" font-size="9px" font-weight="bold">PROPORTIONAL: Main text 35%×54% | Display type 67%×45% | Black bg 100%</text>
  </g>

</svg>