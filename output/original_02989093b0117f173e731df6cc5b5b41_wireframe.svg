<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1900 1300" 
     role="img" aria-label="Grid analysis: Magazine Editorial Spread with Artwork Showcase">

  <!-- LAYER 1: Page Frame & Margins -->
  <g id="layer-page" data-layer="page">
    <rect x="0" y="0" width="1900" height="1300" 
          fill="none" stroke="#FF00FF" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="950" y="15" text-anchor="middle" fill="#FF00FF" 
          font-family="monospace" font-size="12px" font-weight="bold">MAGAZINE EDITORIAL SPREAD: 1900 × 1300px (Artwork Showcase Format)</text>
    
    <!-- Page boundaries -->
    <rect x="40" y="40" width="890" height="1220" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="45" y="35" fill="#FF00FF" font-family="monospace" font-size="10px">LEFT PAGE</text>
    
    <rect x="970" y="40" width="890" height="1220" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="1415" y="35" fill="#FF00FF" font-family="monospace" font-size="10px">RIGHT PAGE</text>
    
    <!-- Central spine/gutter -->
    <rect x="930" y="0" width="40" height="1300" fill="none" stroke="#FF00FF" stroke-width="2"/>
    <text x="940" y="25" fill="#FF00FF" font-family="monospace" font-size="8px" transform="rotate(90 940 25)">SPINE</text>
    
    <!-- Working margins -->
    <rect x="60" y="60" width="850" height="1180" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="990" y="60" width="850" height="1180" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- LAYER 2: Grid System -->
  <g id="layer-grid" data-layer="grid">
    <!-- Header strip across both pages -->
    <rect x="80" y="80" width="1740" height="40" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="85" y="75" fill="#00CED1" font-family="monospace" font-size="8px">MAGAZINE HEADER STRIP</text>
    
    <!-- LEFT PAGE: Text columns -->
    <rect x="80" y="140" width="830" height="480" fill="none" stroke="#00CED1" stroke-width="1.5"/>
    <text x="85" y="135" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">LEFT TEXT AREA</text>
    
    <!-- Column dividers left page -->
    <line x1="310" y1="140" x2="310" y2="620" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="540" y1="140" x2="540" y2="620" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="770" y1="140" x2="770" y2="620" stroke="#00CED1" stroke-width="0.5"/>
    
    <!-- RIGHT PAGE: Text columns -->
    <rect x="990" y="140" width="830" height="480" fill="none" stroke="#00CED1" stroke-width="1.5"/>
    <text x="995" y="135" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">RIGHT TEXT AREA</text>
    
    <!-- Column dividers right page -->
    <line x1="1220" y1="140" x2="1220" y2="620" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="1450" y1="140" x2="1450" y2="620" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="1680" y1="140" x2="1680" y2="620" stroke="#00CED1" stroke-width="0.5"/>
    
    <!-- Central artwork gallery area -->
    <rect x="80" y="660" width="1740" height="420" fill="none" stroke="#00CED1" stroke-width="2"/>
    <text x="85" y="655" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">ARTWORK GALLERY SHOWCASE</text>
    
    <!-- Gallery subdivisions -->
    <line x1="390" y1="660" x2="390" y2="1080" stroke="#00CED1" stroke-width="1"/>
    <line x1="700" y1="660" x2="700" y2="1080" stroke="#00CED1" stroke-width="1"/>
    <line x1="1010" y1="660" x2="1010" y2="1080" stroke="#00CED1" stroke-width="1"/>
    <line x1="1320" y1="660" x2="1320" y2="1080" stroke="#00CED1" stroke-width="1"/>
    <line x1="1630" y1="660" x2="1630" y2="1080" stroke="#00CED1" stroke-width="1"/>
    
    <!-- Timeline/chart area -->
    <rect x="80" y="1120" width="1740" height="120" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="85" y="1115" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">TIMELINE CHART</text>
  </g>

  <!-- LAYER 3: Content Blocks -->
  <g id="layer-content" data-layer="content">
    <!-- Header elements -->
    <rect x="80" y="90" width="160" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="85" y="85" fill="#FF4444" font-family="monospace" font-size="7px">MAGAZINE MAGAZINE</text>
    
    <rect x="360" y="90" width="40" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="365" y="85" fill="#FF4444" font-family="monospace" font-size="7px">TWO</text>
    
    <rect x="990" y="90" width="160" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="995" y="85" fill="#FF4444" font-family="monospace" font-size="7px">MAGAZINE MAGAZINE</text>
    
    <rect x="1360" y="90" width="40" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1365" y="85" fill="#FF4444" font-family="monospace" font-size="7px">TWO</text>
    
    <rect x="1580" y="90" width="120" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1585" y="85" fill="#FF4444" font-family="monospace" font-size="7px">GLOBAL IDENTITY</text>
    
    <rect x="1750" y="90" width="60" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1755" y="85" fill="#FF4444" font-family="monospace" font-size="7px">003</text>
    
    <!-- LEFT TEXT COLUMNS -->
    <rect x="90" y="160" width="200" height="440" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="95" y="155" fill="#FF4444" font-family="monospace" font-size="7px">LEFT COL 1</text>
    
    <rect x="320" y="160" width="200" height="440" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="325" y="155" fill="#FF4444" font-family="monospace" font-size="7px">LEFT COL 2</text>
    
    <rect x="550" y="160" width="200" height="440" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="555" y="155" fill="#FF4444" font-family="monospace" font-size="7px">LEFT COL 3</text>
    
    <rect x="780" y="160" width="110" height="440" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="785" y="155" fill="#FF4444" font-family="monospace" font-size="7px">LEFT COL 4</text>
    
    <!-- RIGHT TEXT COLUMNS -->
    <rect x="1010" y="160" width="190" height="440" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1015" y="155" fill="#FF4444" font-family="monospace" font-size="7px">RIGHT COL 1</text>
    
    <rect x="1230" y="160" width="200" height="440" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1235" y="155" fill="#FF4444" font-family="monospace" font-size="7px">RIGHT COL 2</text>
    
    <rect x="1460" y="160" width="200" height="440" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1465" y="155" fill="#FF4444" font-family="monospace" font-size="7px">RIGHT COL 3</text>
    
    <rect x="1690" y="160" width="110" height="440" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1695" y="155" fill="#FF4444" font-family="monospace" font-size="7px">RIGHT COL 4</text>
    
    <!-- ARTWORK GALLERY ELEMENTS -->
    <rect x="100" y="680" width="270" height="180" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="105" y="675" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">ARTWORK 1</text>
    
    <rect x="410" y="680" width="270" height="180" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="415" y="675" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">ARTWORK 2</text>
    
    <rect x="720" y="680" width="270" height="180" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="725" y="675" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">ARTWORK 3</text>
    
    <rect x="1030" y="680" width="270" height="180" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="1035" y="675" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">ARTWORK 4</text>
    
    <rect x="1340" y="680" width="270" height="180" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="1345" y="675" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">ARTWORK 5</text>
    
    <rect x="1650" y="680" width="150" height="180" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="1655" y="675" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">ART 6</text>
    
    <!-- Artwork captions -->
    <rect x="100" y="880" width="270" height="60" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="105" y="875" fill="#FF4444" font-family="monospace" font-size="6px">CAPTION 1</text>
    
    <rect x="410" y="880" width="270" height="60" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="415" y="875" fill="#FF4444" font-family="monospace" font-size="6px">CAPTION 2</text>
    
    <rect x="720" y="880" width="270" height="60" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="725" y="875" fill="#FF4444" font-family="monospace" font-size="6px">CAPTION 3</text>
    
    <rect x="1030" y="880" width="270" height="60" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1035" y="875" fill="#FF4444" font-family="monospace" font-size="6px">CAPTION 4</text>
    
    <rect x="1340" y="880" width="270" height="60" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1345" y="875" fill="#FF4444" font-family="monospace" font-size="6px">CAPTION 5</text>
    
    <!-- Timeline chart -->
    <rect x="100" y="1140" width="1680" height="80" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="105" y="1135" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">TIMELINE VISUALIZATION</text>
    
    <!-- Side bibliography -->
    <rect x="100" y="980" width="270" height="120" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="105" y="975" fill="#FF4444" font-family="monospace" font-size="7px">BIBLIOGRAPHY</text>
  </g>

  <!-- LAYER 4: Proportional Analysis -->
  <g id="layer-proportions" data-layer="proportions">
    <!-- Golden ratio divisions -->
    <line x1="730" y1="60" x2="730" y2="1240" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="735" y="80" fill="#FFD700" font-family="monospace" font-size="8px">φ Left: 38.4%</text>
    
    <line x1="1170" y1="60" x2="1170" y2="1240" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="1175" y="80" fill="#FFD700" font-family="monospace" font-size="8px">φ Right: 61.6%</text>
    
    <!-- Gallery proportional emphasis -->
    <rect x="80" y="660" width="1740" height="420" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="85" y="1090" fill="#FFD700" font-family="monospace" font-size="8px">Gallery: 91.6% × 32.3%</text>
    
    <!-- Text area proportional analysis -->
    <rect x="80" y="140" width="1740" height="480" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="85" y="630" fill="#FFD700" font-family="monospace" font-size="8px">Text: 91.6% × 36.9%</text>
    
    <!-- Central proportional marker -->
    <circle cx="950" cy="650" r="8" fill="#FFD700" opacity="0.7"/>
    <text x="960" y="655" fill="#FFD700" font-family="monospace" font-size="8px">Center</text>
  </g>

  <!-- LAYER 5: Flow & Hierarchy -->
  <g id="layer-flow" data-layer="flow">
    <!-- Reading flow -->
    <circle cx="190" cy="300" r="14" fill="#8844CC" opacity="0.8"/>
    <text x="185" y="306" fill="white" font-family="monospace" font-size="10px" font-weight="bold">1</text>
    
    <circle cx="950" cy="800" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="946" y="805" fill="white" font-family="monospace" font-size="9px" font-weight="bold">2</text>
    
    <circle cx="950" cy="1180" r="10" fill="#8844CC" opacity="0.7"/>
    <text x="947" y="1185" fill="white" font-family="monospace" font-size="8px" font-weight="bold">3</text>
    
    <circle cx="1710" cy="300" r="8" fill="#8844CC" opacity="0.6"/>
    <text x="1707" y="305" fill="white" font-family="monospace" font-size="7px" font-weight="bold">4</text>
    
    <!-- Flow arrows -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
              refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8844CC"/>
      </marker>
    </defs>
    
    <path d="M 204 300 Q 600 550 938 800" fill="none" stroke="#8844CC" 
          stroke-width="3" marker-end="url(#arrowhead)" opacity="0.7"/>
    <path d="M 950 812 Q 950 1000 950 1170" fill="none" stroke="#8844CC" 
          stroke-width="2" marker-end="url(#arrowhead)" opacity="0.6"/>
  </g>

  <!-- LAYER 6: Info Panel -->
  <g id="layer-info" data-layer="info">
    <rect x="0" y="1300" width="1900" height="200" fill="#1a1a1a"/>
    
    <text x="20" y="1325" fill="white" font-family="monospace" font-size="14px" font-weight="bold">GRID ANALYSIS — MAGAZINE EDITORIAL SPREAD: ARTWORK SHOWCASE FORMAT</text>
    
    <text x="20" y="1345" fill="#FFD700" font-family="monospace" font-size="10px">FORMAT:</text>
    <text x="120" y="1345" fill="white" font-family="monospace" font-size="10px">1900×1300px double-page magazine spread | Art &amp; culture publication | Editorial showcase format</text>
    
    <text x="20" y="1360" fill="#00CED1" font-family="monospace" font-size="10px">LAYOUT:</text>
    <text x="120" y="1360" fill="white" font-family="monospace" font-size="10px">Dense text columns (4+4) | Central artwork gallery | Timeline chart | Professional bibliography</text>
    
    <text x="20" y="1375" fill="#FF4444" font-family="monospace" font-size="10px">CONTENT:</text>
    <text x="120" y="1375" fill="white" font-family="monospace" font-size="10px">Multi-column editorial text | 5-6 artwork images with captions | Timeline visualization | Reference materials</text>
    
    <text x="20" y="1390" fill="#8844CC" font-family="monospace" font-size="10px">HIERARCHY:</text>
    <text x="120" y="1390" fill="white" font-family="monospace" font-size="10px">1. Editorial text | 2. Artwork gallery | 3. Timeline chart | 4. Bibliography &amp; references</text>
    
    <text x="20" y="1430" fill="#FFD700" font-family="monospace" font-size="9px">OBSERVATIONS:</text>
    <text x="20" y="1445" fill="white" font-family="monospace" font-size="9px">Academic magazine format | Dense information architecture | Visual-textual integration | Timeline adds historical context</text>
    <text x="20" y="1458" fill="white" font-family="monospace" font-size="9px">Professional editorial design | Systematic column structure | Artwork showcasing with scholarly approach</text>
    <text x="20" y="1471" fill="white" font-family="monospace" font-size="9px">Art &amp; culture publication standards | Research-based layout methodology</text>
  </g>

</svg>