<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1400 1000" 
     role="img" aria-label="Grid analysis: Apse Magazine Double-Page Spread">

  <!-- LAYER 1: Page Frame & Margins -->
  <g id="layer-page" data-layer="page">
    <rect x="0" y="0" width="1400" height="900" 
          fill="none" stroke="#FF00FF" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="700" y="15" text-anchor="middle" fill="#FF00FF" 
          font-family="monospace" font-size="12px" font-weight="bold">DOUBLE-PAGE SPREAD: 1400 × 900px (Spiral Bound)</text>
    
    <rect x="50" y="50" width="620" height="800" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="55" y="45" fill="#FF00FF" font-family="monospace" font-size="10px">LEFT PAGE</text>
    
    <rect x="730" y="50" width="620" height="800" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="1045" y="45" fill="#FF00FF" font-family="monospace" font-size="10px">RIGHT PAGE</text>
    
    <!-- Spiral binding -->
    <rect x="670" y="0" width="60" height="900" fill="none" stroke="#FF00FF" stroke-width="2"/>
    <circle cx="685" cy="100" r="4" fill="#FF00FF" opacity="0.7"/>
    <circle cx="700" cy="100" r="4" fill="#FF00FF" opacity="0.7"/>
    <circle cx="715" cy="100" r="4" fill="#FF00FF" opacity="0.7"/>
    <text x="685" y="40" fill="#FF00FF" font-family="monospace" font-size="8px">SPIRAL</text>
    
    <rect x="80" y="80" width="560" height="740" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="760" y="80" width="560" height="740" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- LAYER 2: Grid System -->
  <g id="layer-grid" data-layer="grid">
    <!-- LEFT PAGE: Typography-dominated -->
    <rect x="100" y="150" width="500" height="400" fill="none" stroke="#00CED1" stroke-width="2"/>
    <text x="105" y="145" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">LARGE TYPOGRAPHY ZONE</text>
    
    <line x1="140" y1="580" x2="140" y2="800" stroke="#00CED1" stroke-width="1"/>
    <line x1="280" y1="580" x2="280" y2="800" stroke="#00CED1" stroke-width="1"/>
    <line x1="420" y1="580" x2="420" y2="800" stroke="#00CED1" stroke-width="1"/>
    <line x1="560" y1="580" x2="560" y2="800" stroke="#00CED1" stroke-width="1"/>
    
    <!-- RIGHT PAGE: Text and image grid -->
    <line x1="820" y1="150" x2="820" y2="600" stroke="#00CED1" stroke-width="1"/>
    <line x1="1000" y1="150" x2="1000" y2="600" stroke="#00CED1" stroke-width="1"/>
    <line x1="1180" y1="150" x2="1180" y2="600" stroke="#00CED1" stroke-width="1"/>
    
    <rect x="780" y="350" width="180" height="120" fill="none" stroke="#00CED1" stroke-width="1"/>
    <rect x="980" y="620" width="160" height="160" fill="none" stroke="#00CED1" stroke-width="1"/>
    
    <line x1="780" y1="600" x2="1300" y2="600" stroke="#00CED1" stroke-width="0.5"/>
  </g>

  <!-- LAYER 3: Content Blocks -->
  <g id="layer-content" data-layer="content">
    <!-- Large "apse" typography -->
    <rect x="110" y="160" width="480" height="380" fill="none" stroke="#FF4444" stroke-width="3"/>
    <text x="115" y="155" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">LARGE "APSE" TYPOGRAPHY</text>
    
    <rect x="130" y="200" width="80" height="300" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="135" y="195" fill="#FF4444" font-family="monospace" font-size="7px">"a"</text>
    
    <rect x="230" y="200" width="90" height="300" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="235" y="195" fill="#FF4444" font-family="monospace" font-size="7px">"p"</text>
    
    <rect x="340" y="200" width="90" height="300" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="345" y="195" fill="#FF4444" font-family="monospace" font-size="7px">"s"</text>
    
    <rect x="450" y="200" width="90" height="300" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="455" y="195" fill="#FF4444" font-family="monospace" font-size="7px">"e"</text>
    
    <!-- Left page text columns -->
    <rect x="90" y="590" width="120" height="200" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="230" y="590" width="120" height="200" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="370" y="590" width="120" height="200" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="510" y="590" width="120" height="200" fill="none" stroke="#FF4444" stroke-width="1"/>
    
    <!-- RIGHT PAGE CONTENT -->
    <rect x="780" y="160" width="180" height="180" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="785" y="155" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">MAIN TEXT 1</text>
    
    <rect x="980" y="160" width="180" height="180" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="985" y="155" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">MAIN TEXT 2</text>
    
    <rect x="1180" y="160" width="120" height="180" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="1185" y="155" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">MAIN TEXT 3</text>
    
    <!-- Architectural photographs -->
    <rect x="790" y="360" width="160" height="100" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="795" y="355" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">ARCH PHOTO 1</text>
    
    <rect x="990" y="630" width="140" height="140" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="995" y="625" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">ARCH PHOTO 2</text>
    
    <!-- Numbered references -->
    <circle cx="1000" cy="390" r="8" fill="#FF4444" opacity="0.7"/>
    <text x="997" y="394" fill="white" font-family="monospace" font-size="7px" font-weight="bold">1</text>
    
    <circle cx="1000" cy="420" r="8" fill="#FF4444" opacity="0.7"/>
    <text x="997" y="424" fill="white" font-family="monospace" font-size="7px" font-weight="bold">2</text>
    
    <!-- Lower text blocks -->
    <rect x="780" y="630" width="180" height="140" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="1160" y="630" width="140" height="140" fill="none" stroke="#FF4444" stroke-width="1"/>
  </g>

  <!-- LAYER 4: Proportional Analysis -->
  <g id="layer-proportions" data-layer="proportions">
    <line x1="535" y1="80" x2="535" y2="820" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="540" y="100" fill="#FFD700" font-family="monospace" font-size="8px">φ Left: 61.8%</text>
    
    <rect x="105" y="155" width="490" height="390" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="110" y="560" fill="#FFD700" font-family="monospace" font-size="8px">"apse" zone: 35% × 43%</text>
    
    <circle cx="700" cy="450" r="8" fill="#FFD700" opacity="0.7"/>
  </g>

  <!-- LAYER 5: Flow & Hierarchy -->
  <g id="layer-flow" data-layer="flow">
    <circle cx="350" cy="350" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="345" y="355" fill="white" font-family="monospace" font-size="9px" font-weight="bold">1</text>
    
    <circle cx="880" cy="270" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="875" y="275" fill="white" font-family="monospace" font-size="9px" font-weight="bold">2</text>
    
    <circle cx="1060" cy="700" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="1055" y="705" fill="white" font-family="monospace" font-size="9px" font-weight="bold">3</text>
    
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
              refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8844CC"/>
      </marker>
    </defs>
  </g>

  <!-- LAYER 6: Info Panel -->
  <g id="layer-info" data-layer="info">
    <rect x="0" y="900" width="1400" height="200" fill="#1a1a1a"/>
    
    <text x="20" y="925" fill="white" font-family="monospace" font-size="14px" font-weight="bold">GRID ANALYSIS — APSE MAGAZINE DOUBLE-PAGE SPREAD</text>
    
    <text x="20" y="945" fill="#FFD700" font-family="monospace" font-size="10px">FORMAT:</text>
    <text x="120" y="945" fill="white" font-family="monospace" font-size="10px">1400×900px spiral-bound spread | Individual pages: 620×800px | Magazine format</text>
    
    <text x="20" y="960" fill="#00CED1" font-family="monospace" font-size="10px">LAYOUT:</text>
    <text x="120" y="960" fill="white" font-family="monospace" font-size="10px">Asymmetric: Left typography-dominant | Right text+image editorial | 4-column system per page</text>
    
    <text x="20" y="975" fill="#FF4444" font-family="monospace" font-size="10px">TYPE:</text>
    <text x="120" y="975" fill="white" font-family="monospace" font-size="10px">Large "apse" display (35% page area) | Ultra-bold sans-serif | Editorial body text</text>
    
    <text x="20" y="1030" fill="#FFD700" font-family="monospace" font-size="9px">OBSERVATIONS:</text>
    <text x="20" y="1045" fill="white" font-family="monospace" font-size="9px">Typography as hero element | "apse" creates architectural connection with content theme</text>
    <text x="20" y="1058" fill="white" font-family="monospace" font-size="9px">Spiral binding format | Strong typographic contrast creates visual hierarchy</text>
  </g>

</svg>