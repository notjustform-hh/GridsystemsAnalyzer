<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1200 600" 
     role="img" aria-label="Grid analysis: Scientific Data Cards - New Horizons Mission">

  <!-- LAYER 1: Page Frame & Margins -->
  <g id="layer-page" data-layer="page">
    <rect x="0" y="0" width="1200" height="600" 
          fill="none" stroke="#FF00FF" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="600" y="15" text-anchor="middle" fill="#FF00FF" 
          font-family="monospace" font-size="12px" font-weight="bold">SCIENTIFIC DATA CARDS: 1200 × 600px (Dual Card Format)</text>
    
    <!-- Card boundaries -->
    <rect x="20" y="20" width="560" height="560" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="25" y="15" fill="#FF00FF" font-family="monospace" font-size="10px">LEFT CARD - DATA</text>
    
    <rect x="620" y="20" width="560" height="560" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="900" y="15" fill="#FF00FF" font-family="monospace" font-size="10px">RIGHT CARD - TYPOGRAPHY</text>
    
    <!-- Central gap -->
    <rect x="580" y="0" width="40" height="600" fill="none" stroke="#FF00FF" stroke-width="2"/>
    <text x="590" y="25" fill="#FF00FF" font-family="monospace" font-size="8px" transform="rotate(90 590 25)">GAP</text>
    
    <!-- Working margins -->
    <rect x="40" y="40" width="520" height="520" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="640" y="40" width="520" height="520" 
          fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- LAYER 2: Grid System -->
  <g id="layer-grid" data-layer="grid">
    <!-- LEFT CARD: Scientific data layout -->
    <rect x="60" y="60" width="480" height="480" fill="none" stroke="#00CED1" stroke-width="2"/>
    <text x="65" y="55" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">SCIENTIFIC DATA AREA</text>
    
    <!-- Data sections left card -->
    <rect x="80" y="80" width="140" height="120" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="85" y="75" fill="#00CED1" font-family="monospace" font-size="8px">IMAGE AREA</text>
    
    <rect x="240" y="80" width="280" height="80" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="245" y="75" fill="#00CED1" font-family="monospace" font-size="8px">COORDINATES &amp; DATA</text>
    
    <rect x="80" y="220" width="440" height="200" fill="none" stroke="#00CED1" stroke-width="1.5"/>
    <text x="85" y="215" fill="#00CED1" font-family="monospace" font-size="8px">TECHNICAL SPECIFICATIONS</text>
    
    <rect x="80" y="440" width="440" height="80" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="85" y="435" fill="#00CED1" font-family="monospace" font-size="8px">MISSION INFO</text>
    
    <!-- RIGHT CARD: Typography layout -->
    <rect x="660" y="60" width="480" height="480" fill="none" stroke="#00CED1" stroke-width="2"/>
    <text x="665" y="55" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">TYPOGRAPHY AREA</text>
    
    <!-- Typography sections -->
    <rect x="680" y="140" width="440" height="200" fill="none" stroke="#00CED1" stroke-width="2"/>
    <text x="685" y="135" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">MAIN TYPOGRAPHY ZONE</text>
    
    <!-- Striped pattern area -->
    <rect x="680" y="360" width="440" height="160" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="685" y="355" fill="#00CED1" font-family="monospace" font-size="8px">STRIPED PATTERN AREA</text>
  </g>

  <!-- LAYER 3: Content Blocks -->
  <g id="layer-content" data-layer="content">
    <!-- LEFT CARD CONTENT -->
    <!-- Small image placeholder -->
    <rect x="90" y="90" width="120" height="100" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="95" y="85" fill="#FF4444" font-family="monospace" font-size="7px">SPACE IMAGE</text>
    
    <!-- Coordinate data -->
    <rect x="250" y="90" width="260" height="60" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="255" y="85" fill="#FF4444" font-family="monospace" font-size="7px">MU69 COORDINATES</text>
    
    <!-- Technical specs section -->
    <rect x="90" y="230" width="420" height="180" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="95" y="225" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">OBSERVATION ARC DATA</text>
    
    <!-- Mission identifier -->
    <rect x="90" y="450" width="420" height="60" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="95" y="445" fill="#FF4444" font-family="monospace" font-size="7px">NEW HORIZONS MISSION</text>
    
    <!-- RIGHT CARD CONTENT -->
    <!-- Large "NEW HORIZONS" text -->
    <rect x="690" y="150" width="420" height="180" fill="none" stroke="#FF4444" stroke-width="3"/>
    <text x="695" y="145" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">LARGE "NEW HORIZONS"</text>
    
    <!-- Striped pattern -->
    <rect x="690" y="370" width="420" height="140" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="695" y="365" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">GEOMETRIC STRIPES</text>
    
    <!-- Typography details -->
    <rect x="750" y="90" width="100" height="40" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="755" y="85" fill="#FF4444" font-family="monospace" font-size="6px">MISSION ID</text>
    
    <rect x="900" y="90" width="120" height="40" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="905" y="85" fill="#FF4444" font-family="monospace" font-size="6px">DATE/TIME</text>
  </g>

  <!-- LAYER 4: Proportional Analysis -->
  <g id="layer-proportions" data-layer="proportions">
    <!-- Golden ratio divisions for left card -->
    <line x1="228" y1="40" x2="228" y2="560" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="233" y="60" fill="#FFD700" font-family="monospace" font-size="8px">φ Left: 38.2%</text>
    
    <!-- Golden ratio divisions for right card -->
    <line x1="828" y1="40" x2="828" y2="560" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="833" y="60" fill="#FFD700" font-family="monospace" font-size="8px">φ Right: 38.2%</text>
    
    <!-- Data area proportional analysis -->
    <rect x="80" y="220" width="440" height="200" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="85" y="430" fill="#FFD700" font-family="monospace" font-size="8px">Data: 78.6% × 35.7%</text>
    
    <!-- Typography area proportional analysis -->
    <rect x="690" y="150" width="420" height="180" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="695" y="340" fill="#FFD700" font-family="monospace" font-size="8px">Type: 75% × 32.1%</text>
    
    <!-- Central proportional markers -->
    <circle cx="300" cy="300" r="6" fill="#FFD700" opacity="0.7"/>
    <text x="310" y="305" fill="#FFD700" font-family="monospace" font-size="8px">Center L</text>
    
    <circle cx="900" cy="300" r="6" fill="#FFD700" opacity="0.7"/>
    <text x="910" y="305" fill="#FFD700" font-family="monospace" font-size="8px">Center R</text>
  </g>

  <!-- LAYER 5: Flow & Hierarchy -->
  <g id="layer-flow" data-layer="flow">
    <!-- LEFT CARD hierarchy -->
    <circle cx="150" cy="140" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="146" y="145" fill="white" font-family="monospace" font-size="9px" font-weight="bold">1</text>
    
    <circle cx="370" cy="120" r="10" fill="#8844CC" opacity="0.8"/>
    <text x="367" y="125" fill="white" font-family="monospace" font-size="8px" font-weight="bold">2</text>
    
    <circle cx="300" cy="320" r="10" fill="#8844CC" opacity="0.7"/>
    <text x="297" y="325" fill="white" font-family="monospace" font-size="8px" font-weight="bold">3</text>
    
    <circle cx="300" cy="480" r="8" fill="#8844CC" opacity="0.6"/>
    <text x="297" y="485" fill="white" font-family="monospace" font-size="7px" font-weight="bold">4</text>
    
    <!-- RIGHT CARD hierarchy -->
    <circle cx="900" cy="240" r="14" fill="#8844CC" opacity="0.8"/>
    <text x="896" y="246" fill="white" font-family="monospace" font-size="10px" font-weight="bold">1</text>
    
    <circle cx="900" cy="440" r="10" fill="#8844CC" opacity="0.7"/>
    <text x="897" y="445" fill="white" font-family="monospace" font-size="8px" font-weight="bold">2</text>
    
    <!-- Flow arrows -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
              refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8844CC"/>
      </marker>
    </defs>
    
    <path d="M 162 140 Q 330 130 358 120" fill="none" stroke="#8844CC" 
          stroke-width="2" marker-end="url(#arrowhead)" opacity="0.7"/>
    <path d="M 300 330 Q 300 400 300 470" fill="none" stroke="#8844CC" 
          stroke-width="2" marker-end="url(#arrowhead)" opacity="0.6"/>
  </g>

  <!-- LAYER 6: Info Panel -->
  <g id="layer-info" data-layer="info">
    <rect x="0" y="600" width="1200" height="180" fill="#1a1a1a"/>
    
    <text x="20" y="625" fill="white" font-family="monospace" font-size="14px" font-weight="bold">GRID ANALYSIS — SCIENTIFIC DATA CARDS: NEW HORIZONS MISSION</text>
    
    <text x="20" y="645" fill="#FFD700" font-family="monospace" font-size="10px">FORMAT:</text>
    <text x="120" y="645" fill="white" font-family="monospace" font-size="10px">1200×600px dual card layout | Scientific data visualization | Space mission format</text>
    
    <text x="20" y="660" fill="#00CED1" font-family="monospace" font-size="10px">LAYOUT:</text>
    <text x="120" y="660" fill="white" font-family="monospace" font-size="10px">Left: Scientific data &amp; coordinates | Right: Bold typography with geometric patterns</text>
    
    <text x="20" y="675" fill="#FF4444" font-family="monospace" font-size="10px">CONTENT:</text>
    <text x="120" y="675" fill="white" font-family="monospace" font-size="10px">Astronomical coordinates | Technical specifications | "NEW HORIZONS" branding | Striped graphics</text>
    
    <text x="20" y="690" fill="#8844CC" font-family="monospace" font-size="10px">HIERARCHY:</text>
    <text x="120" y="690" fill="white" font-family="monospace" font-size="10px">1. Mission branding | 2. Technical data | 3. Coordinates | 4. Mission identification</text>
    
    <text x="20" y="730" fill="#FFD700" font-family="monospace" font-size="9px">OBSERVATIONS:</text>
    <text x="20" y="745" fill="white" font-family="monospace" font-size="9px">Scientific precision design | High contrast black &amp; white aesthetic | Technical data presentation</text>
    <text x="20" y="758" fill="white" font-family="monospace" font-size="9px">Space mission branding | Geometric pattern integration | Professional scientific format</text>
    <text x="20" y="771" fill="white" font-family="monospace" font-size="9px">Dual card approach creates contrast between data and identity elements</text>
  </g>

</svg>