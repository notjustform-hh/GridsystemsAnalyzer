<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1400 1000" 
     role="img" aria-label="Grid analysis: Typography Specimen Double-Page Spread">

  <!-- LAYER 1: Page Frame & Margins -->
  <g id="layer-page" data-layer="page">
    <rect x="0" y="0" width="1400" height="900" 
          fill="none" stroke="#FF00FF" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="700" y="15" text-anchor="middle" fill="#FF00FF" 
          font-family="monospace" font-size="12px" font-weight="bold">DOUBLE-PAGE SPREAD: 1400 × 900px</text>
    
    <rect x="30" y="30" width="650" height="840" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="35" y="25" fill="#FF00FF" font-family="monospace" font-size="10px">LEFT PAGE</text>
    
    <rect x="720" y="30" width="650" height="840" 
          fill="none" stroke="#FF00FF" stroke-width="1.5"/>
    <text x="1045" y="25" fill="#FF00FF" font-family="monospace" font-size="10px">RIGHT PAGE</text>
    
    <line x1="700" y1="0" x2="700" y2="900" stroke="#FF00FF" stroke-width="3"/>
    <text x="705" y="15" fill="#FF00FF" font-family="monospace" font-size="9px">SPINE</text>
    
    <rect x="30" y="30" width="1340" height="40" fill="none" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="35" y="25" fill="#8B0000" font-family="monospace" font-size="8px">Repeated header across spread</text>
  </g>

  <!-- LAYER 2: Grid System -->
  <g id="layer-grid" data-layer="grid">
    <rect x="80" y="120" width="520" height="700" fill="none" stroke="#00CED1" stroke-width="1"/>
    <text x="85" y="115" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">TEXT AREA</text>
    
    <line x1="780" y1="120" x2="780" y2="820" stroke="#00CED1" stroke-width="1"/>
    <line x1="920" y1="120" x2="920" y2="820" stroke="#00CED1" stroke-width="1"/>
    <line x1="1060" y1="120" x2="1060" y2="820" stroke="#00CED1" stroke-width="1"/>
    <line x1="1200" y1="120" x2="1200" y2="820" stroke="#00CED1" stroke-width="1"/>
    
    <line x1="720" y1="250" x2="1370" y2="250" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="720" y1="400" x2="1370" y2="400" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="720" y1="550" x2="1370" y2="550" stroke="#00CED1" stroke-width="0.5"/>
    <line x1="720" y1="700" x2="1370" y2="700" stroke="#00CED1" stroke-width="0.5"/>
    
    <text x="730" y="115" fill="#00CED1" font-family="monospace" font-size="9px" font-weight="bold">LETTERFORM GRID</text>
  </g>

  <!-- LAYER 3: Content Blocks -->
  <g id="layer-content" data-layer="content">
    <!-- Headers -->
    <rect x="40" y="40" width="120" height="12" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="45" y="35" fill="#FF4444" font-family="monospace" font-size="7px">SPECIMEN MAGAZINE</text>
    
    <rect x="240" y="40" width="60" height="12" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="245" y="35" fill="#FF4444" font-family="monospace" font-size="7px">THREE</text>
    
    <rect x="740" y="40" width="120" height="12" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="745" y="35" fill="#FF4444" font-family="monospace" font-size="7px">SPECIMEN MAGAZINE</text>
    
    <!-- LEFT PAGE: Handwritten text -->
    <rect x="90" y="130" width="500" height="680" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="95" y="125" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">HANDWRITTEN SPECIMEN</text>
    <text x="95" y="137" fill="#FF4444" font-family="monospace" font-size="8px">"abcANwe", "nfrEjVutx", "kvYolyM", "psgaaPm"</text>
    
    <rect x="110" y="160" width="200" height="25" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="110" y="220" width="180" height="25" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="110" y="280" width="160" height="25" fill="none" stroke="#FF4444" stroke-width="1"/>
    <rect x="110" y="340" width="150" height="25" fill="none" stroke="#FF4444" stroke-width="1"/>
    
    <rect x="480" y="750" width="80" height="40" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="485" y="745" fill="#FF4444" font-family="monospace" font-size="7px">Date: 25.2.4</text>
    
    <!-- RIGHT PAGE: Large letterforms -->
    <rect x="750" y="130" width="580" height="680" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="755" y="125" fill="#FF4444" font-family="monospace" font-size="9px" font-weight="bold">LETTERFORM CONSTRUCTION</text>
    
    <rect x="770" y="160" width="120" height="150" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <rect x="920" y="160" width="120" height="150" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <rect x="1070" y="160" width="120" height="150" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <rect x="1220" y="160" width="120" height="150" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    
    <circle cx="1050" cy="470" r="140" fill="none" stroke="#FF4444" stroke-width="2"/>
    <text x="975" y="465" fill="#FF4444" font-family="monospace" font-size="8px" font-weight="bold">CIRCULAR FORM</text>
    
    <rect x="1220" y="800" width="100" height="20" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="1225" y="795" fill="#FF4444" font-family="monospace" font-size="7px">Akira Kobayashi</text>
  </g>

  <!-- LAYER 4: Proportional Analysis -->
  <g id="layer-proportions" data-layer="proportions">
    <line x1="535" y1="70" x2="535" y2="870" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="540" y="90" fill="#FFD700" font-family="monospace" font-size="8px">φ Left: 61.8%</text>
    
    <circle cx="1050" cy="470" r="145" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="700" cy="450" r="8" fill="#FFD700" opacity="0.7"/>
  </g>

  <!-- LAYER 5: Flow & Hierarchy -->
  <g id="layer-flow" data-layer="flow">
    <circle cx="300" cy="400" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="295" y="405" fill="white" font-family="monospace" font-size="9px" font-weight="bold">1</text>
    
    <circle cx="1050" cy="470" r="12" fill="#8844CC" opacity="0.8"/>
    <text x="1045" y="475" fill="white" font-family="monospace" font-size="9px" font-weight="bold">2</text>
    
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
              refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8844CC"/>
      </marker>
    </defs>
  </g>

  <!-- LAYER 6: Info Panel -->
  <g id="layer-info" data-layer="info">
    <rect x="0" y="900" width="1400" height="200" fill="#1a1a1a"/>
    
    <text x="20" y="925" fill="white" font-family="monospace" font-size="14px" font-weight="bold">GRID ANALYSIS — TYPOGRAPHY SPECIMEN DOUBLE-PAGE SPREAD</text>
    
    <text x="20" y="945" fill="#FFD700" font-family="monospace" font-size="10px">SPREAD:</text>
    <text x="120" y="945" fill="white" font-family="monospace" font-size="10px">1400×900px | Pages: 650×840px | Aspect: 1.56:1 | φ proximity: 96% match</text>
    
    <text x="20" y="960" fill="#00CED1" font-family="monospace" font-size="10px">LAYOUT:</text>
    <text x="120" y="960" fill="white" font-family="monospace" font-size="10px">Left: handwritten specimen | Right: letterform construction grid | Educational comparison</text>
    
    <text x="20" y="975" fill="#FF4444" font-family="monospace" font-size="10px">TYPE:</text>
    <text x="120" y="975" fill="white" font-family="monospace" font-size="10px">Italic handwriting vs constructed letterforms | Process vs result demonstration</text>
    
    <text x="20" y="1030" fill="#FFD700" font-family="monospace" font-size="9px">OBSERVATIONS:</text>
    <text x="20" y="1045" fill="white" font-family="monospace" font-size="9px">Educational design contrasting organic handwriting with systematic letterform construction</text>
    <text x="20" y="1058" fill="white" font-family="monospace" font-size="9px">Designer: Akira Kobayashi | Typography specimen showing design process and methodology</text>
  </g>

</svg>